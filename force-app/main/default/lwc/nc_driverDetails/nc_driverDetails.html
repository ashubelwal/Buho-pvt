<template>
    <div class="test">
        <div class="pageTitle slds-m-bottom_medium">
            <!-- <h2 class="slds-text-heading_medium">Please confirm the registered owner of the vehicle</h2> -->
            <h2 class="slds-text-heading_medium">Please confirm the vehicle Owner and Drivers</h2>
        </div>

        <!-- Ownership Type Selection -->
        <div class="slds-box slds-theme_default slds-m-bottom_large">
            <div class="slds-grid slds-wrap">
                <div class="slds-size_1-of-1 slds-medium-size_1-of-2">
                    <div class="slds-card slds-card_boundary slds-p-around_medium 
                        slds-text-align_center ownership-option"
                        data-value="business"
                        onclick={handleOwnershipSelection}>
                        <template if:true ={isSelected}>
                            <lightning-icon icon-name="utility:company" size="large" class="slds-m-bottom_small selected-ownership">
                            </lightning-icon>
                            <h3 class="slds-text-heading_small slds-m-bottom_x-small">Business Vehicle</h3>
                            <p class="slds-text-body_small slds-text-color_weak">Registered to a company</p>
                        </template>
                        <template if:false ={isSelected}>
                            <lightning-icon icon-name="utility:company" size="large" class="slds-m-bottom_small">
                            </lightning-icon>
                            <h3 class="slds-text-heading_small slds-m-bottom_x-small">Business Vehicle</h3>
                            <p class="slds-text-body_small slds-text-color_weak">Registered to a company</p>
                        </template>
                   </div>
                </div>
                <div class="slds-size_1-of-1 slds-medium-size_1-of-2">
                    <div class="slds-card slds-card_boundary slds-p-around_medium 
                        slds-text-align_center ownership-option"
                        data-value="personal"
                        onclick={handleOwnershipSelection}>
                        <template if:false={isSelected}>  
                            <lightning-icon icon-name="utility:user" size="large" class="slds-m-bottom_small selected-ownership">
                            </lightning-icon>
                            <h3 class="slds-text-heading_small slds-m-bottom_x-small">Personal Vehicle</h3>
                            <p class="slds-text-body_small slds-text-color_weak">Registered to an individual</p>
                        </template>
                        <template if:true={isSelected}>  
                            <lightning-icon icon-name="utility:user" size="large" class="slds-m-bottom_small">
                            </lightning-icon>
                            <h3 class="slds-text-heading_small slds-m-bottom_x-small">Personal Vehicle</h3>
                            <p class="slds-text-body_small slds-text-color_weak">Registered to an individual</p>
                        </template>
                   </div>
                </div>                
            </div>
        </div>

        <div class="slds-grid slds-wrap slds-m-bottom_medium slds-hidden">
            <template if:false={flag.isOwner}>
                <lightning-input type="checkbox" label="Check this box if your vehicle is registered to a business"
                    checked={flag.Is_the_vehicle_registered_to_a_business__c} onchange={handleChange}
                    name="Is_the_vehicle_registered_to_a_business__c" disabled={flag.isCompanyDisabled}>
                </lightning-input>
            </template>

            <template if:false={flag.Is_the_vehicle_registered_to_a_business__c}>
                <template if:false={flag.isOwner}>
                    <lightning-input type="checkbox" label="Registered Owner?" checked={driver.Driver_Type__c}
                        onchange={handleChange} name="Driver_Type__c">
                    </lightning-input>
                </template>
            </template>
        </div>

        <!-- Step: Company Details -->
        <template if:true={isStepCompanyDetails}>
            <div class="slds-size_1-of-1">

                <div class="pageTitle slds-m-bottom_small">
                    <h2 class="slds-text-heading_medium">Add company information</h2>
                </div>
                <c-nc_company-information onadd={handleCompanyInfoUpdate} payload={payload}></c-nc_company-information>

                <div class="slds-m-top_small slds-grid slds-grid_align-spread">
                    <button type="button" class="slds-button slds-button_brand" onclick={goToDriverForm}>
                            Save and Add Human Operator
                        </button>
                </div>
            </div>
        </template>

        <!-- Step: Human Owner / Driver -->
        <template if:true={isStepHumanOwner}>
            <div class="pageTitle slds-m-bottom_small">
                <h2 class="slds-text-heading_medium">{humanTitle}</h2>
            </div>

            <template if:true={currentUserType}>
                <div class="slds-size_1-of-1 slds-medium-size_6-of-12 slds-p-around_small">
                    <lightning-combobox name="driverSelection" label="Select a driver" placeholder="Select a driver"
                        value={selectedDriverId} options={loginUserDriverOption} onchange={changeDriverOption}>
                    </lightning-combobox>
                </div>
            </template>
            <!-- Mostrar botón Edit Company si ya es company y no estamos en companyDetails -->
            <template if:true={flag.Is_the_vehicle_registered_to_a_business__c}>
                <template if:false={isStepCompanyDetails}>
                    <div class="slds-m-bottom_small">
                        <button type="button" class="slds-button slds-button_neutral" onclick={goToCompanyDetails}>
                            Edit Company Info
                        </button>
                    </div>
                </template>
            </template>


            <!-- Driver Info Form -->
            <div class="slds-grid slds-wrap slds-gutters">
                <div class="slds-size_1-of-1 slds-medium-size_3-of-12 slds-p-around_small">
                    <lightning-input label="First Name" value={driver.First_Name__c} onchange={handleChange}
                        name="First_Name__c" required></lightning-input>
                </div>
                <div class="slds-size_1-of-1 slds-medium-size_3-of-12 slds-p-around_small">
                    <lightning-input label="Last Name" value={driver.Last_Name__c} onchange={handleChange}
                        name="Last_Name__c" required></lightning-input>
                </div>
                <template if:true={minDateAllowed}>
                    <div class="slds-size_1-of-1 slds-medium-size_3-of-12 slds-p-around_small">
                        <lightning-input type="date" label="Date of Birth" value={driver.Dob__c} max={minDateAllowed}
                            onchange={handleChange} name="Dob__c" required></lightning-input>
                    </div>
                </template>
            </div>

            <div class="slds-grid slds-wrap slds-gutters">
                <div class="slds-size_1-of-1 slds-medium-size_3-of-12 slds-p-around_small">
                    <c-nc_combobox input-label="License Country" name="License_Country__c" options={countryOptions}
                        onselect={handleOptionClick} onreset={handleChildComboboxReset} onaddnew={handleAddValue}
                        search-value={driver.License_Country__c} inputrequired="true">
                    </c-nc_combobox>
                </div>
                <div class="slds-size_1-of-1 slds-medium-size_3-of-12 slds-p-around_small">
                    <c-nc_combobox input-label="License State" name="License_state__c" options={stateOptions}
                        onselect={handleOptionClick} onaddnew={handleAddValue} search-value={driver.License_state__c}
                        inputrequired="true" disabled={flag.isStateDisabled}>
                    </c-nc_combobox>
                </div>
                <div class="slds-size_1-of-1 slds-medium-size_3-of-12 slds-p-around_small">
                    <lightning-input type="text" label="License Number" value={driver.license_number__c}
                        onchange={handleChange} pattern="^[A-Z0-9\-]+$" maxlength="40" name="license_number__c"
                        class="uppercase-input" required></lightning-input>
                </div>
            </div>

            <template if:true={driver.Driver_Type__c}>
                <!-- <template if:false={flag.Is_the_vehicle_registered_to_a_business__c}>
                    <template if:false={flag.isOwner}>
                        <lightning-input type="checkbox" label="Registered Owner?" checked={driver.Driver_Type__c}
                            onchange={handleChange} name="Driver_Type__c">
                        </lightning-input>
                    </template>
                </template> -->
                <div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-size_1-of-1 slds-p-around_small">
                        <c-address-recommendations onsendaddress={handleCompanyAddress}></c-address-recommendations>
                    </div>
                    <div class="slds-size_1-of-1 slds-medium-size_3-of-12 slds-p-around_small">
                        <lightning-combobox label="Country" value={driver.Country__c} options={countryOptions}
                            onchange={handleChange} name="Country__c" required></lightning-combobox>
                    </div>
                    <div class="slds-size_1-of-1 slds-medium-size_3-of-12 slds-p-around_small" style="display: none;">
                        <lightning-input label="Country Text" value={driver.Country_Text__c} onchange={handleChange}
                            name="Country_Text__c" required></lightning-input>
                    </div>
                    <div class="slds-size_1-of-1 slds-medium-size_3-of-12 slds-p-around_small">
                        <lightning-input label="State/Province" value={driver.State_Province__c} onchange={handleChange}
                            name="State_Province__c" required></lightning-input>
                    </div>
                    <div class="slds-size_1-of-1 slds-medium-size_3-of-12 slds-p-around_small">
                        <lightning-input label="Postal Code" value={driver.Postal_Code__c} onchange={handleChange}
                            name="Postal_Code__c" required></lightning-input>
                    </div>
                    <div class="slds-size_1-of-1 slds-medium-size_3-of-12 slds-p-around_small">
                        <lightning-input label="City" value={driver.City__c} onchange={handleChange} name="City__c"
                            required></lightning-input>
                    </div>
                    <div class="slds-size_1-of-1 slds-medium-size_3-of-12 slds-p-around_small">
                        <lightning-input label="Address" value={driver.Address__c} onchange={handleChange}
                            name="Address__c" required></lightning-input>
                    </div>
                </div>
            </template>

            <div class="slds-p-vertical_small slds-text-align_left">
                <button type="button" class="slds-button slds-button_brand" onclick={addDriver}>
                    {addDriverLabel}
                </button>
            </div>

            <!-- Custom Table to Show Added Drivers -->
            <template if:true={drivers.length}>
                <div class="custom-table-container">
                    <table class="custom-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>License Country</th>
                                <th>License State</th>
                                <th>License Number</th>
                                <th>DOB</th>
                                <th>Type</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={drivers} for:item="drv" for:index="index">
                                <tr key={drv.diff}>
                                    <td>{drv.First_Name__c} {drv.Last_Name__c}</td>
                                    <td>{drv.License_Country__c}</td>
                                    <td>{drv.License_state__c}</td>
                                    <td>{drv.license_number__c}</td>
                                    <td>{drv.Dob__c}</td>
                                    <td>
                                        <template if:true={drv.Driver_Type__c}>Owner</template>
                                        <template if:false={drv.Driver_Type__c}>Driver</template>
                                    </td>
                                    <td>
                                        <lightning-button-icon icon-name="utility:edit" variant="bare"
                                            onclick={editDriver} data-index={index}></lightning-button-icon>
                                        <lightning-button-icon icon-name="utility:delete" onclick={deleteDriver}
                                            variant="bare" data-index={index} class="slds-m-left_x-small">
                                        </lightning-button-icon>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>
        </template>
    </div>
</template>
