<template>
    <c-custom-toast auto-close-time="8000"></c-custom-toast>
    <div class="loading" if:false={spinner}>
        <!-- <h2> Loading... </h2> -->
        <lightning-spinner alternative-text="Loading" size="medium">
            Loading
        </lightning-spinner>
    </div>
    <div class="container">
        <h2 class="title">Activate Your Account</h2>
        <p class="subtitle">To Activate your account, enter your email.</p>
        <div class="form">
            <label for="email" class="slds-form-element__label">
                <abbr class="slds-required" title="required">*</abbr> Email
            </label>
            <input type="email" id="email" class="email-input" value={email} onchange={handleEmailChange} />
            <button class="submit-button" onclick={handleClick}>Activate Account</button>
        </div>
    </div>
</template>
