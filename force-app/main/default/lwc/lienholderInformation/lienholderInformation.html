<template>
    <div class="maindiv notranslate slds-m-top_xx-large">
        <template if:true={spinner}>
            <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
        </template>
        <template if:false={spinner}>
           
            <div class="blue">
                <div class="slds-text-heading_large slds-p-around--x-small screenHeading">{label.lienholderinfo}</div>
            </div>
            <!-- <div class="icon slds-p-around_small">
                <lightning-icon class="slds-col slds-p-around_small slds-align_absolute-center slds-size_1-of-12"
                    icon-name="Standard:event">
                </lightning-icon>
            </div> -->

            <lightning-layout multiple-rows="true">
                <!-- Country -->    
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="3" large-device-size="3"
                    class="slds-p-around_x-small">
                    <lightning-combobox name="Lienholder_Country__cmbx" class="Validation" label={label.country} value={lienholderCountryCombox}
                        placeholder={label.country} options={countryoptions} onchange={handleChange} required></lightning-combobox>
                </lightning-layout-item>
                <template if:true={otherCountry}>
                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="3" large-device-size="3"
                        class="slds-p-around_x-small">
                        <lightning-input name="Lienholder_Country__c" label={label.country} value={lienholderCountry}
                            pattern="^([a-zA-Z]+\s)*[a-zA-Z]+$" placeholder={label.country}
                            onchange={handleChange}></lightning-input>
                    </lightning-layout-item>
                </template>
                <!-- Name -->
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="3" large-device-size="3"
                    class="slds-p-around_x-small">
                    <template if:true={otherCountry}>
                        <lightning-input name="Lienholder_name__c" class="Validation" label={label.name} value={lienholderName}
                            placeholder={label.LienholderName} onchange={handleChange} max-length="100" required>
                        </lightning-input>
                    </template>
                    <template if:false={otherCountry}>
                        <template if:false={addNewLienHolder}>
                         <c-lookup isrequired=true validation="Validation" filter-value={lienholderCountryCombox} filter-api="Country__c" objecttype="Lienholder__c" searchagainst="Name__c" placeholder={label.SelectLienholder} label={label.name}
                                value={lienholderName} selectedname={lienholderName} selectedid={lienholderName} onselection={handleSearch}></c-lookup>
                        </template>
                        <template if:true={addNewLienHolder}>
                                <lightning-input name="Lienholder_name__c" class="Validation" label={label.name} value={lienholderName}
                            placeholder={label.LienholderName} onchange={handleChange} max-length="100" required>
                        </lightning-input>
                        </template>
                    </template>
                </lightning-layout-item>
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="3" large-device-size="3"
                    class="slds-p-around_x-small">
                    <lightning-checkbox-group name="Checkbox Group"
                              label="Add new LienHolder"
                              options={leinHolderOPtion}
                              value={leinHolderValue}
                              onchange={leinHolderhandleChange}></lightning-checkbox-group>
                </lightning-layout-item>
                <!-- Postal Code -->
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="3" large-device-size="3"
                    class="slds-p-around_x-small">
                    <lightning-input name="Lienholder_Postal_Code__c" label={label.postalcode} value={lienholderPostalCode}
                        type="text" max-length="9" placeholder={label.LienholderPostalCode}
                        pattern="^*([AaBbCcEeGgHhJjKkLlMmNnPpRrSsTtVvXxYy]\d[a-zA-Z])*-**(\d[a-zA-Z]\d)*$|^*(\d{5})*$|^*(\d{5})*-**(\d{4})*$"
                        onchange={handleChange}>
                    </lightning-input>
                </lightning-layout-item>
                
            <!--lightning-layout multiple-rows="true"-->
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="3" large-device-size="3"
                    class="slds-p-around_x-small">
                    <!--template if:false={otherCountry}>
                        <lightning-combobox name="Lienholder_State__c" label={label.state} value={lienholderState}
                            placeholder="Lienholder State" options={stateOption} onchange={handleChange}>
                        </lightning-combobox>
                    </template></template>
                    <template if:true={otherCountry}-->
                    <lightning-input name="Lienholder_State__c" label={label.state} value={lienholderState}
                            pattern="^([a-zA-Z]+\s)*[a-zA-Z]+$" placeholder={label.LienholderState}
                            onchange={handleChange}></lightning-input>
                </lightning-layout-item>
                <!-- City -->
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="3" large-device-size="3"
                    class="slds-p-around_x-small">
                    <lightning-input name="Lienholder_City__c" label={label.city} value={lienholderCity}
                        pattern="^([a-zA-Z]+\s)*[a-zA-Z]+$" placeholder={label.LienholderCity} onchange={handleChange}>
                    </lightning-input>
                </lightning-layout-item>
                <!-- Street Address -->
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="3" large-device-size="3"
                    class="slds-p-around_x-small">
                    <lightning-input name="Lienholder_Street__c" label={label.streetaddress} value={lienholderStreet}
                        placeholder={label.LienholderStreetAddress} onchange={handleChange} pattern="^\S+(?: \S+)*$">
                    </lightning-input>
                </lightning-layout-item>
            <!--/lightning-layout>

            <lightning-layout multiple-rows="true"-->
                
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="3" large-device-size="3"
                    class="slds-p-around_x-small">
                    <lightning-input name="Lienholder_Street_2__c" label={label.streetaddresss} pattern="^\S+(?: \S+)*$"
                        value={lienholderStreet2} placeholder={label.LienholderStreetAddress2} onchange={handleChange}>
                    </lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="3" large-device-size="3"
                    class="slds-p-around_x-small">
                    <lightning-input name="Lienholder_Phone__c" label={label.phone} value={lienholderPhone} type="text"
                        max-length="17" pattern="^\(\d{3}\)\s\d{3}-\d{4,7}$" class="Validation" placeholder={label.LienholderPhone}
                        onchange={handleChange}>
                    </lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="3" large-device-size="3"
                    class="slds-p-around_x-small">
                    <lightning-input name="Lienholder_Fax__c" label={label.fax} class="Validation" value={lienholderFax}
                        placeholder={label.LienholderFax} onchange={handleChange} pattern="^\(\d{3}\)\s\d{3}-\d{4,7}$">
                    </lightning-input>
                </lightning-layout-item>
            <!--/lightning-layout-->

            </lightning-layout>

            <!--lightning-layout multiple-rows="true">
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="3" large-device-size="3"
                    class="slds-p-around_x-small">
                    <lightning-input name="Lienholder_name__c" class="Validation" label="Name" value={lienholderName}
                        placeholder="Lienholder Name" onchange={handleChange} max-length="100" required>
                    </lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="3" large-device-size="3"
                    class="slds-p-around_x-small">
                    <lightning-input name="Lienholder_Phone__c" label="Phone" value={lienholderPhone} type="text"
                        max-length="17" pattern="^\(\d{3}\)\s\d{3}-\d{4,7}$" placeholder="Lienholder Phone"
                        onchange={handleChange}>
                    </lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="3" large-device-size="3"
                    class="slds-p-around_x-small">
                    <lightning-input name="Lienholder_Fax__c" label="Fax" value={lienholderFax}
                        placeholder="Lienholder Fax" onchange={handleChange} pattern="^\(\d{3}\)\s\d{3}-\d{4,7}$">
                    </lightning-input>
                </lightning-layout-item>
            </lightning-layout>
            <lightning-layout multiple-rows="true">
                
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="3" large-device-size="3"
                    class="slds-p-around_x-small">
                    <lightning-input name="Lienholder_Street__c" label="Street Address" value={lienholderStreet}
                        placeholder="Lienholder Street Address" onchange={handleChange} pattern="^\S+(?: \S+)*$">
                    </lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="3" large-device-size="3"
                    class="slds-p-around_x-small">
                    <lightning-input name="Lienholder_Street_2__c" label="Street Address 2" pattern="^\S+(?: \S+)*$"
                        value={lienholderStreet2} placeholder="Lienholder Street Address 2" onchange={handleChange}>
                    </lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="3" large-device-size="3"
                    class="slds-p-around_x-small">
                    <lightning-combobox name="Lienholder_Country__cmbx" label="Country" value={lienholderCountryCombox}
                        placeholder="Country" options={countryoptions} onchange={handleChange}></lightning-combobox>
                </lightning-layout-item>
                <template if:true={otherCountry}>
                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="3" large-device-size="3"
                        class="slds-p-around_x-small">
                        <lightning-input name="Lienholder_Country__c" label="Country" value={lienholderCountry}
                            pattern="^([a-zA-Z]+\s)*[a-zA-Z]+$" placeholder="Country"
                            onchange={handleChange}></lightning-input>
                    </lightning-layout-item>
                </template>
            </lightning-layout>

            <lightning-layout multiple-rows="true">
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="3" large-device-size="3"
                    class="slds-p-around_x-small">
                    <template if:false={otherCountry}>
                        <lightning-combobox name="Lienholder_State__c" label="State" value={lienholderState}
                            placeholder="Lienholder State" options={stateOption} onchange={handleChange}>
                        </lightning-combobox>
                    </template>
                    <template if:true={otherCountry}>
                        <lightning-input name="Lienholder_State__c" label="State" value={lienholderState}
                            pattern="^([a-zA-Z]+\s)*[a-zA-Z]+$" placeholder="Lienholder State"
                            onchange={handleChange}></lightning-input>
                    </template>

                </lightning-layout-item>
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="3" large-device-size="3"
                    class="slds-p-around_x-small">
                    <lightning-input name="Lienholder_City__c" label="City" value={lienholderCity}
                        pattern="^([a-zA-Z]+\s)*[a-zA-Z]+$" placeholder="Lienholder City" onchange={handleChange}>
                    </lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="12" small-device-size="12" medium-device-size="3" large-device-size="3"
                    class="slds-p-around_x-small">
                    <lightning-input name="Lienholder_Postal_Code__c" label="Postal Code" value={lienholderPostalCode}
                        type="text" max-length="9" placeholder="Lienholder Postal Code"
                        pattern="^*([AaBbCcEeGgHhJjKkLlMmNnPpRrSsTtVvXxYy]\d[a-zA-Z])*-**(\d[a-zA-Z]\d)*$|^*(\d{5})*$|^*(\d{5})*-**(\d{4})*$"
                        onchange={handleChange}>
                    </lightning-input>
                </lightning-layout-item>

            </lightning-layout>-->
            <div class="slds-m-top_xx-large horizontalAlign slds-p-around--x-small">
                <div class="">
                    <button class="buttonPrev btnHover" onclick={handlePrevClick}><span class="icon-prev"><i
                                class="icon-prevs"></i></span>{label.prev}</button>
                </div>
                <div class="">
                    <button class="buttonNext btnHover" onclick={handleNextClick}><span class="icon-next"><i
                                class="icon-nexts"></i></span>{label.next}</button>
                </div>
            </div>

        </template>
    </div>
</template>
