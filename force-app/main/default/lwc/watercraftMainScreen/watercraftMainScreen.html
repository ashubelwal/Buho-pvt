<template>
    <div class="notranslate">
        <template if:true={isUserDetails}>
            <lightning-layout multiplerows="true" class="pagelayout">
                <lightning-layout-item size="3">
                    <c-insurance-steps policy-type={policytype} steps='steps1' completed-steps='1'></c-insurance-steps>
                </lightning-layout-item>
                <lightning-layout-item size="9">
                    <c-user-details policy-type="Watercraft" onleadvaluechange={handleLeadChange} onerrorgenerated={showLogaCase}
                changesnextscreen={changeNextScreen} changeprevscreen={changePrevScreen} leaddata={leadData}>
            </c-user-details>
                </lightning-layout-item>
            </lightning-layout>


            
        </template>

        <template if:true={isWatercraftDetails}>
            <lightning-layout multiplerows="true" class="pagelayout">
                <lightning-layout-item size="3">
                    <c-insurance-steps policy-type={policytype} steps='steps2' completed-steps='2'></c-insurance-steps>
                </lightning-layout-item>
                <lightning-layout-item size="9">
                    <c-watercraft-details changesnextscreen={changeNextScreen} handle-insert-data={handleInsert} onerrorgenerated={showLogaCase}
                changeprevscreen={changePrevScreen} onleadvaluechange={handleLeadChange} leaddata={leadData}>
            </c-watercraft-details>
                </lightning-layout-item>
            </lightning-layout>

            
        </template>

        <template if:true={isTermOptions}>
            <lightning-layout multiplerows="true" class="pagelayout">
                <lightning-layout-item size="3">
                    <c-insurance-steps policy-type={policytype} steps='steps3' completed-steps='3'></c-insurance-steps>
                </lightning-layout-item>
                <lightning-layout-item size="9">
                    <c-term-options changesnextscreen={changeNextScreen} handle-insert-data={handleInsert} onerrorgenerated={showLogaCase}
                changeprevscreen={changePrevScreen} onleadvaluechange={handleLeadChange} leaddata={leadData}>
            </c-term-options>
                </lightning-layout-item>
            </lightning-layout>

            
        </template>

        <template if:true={isQuickQuote}>
            <c-watercraft-quick-quote-details changesnextscreen={changeNextScreen} handle-insert-data={handleInsert} onerrorgenerated={showLogaCase}
                changeprevscreen={changePrevScreen} onleadvaluechange={handleLeadChange} leaddata={leadData}>
            </c-watercraft-quick-quote-details>

        </template>

        <template if:true={isReviewWatercraft}>
            <lightning-layout multiple-rows="true" class="pagelayout">
                <lightning-layout-item size="3" class="slds-show_medium">
                    <c-policy-paymentflow-steps steps='steps2' completed-steps='2'></c-policy-paymentflow-steps>
                </lightning-layout-item>
                <lightning-layout-item size="12" large-device-size="9" small-device-size="12" medium-device-size="12">
                    <c-watercraft-review changesnextscreen={changeNextScreen} handle-insert-data={handleInsert} onerrorgenerated={showLogaCase}
                        changeprevscreen={changePrevScreen} onleadvaluechange={handleLeadChange} leaddata={leadData}>
                    </c-watercraft-review>
                </lightning-layout-item>
            </lightning-layout>

        </template>

        <template if:true={isDriverRegistration}>
            <lightning-layout multiple-rows="true" class="pagelayout">
                <lightning-layout-item size="3" class="slds-show_medium">
                    <c-policy-paymentflow-steps steps='steps3' completed-steps='3'></c-policy-paymentflow-steps>
                </lightning-layout-item>
                <lightning-layout-item size="12" large-device-size="9" small-device-size="12" medium-device-size="12">
                    <c-driver-registered changesnextscreen={changeNextScreen} handle-insert-data={handleInsert} onerrorgenerated={showLogaCase}
                        changeprevscreen={changePrevScreen} onleadvaluechange={handleLeadChange} leaddata={leadData}>
                    </c-driver-registered>
                </lightning-layout-item>
            </lightning-layout>

        </template>

        <template if:true={isVerifyWatercraft}>
            <lightning-layout multiple-rows="true" class="pagelayout">
                <lightning-layout-item size="3" class="slds-show_medium">
                    <c-policy-paymentflow-steps steps='steps4' completed-steps='4'></c-policy-paymentflow-steps>
                </lightning-layout-item>
                <lightning-layout-item size="12" large-device-size="9" small-device-size="12" medium-device-size="12">
                    <c-verify-edit-watercraft changesnextscreen={changeNextScreen} handle-insert-data={handleInsert} onerrorgenerated={showLogaCase}
                        changeprevscreen={changePrevScreen} onleadvaluechange={handleLeadChange} leaddata={leadData}>
                    </c-verify-edit-watercraft>
                </lightning-layout-item>
            </lightning-layout>
        
        </template>

        <template if:true={isInsuranceFinalDetails}>
            <lightning-layout multiple-rows="true" class="pagelayout">
                <lightning-layout-item size="3" class="slds-show_medium">
                    <c-policy-paymentflow-steps steps='steps5' completed-steps='5'></c-policy-paymentflow-steps>
                </lightning-layout-item>
                <lightning-layout-item size="12" large-device-size="9" small-device-size="12" medium-device-size="12">
                    <c-term-agreement changesnextscreen={changeNextScreen} handle-insert-data={handleInsert} onerrorgenerated={showLogaCase}
                        changeprevscreen={changePrevScreen} onleadvaluechange={handleLeadChange} policy-type={policytype}
                        leaddata={leadData}></c-term-agreement>
                </lightning-layout-item>
            </lightning-layout>

        </template>

        <template if:true={isPaymentDetail}>
            <lightning-layout multiple-rows="true" class="pagelayout">
                <lightning-layout-item size="3" class="slds-show_medium">
                    <c-policy-paymentflow-steps steps='steps6' completed-steps='6'></c-policy-paymentflow-steps>
                </lightning-layout-item>
                <lightning-layout-item size="12" large-device-size="9" small-device-size="12" medium-device-size="12">
                    <lightning-layout padding="around-small" size="12" class="slds-align-center slds-m-top_xx-large">
                        <div class="page-title">
                            <h1
                                class="slds-text blue slds-text-heading_medium slds-p-around_small">
                                {label.LetstacklethePaymentnow}</h1>
                        </div>
                    </lightning-layout>
                    <c-payment changesnextscreen={changeNextScreen} changeprevscreen={changePrevScreen} onerrorgenerated={showLogaCase}
                        onleadvaluechange={handleLeadChange} policy-type={policytype} leaddata={leadData}></c-payment>
                </lightning-layout-item>
            </lightning-layout>

        </template>

        <template if:true={isPolicyDetail}>

            <lightning-layout multiple-rows="true" class="pagelayout">
                <lightning-layout-item size="3" class="slds-show_medium">
                    <c-policy-paymentflow-steps steps='steps7' completed-steps='7'></c-policy-paymentflow-steps>
                </lightning-layout-item>
                <lightning-layout-item size="12" large-device-size="9" small-device-size="12" medium-device-size="12">
                    <c-policy-detail community-user={communityUser} policy-name={policyName} leaddata={leadData}></c-policy-detail>
                </lightning-layout-item>
            </lightning-layout>

        </template>
    </div>  
    <c-log-acase lwc:if={isShowCaseLog} onopenlogcasemodalsection={openModalLogCase}></c-log-acase>  
</template>
