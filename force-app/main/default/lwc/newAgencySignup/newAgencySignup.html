<template>
	    <c-custom-toast auto-close-time="8000"></c-custom-toast>

	<div class="wrapper">                                   		
		<div class="slds-m-top_large card">
			<h2 class="slds-m-bottom_large slds-text-heading_large"> Signup to work with MEXINSURANCE </h2>
			<!-- <h3 class="slds-text-heading_medium slds-m-bottom_xx-small"> Add Agency details </h3> -->

			<div class="slds-grid slds-wrap slds-gutters slds-m-bottom_small">
				<div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-large-size_3-of-12">
					<lightning-input type="text" label="First Name" data-id="firstName" placeholder="Type here"  required></lightning-input>
				</div>
				<div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-large-size_3-of-12">
					<lightning-input type="text" label="Last Name" data-id="lastName" placeholder="Type here"  required></lightning-input>
				</div>
			</div>

			<div class="slds-grid slds-wrap slds-gutters slds-m-bottom_small">
				<div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-large-size_3-of-12">
					<lightning-input type="text" label="Title" data-id="title" placeholder="Type here"   required></lightning-input>
				</div>
				<div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-large-size_3-of-12">
					<lightning-input type="email" label="Email" data-id="email" placeholder="Type here" required></lightning-input>
				</div>
				<div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-large-size_3-of-12">
					<lightning-input type="text" label="Phone" data-id="phone" onchange={handlePhoneNumberChange} placeholder="Type here" required pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" ></lightning-input>
				</div>
				<div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-large-size_3-of-12">
					<lightning-input type="url" label="Website" data-id="website" placeholder="https://mexinsurance.com" required pattern="^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$" ></lightning-input>
				</div>
			</div>

			<div class="slds-grid slds-wrap slds-gutters slds-m-bottom_small">
				<div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-large-size_3-of-12">
					<lightning-input type="text" label="Company" data-id="company" placeholder="Type here"  required></lightning-input>
				</div>
				<div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-large-size_3-of-12">
					<lightning-input type="number" label="Expected Monthly Volume" data-id="expectedMonthlyVolume" placeholder="Type here "  required>
					</lightning-input>					
				</div>
				<div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-large-size_3-of-12">					
					<h2 class="header slds-m-vertical_x-small">Product(s) of interest <lightning-helptext content="Not sure? You can update letter."></lightning-helptext></h2>
					<div style="display: inline-flex;">
						<lightning-input type="checkbox" label="Automobile" onchange={handleCheckboxChange} data-ptype="Automobile" checked={checkbox1}></lightning-input>
						<lightning-input type="checkbox" label="RV" onchange={handleCheckboxChange} data-ptype="RV" checked={checkbox2}></lightning-input>
						<lightning-input type="checkbox" label="Motercycle" onchange={handleCheckboxChange} data-ptype="Motercycle" checked={checkbox3}></lightning-input>

						<!-- <lightning-checkbox-group name=""

					</div>

					</lightning-input> -->

			</div>
