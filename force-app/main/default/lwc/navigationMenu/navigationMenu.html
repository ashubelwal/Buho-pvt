<template>
    <!-- Vertical Navigation List for Mobile -->
    <template if:true={showHamburgerMenu}>
        <div class="slds-is-fixed slds-grid hamburger-menu-container customBranding" style={primaryColor}>
            <div class="slds-col slds-size_5-of-6">
                <div class="slds-grid slds-grid_vertical hamburger-menu">
                    <h4> navigation </h4>
                    <div class="slds-col slds-var-p-left_medium slds-size_1-of-4">
                        <a href={href} onclick={handleLogoClick}><img src={getUrl} /></a>
                        <!-- <c-navigation-menu-logo
                            formfactor="hamburger"
                        ></c-navigation-menu-logo> -->
                    </div>
                    <div class="slds-col">

                        <span>
                            <nav role="navigation" class="slds-nav-vertical">
                                <ul class="slds-has-block-links_space">
                                    <template for:each={menuItems} for:item="item">
                                        <li key={item.id} class="navbar-items">
                                            <c-navigation-menu-item item={item}></c-navigation-menu-item>
                                        </li>
                                    </template>
                                </ul>
                            </nav>
                        </span>
                    </div>
                    <div class="slds-col slds-col_bump-bottom">

                        <span>
                            <lightning-button variant="brand" label={buttonLabel} title="Primary action"
                                onclick={handleClick} class="slds-var-p-left_small"></lightning-button>
                        </span>
                    </div>
                    <div class="slds-col">
                        <span>
                            <a href="/login/" class="navbar-items slds-var-p-left_small">Login</a>
                        </span>
                    </div>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-6">
                <a href={href} onclick={handleHamburgerMenuToggle}><img
                        class="hamburger-menu-icon slds-var-p-left_small slds-var-p-top_small" src={xIcon} /></a>
            </div>
        </div>
    </template>

    <div class="menuWrap" style={primaryColor}>
        <div class="slds-grid slds-grid_vertical-align-center branding">
            <div class="slds-col slds-size_3-of-4 slds-large-size_1-of-5">
                <a href={href} class="companyLogo" onclick={handleLogoClick}><img src={getUrl} /></a>
                <!-- <span>
                    <c-navigation-menu-logo
                        formfactor="desktop"
                    ></c-navigation-menu-logo>
                </span> -->
            </div>
            <div class="slds-col slds-var-p-horizontal_large slds-show_large">
                <span>

                    <nav role="navigation">
                        <ul class="slds-list_horizontal slds-has-block-links_space">
                            <template for:each={menuItems} for:item="item">

                                <li key={item.id} class="navbar-items slds-var-p-horizontal_x-small">
                                    <c-navigation-menu-item item={item}></c-navigation-menu-item>
                                </li>
                            </template>
                        </ul>
                    </nav>
                </span>
            </div>
            <div class="slds-col slds-grid_align-end slds-show_large">
                <div class="slds-grid slds-grid_align-end slds-gutters_medium slds-grid_vertical-align-center">
                    <!-- Mostrar Partner Name si existe, sino mostrar User Name -->
                    <template if:true={userPartnerName}>
                        <div>
                            {userPartnerName}
                            <lightning-button-menu alternative-text="userPartnerName" onselect={handleMenuSelect}
                                menu-alignment="auto" icon-name="utility:user" title={userPartnerName}
                                class="slds-p-left_x-small">
                                <template for:each={items} for:item="action">
                                    <lightning-menu-item label={action.label} value={action.value} key={action.label}>
                                    </lightning-menu-item>
                                </template>
                            </lightning-button-menu>
                        </div>
                    </template>

                    <!-- Solo mostrar userName si no hay userPartnerName -->
                    <template if:true={userName} if:false={userPartnerName}>
                        <div>
                            {userName}
                            <lightning-button-menu alternative-text="userName" onselect={handleMenuSelect}
                                menu-alignment="auto" icon-name="utility:user" title={userName}
                                class="slds-p-left_x-small">
                                <template for:each={items} for:item="action">
                                    <lightning-menu-item label={action.label} value={action.value} key={action.label}>
                                    </lightning-menu-item>
                                </template>
                            </lightning-button-menu>
                        </div>
                    </template>

                    <!-- Si no hay ni partner name ni user name, mostrar login -->
                    <template if:false={userName}>
                        <template if:false={userPartnerName}>
                            <div class="slds-col">
                                <span>
                                    <a href="/login/" class="navbar-items">Login</a>
                                </span>
                            </div>
                        </template>
                    </template>
                </div>
            </div>
            <template if:false={showHamburgerMenu}>
                <div class="slds-col slds-var-p-top_small slds-var-p-right_small slds-hide_large">
                    <a class="slds-float_right" href={href} onclick={handleHamburgerMenuToggle}><img
                            class="hamburger-menu-icon" src={hamburgerIcon} /></a>
                </div>
            </template>
        </div>
    </div>
</template>
