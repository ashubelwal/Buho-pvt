<template>
    <div class="notranslate">
    <template if:true={isWatercraftDetails}>
		<lightning-layout multiple-rows="true" class="pagelayout">
			<lightning-layout-item size="3" class="slds-show_medium">
				<c-insurance-steps steps='steps2' completed-steps='2' policy-type={policyType} ></c-insurance-steps>
			</lightning-layout-item>
			<lightning-layout-item size="12" large-device-size="9" small-device-size="12" medium-device-size="12">
				<c-watercraft-details oncustomerecordchange={handleCustomerRecordChange}
                 customer-record={customerRecord} changesnextscreen={changeNextScreen} onerrorgenerated={showLogaCase}
                 watercraft-data={watercraftData} community-user={communityUser}
                  changeprevscreen={changePrevScreen}></c-watercraft-details>
			</lightning-layout-item>
		</lightning-layout>
	</template>
    <template if:true={isTermOptions}>
		<lightning-layout multiple-rows="true" class="pagelayout">
			<lightning-layout-item size="3" class="slds-show_medium">
				<c-insurance-steps steps='steps3' completed-steps='3' policy-type={policyType} ></c-insurance-steps>
			</lightning-layout-item>
			<lightning-layout-item size="12" large-device-size="9" small-device-size="12" medium-device-size="12">
				<c-term-options oncustomerecordchange={handleCustomerRecordChange} 
                customer-record={customerRecord} changesnextscreen={changeNextScreen} onerrorgenerated={showLogaCase}
                community-user={communityUser} changeprevscreen={changePrevScreen}>
				</c-term-options>
			</lightning-layout-item>
		</lightning-layout>
	</template>
    <template if:true={isQuickQuote}>
		<c-watercraft-quick-quote-details changesnextscreen={changeNextScreen} customer-record={customerRecord} onerrorgenerated={showLogaCase}
            changeprevscreen={changePrevScreen} oncustomerecordchange={handleCustomerRecordChange}  community-user={communityUser}>
        </c-watercraft-quick-quote-details>
	</template>

    <template if:true={isReviewVehicle}>
		<lightning-layout multiple-rows="true" class="pagelayout">
            <lightning-layout-item size="3" class="slds-show_medium">
                <c-policy-paymentflow-steps steps='steps2' completed-steps='2'></c-policy-paymentflow-steps>
            </lightning-layout-item>
            <lightning-layout-item size="12" large-device-size="9" small-device-size="12" medium-device-size="12">
                <c-watercraft-review changesnextscreen={changeNextScreen} customer-record={customerRecord} onerrorgenerated={showLogaCase}
                    changeprevscreen={changePrevScreen} community-user={communityUser} oncustomerecordchange={handleCustomerRecordChange}  leaddata={leadData}>
                </c-watercraft-review>
            </lightning-layout-item>
        </lightning-layout>
	</template>

    <template if:true={isDriverDetail}>
		<lightning-layout multiple-rows="true" class="pagelayout">
            <lightning-layout-item size="3" class="slds-show_medium">
                <c-policy-paymentflow-steps steps='steps3' completed-steps='3'></c-policy-paymentflow-steps>
            </lightning-layout-item>
            <lightning-layout-item size="12" large-device-size="9" small-device-size="12" medium-device-size="12">
                <c-driver-registered changesnextscreen={changeNextScreen} customer-record={customerRecord} onerrorgenerated={showLogaCase}
                    changeprevscreen={changePrevScreen} community-user={communityUser} oncustomerecordchange={handleCustomerRecordChange}  leaddata={leadData} driver-data={driverData}>
                </c-driver-registered>
            </lightning-layout-item>
        </lightning-layout>
	</template>

    <template if:true={isVerifyEditQuickQuote}>
		<lightning-layout multiple-rows="true" class="pagelayout">
            <lightning-layout-item size="3" class="slds-show_medium">
                <c-policy-paymentflow-steps steps='steps4' completed-steps='4'></c-policy-paymentflow-steps>
            </lightning-layout-item>
            <lightning-layout-item size="12" large-device-size="9" small-device-size="12" medium-device-size="12">
                <c-verify-edit-watercraft changesnextscreen={changeNextScreen} customer-record={customerRecord} onerrorgenerated={showLogaCase}
                    changeprevscreen={changePrevScreen} community-user={communityUser} oncustomerecordchange={handleCustomerRecordChange}  leaddata={leadData}>
                </c-verify-edit-watercraft>
            </lightning-layout-item>
        </lightning-layout>
	</template>

    <template if:true={isInsurenceLegalTerm}>
        <lightning-layout multiple-rows="true" class="pagelayout">
            <lightning-layout-item size="3" class="slds-show_medium">
                <c-policy-paymentflow-steps steps='steps5' completed-steps='5'></c-policy-paymentflow-steps>
            </lightning-layout-item>
            <lightning-layout-item size="12" large-device-size="9" small-device-size="12" medium-device-size="12">
                <c-term-agreement changesnextscreen={changeNextScreen} customer-record={customerRecord} onerrorgenerated={showLogaCase}
                    changeprevscreen={changePrevScreen} community-user={communityUser} oncustomerecordchange={handleCustomerRecordChange}  policy-type={policytype}
                    leaddata={leadData}></c-term-agreement>
            </lightning-layout-item>
        </lightning-layout>

    </template>

    <template if:true={isPaymentDetail}>
        <lightning-layout multiple-rows="true" class="pagelayout">
            <lightning-layout-item size="3" class="slds-show_medium">
                <c-policy-paymentflow-steps steps='steps6' completed-steps='6'></c-policy-paymentflow-steps>
            </lightning-layout-item>
            <lightning-layout-item size="12" large-device-size="9" small-device-size="12" medium-device-size="12">
                <lightning-layout padding="around-small" size="12" class="slds-align-center slds-m-top_xx-large">
                    <div class="page-title slds-align--absolute-center">
                        <h1
                            class="slds-text slds-text-align_center slds-text-heading_medium slds-p-around_small slds-align_absolute-center">
                            {label.letstacklepayment}</h1>
                    </div>
                </lightning-layout>
                <c-payment changesnextscreen={changeNextScreen} community-user={communityUser} changeprevscreen={changePrevScreen} customer-record={customerRecord} 
                    oncustomerecordchange={handleCustomerRecordChange}  policy-type={policytype} onerrorgenerated={showLogaCase}></c-payment>
            </lightning-layout-item>
        </lightning-layout>

    </template>

    <template if:true={isPolicyDetail}>

        <lightning-layout multiple-rows="true" class="pagelayout">
            <lightning-layout-item size="3" class="slds-show_medium">
                <c-policy-paymentflow-steps steps='steps7' completed-steps='7'></c-policy-paymentflow-steps>
            </lightning-layout-item>
            <lightning-layout-item size="12" large-device-size="9" small-device-size="12" medium-device-size="12">
                <c-policy-detail policy-name={policyName} community-user={communityUser} leaddata={leadData}></c-policy-detail>
            </lightning-layout-item>
        </lightning-layout>

    </template>
    </div>
    <c-log-acase lwc:if={isShowCaseLog} onopenlogcasemodalsection={openModalLogCase}></c-log-acase>
</template>
