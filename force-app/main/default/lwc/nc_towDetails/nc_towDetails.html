<template>
    <div class="test">
        <div class="pageTitle slds-m-bottom_small">
            <h2 class="slds-text-heading_medium"> Towed Units Additional Details </h2>
        </div>

        <template if:true={towedUnits}>
            <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                <thead>
                    <tr>
                        <th scope="col">Type</th>
                        <th scope="col">Value</th>
                        <th scope="col">Days</th>
                        <th scope="col">Year</th>
                        <th scope="col">Make</th>
                        <th scope="col">Model</th>
                        <th scope="col">VIN</th>
                        <th scope="col">License Plate</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={towedUnits} for:item="unit" for:index="index">
                        <tr key={unit.type}>
                            <td>{unit.Towed_Unit_Type__c}</td>
                            <td>{unit.Towed_Unit_Value__c}</td>
                            <td>{unit.Days_in_Tow__c}</td>
                            <td>{unit.Year__c}</td>
                            <td>{unit.Make__c}</td>
                            <td>{unit.Model__c}</td>
                            <td>{unit.VIN_Number__c}</td>
                            <td>{unit.Plate__c}</td>
                            <td>
                                <!-- <lightning-icon icon-name="action:edit" size="xx-small" class="actionIcon"
                                    data-index={index} onclick={handleEdit} alternative-text="Edit" title="Edit">
                                </lightning-icon> -->
                                <template if:false={showEditForm}>
                                    <lightning-icon icon-name="action:edit" size="xx-small" class="actionIcon"
                                        data-index={index} onclick={handleEdit} alternative-text="Edit" title="Edit">
                                    </lightning-icon>
                                </template>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </template> 
        <template if:true={showEditForm}>
            <div class="slds-m-top_medium">
                <div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-size_1-of-1 slds-medium-size_3-of-12 slds-large-size_3-of-12 slds-p-around_small">
                        <lightning-input name="Year__c" label="Year" value={editUnit.Year__c} onchange={handleChange} required ></lightning-input>
                    </div>
                    <div class="slds-size_1-of-1 slds-medium-size_3-of-12 slds-large-size_3-of-12 slds-p-around_small">
                        <lightning-input name="Make__c" label="Make" value={editUnit.Make__c} onchange={handleChange} required></lightning-input>
                    </div>
                    <div class="slds-size_1-of-1 slds-medium-size_3-of-12 slds-large-size_3-of-12 slds-p-around_small">
                        <lightning-input name="Model__c" label="Model" value={editUnit.Model__c} onchange={handleChange} required></lightning-input>
                    </div>
                </div>
                <div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-size_1-of-1 slds-medium-size_3-of-12 slds-large-size_3-of-12 slds-p-around_small">
                        <lightning-input name="VIN_Number__c" label="VIN Number" value={editUnit.VIN_Number__c} onchange={handleChange} required></lightning-input>
                    </div>
                    <div class="slds-size_1-of-1 slds-medium-size_3-of-12 slds-large-size_3-of-12 slds-p-around_small">
                        <lightning-input name="Plate__c" label="License Plate" value={editUnit.Plate__c} onchange={handleChange} required></lightning-input>
                    </div>
                    <div class="slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_6-of-12 slds-p-around_small">
                        <lightning-button class="slds-m-right_x-small" label="Save" variant="brand" onclick={handleSave}></lightning-button>
                        <lightning-button label="Cancel" variant="neutral" onclick={handleCancel}></lightning-button>
                    </div>
                </div>
            </div>
        </template>
    </div>
</template>
