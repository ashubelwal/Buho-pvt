<template>
    <div>
        <c-custom-toast auto-close-time="8000"></c-custom-toast>
    </div>

    <template if:true={isLoading}>
        <div class="spinner">
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </div>
    </template>

    <div class="slds-grid slds-wrap">
        <div class="slds-col slds-size_1-of-1 slds-align_absolute-center">
        </div>
        <div class="slds-col slds-size_1-of-1 slds-align_absolute-center" style="font-size:20px;text-align:center;">
            {acknowledgementMessage}</br>
            You can print this policy document by clicking on below provided action buttons.
        </div>
        <div class="slds-col slds-size_1-of-1  slds-grid slds-wrap"
            style="font-size: 18px;color: #0b6a9c;font-weight: bold;padding-top: 60px;padding-bottom: 60px;">
            <div class="slds-col slds-size_3-of-8"></div>
            <div class="slds-col slds-size_1-of-8 slds-grid slds-wrap" style="cursor:pointer;"
                onclick={generatePolicyPDF}>
                <div class="slds-col slds-size_1-of-1 slds-align_absolute-center">
                    <svg width="80px" height="80px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 3V16M12 16L16 11.625M12 16L8 11.625" stroke="#1C274C" stroke-width="1.5"
                            stroke-linecap="round" stroke-linejoin="round" />
                        <path
                            d="M15 21H9C6.17157 21 4.75736 21 3.87868 20.1213C3 19.2426 3 17.8284 3 15M21 15C21 17.8284 21 19.2426 20.1213 20.1213C19.8215 20.4211 19.4594 20.6186 19 20.7487"
                            stroke="#1C274C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-align_absolute-center">Print/Download
                </div>
            </div>
            <div class="slds-col slds-size_3-of-8"></div>
        </div>
    </div>
</template>
