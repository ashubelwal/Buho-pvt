<template>
    <div style="display: flex; justify-content: center; align-items: center; padding: 40px 0; font-family: 'Inter', sans-serif; width: 100%;">
        <c-buho_toast></c-buho_toast>
        
        <template if:true={isLoading}>
            <div class="spinner">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>

        <div style="background: #ffffff; border-radius: 16px; padding: 48px 32px; text-align: center; max-width: 500px; width: 100%; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); border: 1px solid #f1f5f9; margin: 0 auto;">
            <!-- Premium checkmark icon with animate success -->
            <div style="display: flex; justify-content: center; margin-bottom: 28px;">
                <div style="width: 80px; height: 80px; background: var(--light-blue, #e0f2fe); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 8px rgba(56, 189, 248, 0.1);">
                    <svg style="width: 40px; height: 40px;" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 12L9 17L20 6" stroke="var(--primary-blue, #0284c7)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>

            <h1 style="font-size: 32px; font-weight: 700; color: #0f172a; margin-bottom: 12px; margin-top: 0; line-height: 1.2;">Thank You!</h1>
            <p style="font-size: 16px; color: #475569; margin-bottom: 24px; line-height: 1.6; margin-top: 0;">{acknowledgementMessage}</p>
            
            <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px;">
                <span style="font-size: 14px; font-weight: 600; color: #64748b;">Policy ID:</span>
                <span style="font-size: 15px; font-weight: 700; color: #0f172a;">{renewdPolicyId}</span>
            </div>

            <p style="font-size: 14px; color: #64748b; margin-bottom: 32px; line-height: 1.6; margin-top: 0;">Your policy document is ready. Click below to download or print your policy PDF.</p>

            <div style="display: flex; flex-direction: column; gap: 12px; align-items: center; width: 100%;">
                <button class="btn btn-primary" onclick={generatePolicyPDF} style="background: var(--primary-blue, #1e293b); color: #ffffff; border: none; border-radius: 8px; padding: 14px 24px; font-size: 16px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s ease; width: 100%; box-shadow: 0 4px 6px rgba(0,0,0,0.05); min-height: 48px; box-sizing: border-box;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink: 0;">
                        <path d="M12 3V16M12 16L16 11.625M12 16L8 11.625" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M15 21H9C6.17157 21 4.75736 21 3.87868 20.1213C3 19.2426 3 17.8284 3 15M21 15C21 17.8284 21 19.2426 20.1213 20.1213C19.8215 20.4211 19.4594 20.6186 19 20.7487" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    Download Policy PDF
                </button>
                
                <button class="btn btn-secondary" onclick={handleNewQuote} style="background: transparent; color: #475569; border: 1px solid #cbd5e1; border-radius: 8px; padding: 14px 24px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; width: 100%; min-height: 48px; box-sizing: border-box;">
                    Start New Quote
                </button>
            </div>
        </div>
    </div>
</template>
