    <div class="wrapper">
        <div class="slds-grid slds-wrap slds-gutters_xx-small">
            <div class="slds-col slds-size_1-of-1 slds-large-size_12-of-12 slds-order_2 slds-large-order_1">
                <div class="" style="position: relative">

                    <!-- showing custom notification for all cmp, use this cmp to show toast from any child cmp -->
                    <div>
                        <c-custom-toast auto-close-time="8000"></c-custom-toast>
                    </div>

                    <!-- <c-p-s-t-time-picker></c-p-s-t-time-picker> -->


                    <!-- Dynamic Child Component -->
                    <div class="childCmp">
                        <template if:true={componentConstructor}>
                            <lwc:component payload={payload} lwc:is={componentConstructor} onflagupdate={handleFlagUpdate}
                                onpayloadupdate={handlePayloadUpdate} onfullpayloadupdate={handlePayloadUpdateComplete}
                                onchangescreen={handleNavigation} onloadingstatuschange={handleLoadingStatus}
                                ontoastevent={handleToastEvent}></lwc:component>
                        </template>
                    </div>

                    <!-- Navigation Buttons -->

                    <div class="step-navigation slds-p-top_small navigationBtn">
                        <button class="slds-button slds-button_outline-brand slds-m-right_x-small"
                                    onclick={handleNavigation} data-direction="previous" disabled={isFirstStep}>Back</button>
                        <template if:false={flag.isQuotePage}>
                            <button class="slds-button slds-button_brand slds-m-right_x-small" onclick={handleNavigation} data-direction="next"
                                disabled={isLastStep}>

                                <template if:false={childLoaded}>
                                    <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                                </template>
                            Continue</button>
                        </template>

                        <!-- <c-nc_modal modal-title="Information"
                            modal-content="Here is the information you wanted to see!">
                        </c-nc_modal> -->
                    </div>

                    <!-- use this spinner to show loading screen from all child cmp -->

                        <lightning-spinner alternative-text="Loading" size="medium">
                            Loading
                        </lightning-spinner>
