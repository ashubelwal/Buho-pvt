<template>
    <lightning-card title="">
        <div class="slds-p-around_medium">
            <template if:true={visibleArticles}>
                <ul class="slds-list_vertical slds-has-dividers_top-space">
                    <template for:each={visibleArticles} for:item="article">
                        <li key={article.Id} class="slds-item">
                            <a href="#" data-id={article.Id} onclick={handleArticleClick} class="slds-text-link">
                                {article.Title}
                            </a>
                        </li>
                    </template>
                </ul>
            </template>

            <!-- Show More button -->
            <template if:true={showMoreButton}>
                <div class="slds-m-top_medium slds-grid slds-grid_align-center">
                    <lightning-button label="Show More" onclick={handleShowMore} variant="brand"></lightning-button>
                </div>
            </template>

            <!-- Show Less button -->
            <template if:true={showLessButton}>
                <div class="slds-m-top_medium slds-grid slds-grid_align-center">
                    <lightning-button label="Show Less" onclick={handleShowLess} variant="neutral"></lightning-button>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
