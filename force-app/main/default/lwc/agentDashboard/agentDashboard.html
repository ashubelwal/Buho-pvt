<template>
    <div>
        <c-custom-toast auto-close-time="8000"></c-custom-toast>
    </div>

    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-02"
            class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <h1 id="modal-heading-03" class="slds-modal__title slds-hyphenate" tabindex="-1">Transfer Ownsership
                    </h1>
                </div>

                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-01">
                    <div>This contact does not associated with current Agency. Do you want to Transfer the Ownership!
                    </div>
                    <c-transfer-ownership-manager onclosemodal={cancelTransferOwnership} contact-id={currentContactId}
                        ontoast={handleToast} user-id={userId}></c-transfer-ownership-manager>
                </div>
                <div class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" aria-label="Cancel and close"
                        onclick={cancelTransferOwnership}>Cancel</button>
                    <button class="slds-button slds-button_brand" onclick={handlerTransferOwnership}>Transfer
                        Ownership</button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>

    <div style="background: #fff; border-radius: 4px" class="slds-p-around_medium">

                    <lightning-input class="searchValidate" type="text" variant='label-hidden' name="searchValue"
                        onchange={handleInputChange} pattern="^\S+(?: \S+)*$"
                        placeholder="Search by Name, Email, Policy number" value="" required onkeyup={handlekeyUp}
                        maxlength="30">
                    </lightning-input>
                </lightning-layout-item>

                <lightning-layout-item size="12" small-device-size="12" medium-device-size="3" large-device-size="3"

                <lightning-layout-item size="12" small-device-size="12" medium-device-size="3" large-device-size="3"

                            </div>
                        </div>
                    </lightning-layout-item>
                </template>

                        <div class="policyList">
                            <div class="slds-m-bottom_small slds-p-around_small">

                                            </th>

                                            </th>
                                            <th class="">

                                            </th>
                                            <th class="">

                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={searchResults.policyData} for:item="policy">

                                                </td>

                                                </td>

                                                </td>

                                                    </div>
                                                </td>
                                                <td>
                                                    <div class="slds-truncate" title="">
                                                        {policy.Start_Date__c}
                                                    </div>
                                                </td>
                                                <td>
                                                    <div class="slds-truncate" title="">
                                                        {policy.End_Date__c}
                                                    </div>
                                                </td>
                                                <td>
                                                    <div class="slds-truncate">
                                                        <template if:true={isAgentportal}>
                                                            <span class="actionBtn" data-id={policy.Contact__c}
                                                            data-actiontype="VIEW" data-obj="contact" onclick={handleOperations}> Contact </span>
                                                        </template>


                                                        <!-- <span class="actionBtn" data-id={policy.Quote_c__c}
                                                            data-actiontype="VIEW" data-obj="quote" onclick={handleOperations}> Quote </span> -->

                                                        <span class="actionBtn" data-id={policy.Id}
                                                            data-actiontype="EDIT" data-obj="policy" lwc:if={policy.EditBtn} onclick={navigateToPolicyEdit}> Edit </span>
                                                        <span class="actionBtn" data-id={policy.Id}
                                                            data-actiontype="RENEW" data-obj="policy" lwc:if={policy.RenewBtn} onclick={navigateToPolicyRenew}> Renew </span>
                                                        <span class="actionBtn" data-id={policy.Id}
                                                            data-actiontype="TERMINATE" data-obj="policy" lwc:if={policy.TerminateBtn} onclick={handleOperations}> Terminate </span>

                                                        <span class="actionBtn" data-id={policy.Id}
                                                            data-actiontype="VIEWPOLICY" data-obj="policy" onclick={handleViewPolicyOperations}> View Policy </span>
                                                        <span class="actionBtn" data-id={policy.Contact__c}
                                                            data-actiontype="CREATEPOLICY" data-obj="policy" onclick={handleCreatePolicy}> Create Policy </span>
                                                    </div>

        <template if:true={isShowModal}>

            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
                aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <!-- modal header start -->
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={hideModalBox}>
                        <lightning-icon icon-name="utility:close"
                        alternative-text="close"
                        variant="inverse"
                        size="small" ></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                        <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Add Email in Contact
                        </h2>
                    </header>

                    <!-- modal body start -->
                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">

                        <lightning-input class="" label="Email" type="email" maxlength="40" name="Email"
                            onchange={handleEmailInput} required>
                        </lightning-input>
                    </div>

                    <!-- modal footer start-->
                    <footer class="slds-modal__footer">
                        <button class="slds-button slds-button_neutral" onclick={hideModalBox}>Cancel</button>
                        <button class="slds-button slds-button_neutral slds-p-left_small" onclick={handleUpdateEmail}>Save</button>
                    </footer>


                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
