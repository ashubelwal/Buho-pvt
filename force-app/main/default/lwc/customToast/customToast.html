<template>
    <template if:true={showToastBar}>
        <div class="slds-notify_container slds-is-relative">
            <div class={outerClass} role="status">
                <span class="slds-assistive-text">{type}</span>
                <span class={iconContainerClass} title={type}>
                    <svg class="slds-icon slds-icon_small slds-icon-text-default" aria-hidden="true">
                        <use xlink:href={iconPath}></use>
                    </svg>
                </span>
                
                <div class="slds-notify__content">
                    <h2 class="slds-text-heading_small toast-heading">                                                
                            {title}
                            <span class="toast-message">{message}</span>                    
                    </h2>
                </div>
                
                <div class="slds-notify__close">
                    <button class="slds-button slds-button_icon slds-button_icon-inverse" title="Close" onclick={closeModel}>
                        <svg class="slds-button__icon" aria-hidden="true">
                            <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#close"></use>
                        </svg>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                </div>
            </div>
        </div>
    </template>
</template>
