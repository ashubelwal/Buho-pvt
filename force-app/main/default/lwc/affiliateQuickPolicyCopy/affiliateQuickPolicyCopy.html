        <c-custom-toast auto-close-time="8000"></c-custom-toast>
    </div>
    <div class="mainDiv" if:true={isAffiliate}>

        <template if:true={booleanVar.isLoading}>
            <div class="spinner">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:true={isContactCreated}>
            <div class="message">

                    <lightning-icon class="lightningicon" icon-name="action:approval" alternative-text="Record Created"

                    <lightning-accordion class="agentDashboard" onsectiontoggle={handleToggleSection}

                            <fieldset class="slds-form-element slds-m-bottom_small" role="radiogroup">

                                            <label class="slds-radio_button__label" for="example-unique-id-94">
                                                <span class="slds-radio_faux">Create Policy</span>
                                            </label>
                                        </span>

                                        <!-- <span class="slds-button slds-radio_button">
                                            <input type="radio" name="Policy_Type__c" id="example-unique-id-95"
                                                value="RV" onchange={handleInputChange} checked={booleanVar.isPolicyRV}
                                                disabled={booleanVar.isPolicyDisabled} />

                                        </span>

                                        <span class="slds-button slds-radio_button">
                                            <input type="radio" name="Policy_Type__c" id="example-unique-id-96"
                                                value="Motorcycle/Street Legal ATV" onchange={handleInputChange}
                                                checked={booleanVar.isPolicyMotorcycle}
                                                disabled={booleanVar.isPolicyDisabled} />
                                            <label class="slds-radio_button__label" for="example-unique-id-96">
                                                <span class="slds-radio_faux">Motorcycle/ATV</span>
                                            </label>
                                        </span> -->

                                        <!-- <span class="slds-button slds-radio_button">
										<input type="radio" name="Policy_Type__c" id="example-unique-id-97"
											disabled={booleanVar.isPolicyDisabled} onchange={handleInputChange}
											value="Northbound" checked={booleanVar.isPolicyNorthbound} />
										<label class="slds-radio_button__label" for="example-unique-id-97">
											<span class="slds-radio_faux">Mexican Vehicles</span>
										</label>
									</span> -->

                                        <!-- <span class="slds-button slds-radio_button">
                                            <input type="radio" name="ContactType" id="example-unique-id-98"
                                                disabled={booleanVar.isPolicyDisabled} onchange={handleContactType}
                                                value="DMV Service" checked={booleanVar.isDMVService} />
                                            <label class="slds-radio_button__label" for="example-unique-id-98">
                                                <span class="slds-radio_faux">DMV Service</span>
                                            </label>
                                        </span>

                                        <span class="slds-button slds-radio_button">

                                                disabled={booleanVar.isPolicyDisabled} onchange={handleContactType}
                                                value="Domestic Insurance" checked={booleanVar.isDomesticInsurance} />
                                            <label class="slds-radio_button__label" for="example-unique-id-99">
                                                <span class="slds-radio_faux">Domestic Insurance</span>
                                            </label>
                                        </span> -->
                                        <!-- 
									<span class="slds-button slds-radio_button">
										<input type="radio" name="Policy_Type__c" id="example-unique-id-99" onchange={handleInputChange}
										 value="Watercraft" checked={booleanVar.isPolicyWatercraft} disabled={booleanVar.isPolicyDisabled}/>
										<label class="slds-radio_button__label" for="example-unique-id-99">
											<span class="slds-radio_faux">Watercraft</span>
									</label>
									</span> -->

                                    </div>
                                </div>
                            </fieldset>
                            <!-- 
                            <template if:true={booleanVar.isportalAccessHide}>
                                <div class="portal">
                                    <h4 class="smallHeading">Do you want a portal access?</h4>
                                    <div class="slds-grid slds-wrap">
                                        <div class="slds-grid slds-wrap">
                                            <div class="slds-col slds-p-around_small">
                                                <lightning-input class="" type="radio" name="portalAccess" label="Yes"
                                                    value="Yes" onchange={handleInputChange}
                                                    checked={booleanVar.portalAccessYes}>
                                                </lightning-input>
                                            </div>
                                            <div class="slds-col slds-p-around_small">
                                                <lightning-input class="validate" type="radio" name="portalAccess"
                                                    label="No" value="No" checked={booleanVar.portalAccessNo}
                                                    onchange={handleInputChange}>
                                                </lightning-input>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </template> -->

                            <template if:true={booleanVar.isUserDeactivated}>
                                <h2 style="color:red">Note: The user already exists. Kindly activate the user.</h2>
                            </template>

                            <!-- <template if:true={booleanVar.isTowingCheckbox}>
							<div class="slds-form-element">
								<div class="slds-form-element__control">
									<div class="slds-checkbox">
										<input type="checkbox" name="Is_towing__c" value="Yes" id="towing"
											onchange={handleInputChange} checked={booleanVar.isTowingChecked} />
										<label class="slds-checkbox__label" for="towing">
											<span class="slds-checkbox_faux"></span>
											<span class="slds-form-element__label">Are you towing anything?</span>
										</label>
									</div>
								</div>
							</div>
						</template> -->
                        </div>

                        <template if:true={booleanVar.isContactType}>
                            <c-contacts-feature contacttype={contactype}
                                oncontactcreation={handleContactChange}></c-contacts-feature>
                        </template>

                        <template if:true={booleanVar.showPolicyform}>
                            <!-- Get a quote accordion  -->
                            <lightning-accordion-section class="getAQuote accordionSection" label="Get a quote"
                                name="getAQuote">
                                <div class="accordionDiv">

                                    <!-- User details  -->
                                    <div class="card slds-p-around_small slds-m-bottom_large slds-m-top_medium">
                                        <h2 class="sectionTitle">User details</h2>

                                        <div class="slds-grid slds-wrap">
                                            <div class="slds-col slds-p-around_small">
                                                <lightning-input class="quoteValidate" label="First Name" type="text"
                                                    pattern="^[A-Za-z]+(\s[A-Za-z]+)*$" value={trackVar.FirstName}
                                                    name="FirstName" required maxlength="40"
                                                    onchange={handleInputChange}>
                                                </lightning-input>
                                            </div>
                                            <div class="slds-col slds-p-around_small">
                                                <lightning-input class="quoteValidate" label="Last Name" type="text"
                                                    pattern="^[A-Za-z]+(\s[A-Za-z]+)*$" value={trackVar.LastName}
                                                    name="LastName" required maxlength="40"
                                                    onchange={handleInputChange}>
                                                </lightning-input>
                                            </div>
                                            <div class="slds-col slds-p-around_small">
                                                <template if:false={booleanVar.emailService}>
                                                    <lightning-input class="quoteValidate" label="Email" type="email"
                                                        maxlength="40" value={trackVar.Email} name="Email"
                                                        disabled={booleanVar.disableEmail}
                                                        onblur={fetchExistingLeadOnBlur} required
                                                        onchange={handleInputChange}>
                                                    </lightning-input>
                                                </template>
                                                <template if:true={booleanVar.emailService}>
                                                    <lightning-input class="quoteValidate" label="Email" type="email"
                                                        maxlength="40" value={trackVar.Email} name="Email"
                                                        disabled={booleanVar.disableEmail}
                                                        onblur={fetchExistingLeadOnBlur} onchange={handleInputChange}
                                                        required>
                                                    </lightning-input>
                                                </template>

                                                <!-- <lightning-input type="checkbox" onchange={handleEmailService}
                                                    label="Opt In for Email service"
                                                    name="emailService"></lightning-input> -->
                                            </div>
                                            <div class="slds-col slds-p-around_small">
                                                <lightning-input class="" label="Phone" type="tel"
                                                    value={trackVar.Phone} inputmode="numeric"
                                                    pattern="\(\d{3}\) \d{3}-\d{4,7}" maxlength="17" name="Phone"
                                                    onchange={handleInputChange}></lightning-input>

                                                <!-- <lightning-input type="checkbox" label="Opt In for chat services"
                                                    name="chatServices"></lightning-input> -->
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Vehicle details -->
                                    <div class="card slds-p-around_small slds-m-bottom_large">
                                        <h2 class="sectionTitle">Vehicle details</h2>

                                        <template if:true={vehiclesOptions.length}>
                                            <lightning-combobox class="slds-p-around_small" name="ContactVehicleData"
                                                label="Vehicles" options={vehiclesOptions}
                                                onchange={changeVehiclesOption}>
                                            </lightning-combobox>
                                        </template>

                                        <!-- Vehicle Type -->
                                        <div class="slds-grid slds-wrap">
                                            <div class="slds-col slds-p-around_small">
                                                <lightning-combobox class="quoteValidate" label="Vehicle Type"
                                                    value={trackVar.Vehicle_sub_type__c}
                                                    options={vehicleTypeQuoteOptions} data-id="vehicleTypeCombobox"
                                                    name="Vehicle_sub_type__c" onchange={handleInputChange} required>
                                                </lightning-combobox>
                                            </div>
                                            <template if:false={booleanVar.isNorthbound}>
                                                <div class="slds-col slds-p-around_small">
                                                    <lightning-combobox class="quoteValidate" name="Year__c"
                                                        label="Select Year" value={trackVar.Year__c}
                                                        options={yearOption} onchange={handleInputChange} required>
                                                    </lightning-combobox>
                                                </div>
                                            </template>

                                            <template if:true={booleanVar.isNorthbound}>
                                                <div class="slds-col slds-p-around_small">
                                                    <lightning-input class="quoteValidate" label="Year"
                                                        title="Only numbers are allowed" inputmode="numeric"
                                                        pattern="[0-9]*" value={trackVar.Year__c} name="Year__c"
                                                        maxlength="4" min-length="4" onchange={handleInputChange}
                                                        required>
                                                    </lightning-input>
                                                </div>
                                            </template>

                                            <template if:false={booleanVar.isNorthbound}>
                                                <div class="slds-col slds-p-around_small">
                                                    <lightning-combobox class="quoteValidate comboboxMake"
                                                        name="Make__c" label="Make" value={trackVar.Make__c}
                                                        options={makeOptions} onchange={handleInputChange}
                                                        disabled={disableMake} required>
                                                    </lightning-combobox>
                                                </div>

                                                <template if:true={booleanVar.showManualMake}>
                                                    <div class="slds-col slds-p-around_small">
                                                        <lightning-input class="quoteValidate" label="Make"
                                                            pattern="^[A-Za-z]+(\s[A-Za-z]+)*$"
                                                            title="Only alphabetic characters are allowed"
                                                            value={trackVar.MannualMake} name="MannualMake"
                                                            maxlength="40" onchange={handleInputChange} required>
                                                        </lightning-input>
                                                    </div>
                                                </template>

                                                <div class="slds-col slds-p-around_small">
                                                    <lightning-combobox class="quoteValidate comboboxModel"
                                                        name="Model__c" label="Model" value={trackVar.Model__c}
                                                        options={modelOptions} onchange={handleInputChange}
                                                        disabled={booleanVar.isModelDisabled} required>
                                                    </lightning-combobox>
                                                </div>

                                                <template if:true={booleanVar.showManualModel}>
                                                    <div class="slds-col slds-p-around_small">
                                                        <lightning-input class="quoteValidate" label="Model"
                                                            pattern="^([a-zA-Z0-9\-\_]+\s)*[a-zA-Z0-9]+$"
                                                            title="Only alphabetic characters are allowed"
                                                            value={trackVar.MannualModel} name="MannualModel"
                                                            maxlength="40" onchange={handleInputChange} required>
                                                        </lightning-input>
                                                    </div>
                                                </template>
                                            </template>

                                            <template if:true={booleanVar.isNorthbound}>
                                                <div class="slds-col slds-p-around_small">
                                                    <lightning-input class="quoteValidate" label="Make"
                                                        pattern="^[A-Za-z]+(\s[A-Za-z]+)*$"
                                                        title="Only alphabetic characters are allowed"
                                                        value={trackVar.Make__c} name="Make__c" maxlength="40"
                                                        onchange={handleInputChange} required>
                                                    </lightning-input>
                                                </div>

                                                <div class="slds-col slds-p-around_small">
                                                    <lightning-input class="quoteValidate" label="Model"
                                                        pattern="^([a-zA-Z0-9\-\_]+\s)*[a-zA-Z0-9]+$"
                                                        title="Only alphabetic characters are allowed"
                                                        value={trackVar.Model__c} name="Model__c" maxlength="40"
                                                        onchange={handleInputChange} required>
                                                    </lightning-input>
                                                </div>

                                            </template>

                                            <div class="slds-col slds-p-around_small">
                                                <lightning-input class="quoteValidate" label="Vehicle Value"
                                                    inputmode="numeric" pattern="[0-9]*" value={trackVar.Value__c}
                                                    name="Value__c" onchange={handleInputChange} maxlength="6" required>
                                                </lightning-input>
                                            </div>
                                        </div>

                                        <div class="slds-grid slds-wrap">

                                            <template if:false={booleanVar.isNorthbound}>
                                                <div class="slds-col slds-p-around_xx-small">
                                                    <lightning-combobox class="quoteValidate"
                                                        name="Is_there_a_driver_under_21__c"
                                                        label="Will anyone under age 21 drive the vehicle?"
                                                        value={trackVar.Is_there_a_driver_under_21__c}
                                                        options={yesNoOptions} onchange={handleInputChange}
                                                        required></lightning-combobox>
                                                </div>
                                            </template>

                                            <div class="slds-col slds-p-around_xx-small">
                                                <lightning-combobox class="quoteValidate" name="Salvage_Vehicle__c"
                                                    label="Is this a salvage vehicle?"
                                                    value={trackVar.Salvage_Vehicle__c} options={yesNoOptions}
                                                    onchange={handleInputChange} required>
                                                </lightning-combobox>
                                            </div>
                                            <div class="slds-col slds-p-around_xx-small">
                                                <lightning-combobox class="quoteValidate"
                                                    name="Is_the_vehicle_used_for_business_purpose__c"
                                                    label="Is the vehicle used for business purposes?"
                                                    value={trackVar.Is_the_vehicle_used_for_business_purpose__c}
                                                    options={yesNoOptions} onchange={handleInputChange} required>
                                                </lightning-combobox>
                                            </div>
                                            <div class="slds-col slds-p-around_xx-small">
                                                <lightning-combobox class="quoteValidate"
                                                    name="Is_this_a_Rental_Vehicle__c" label="Is this a rental vehicle?"
                                                    value={trackVar.Is_this_a_Rental_Vehicle__c} options={yesNoOptions}
                                                    onchange={handleInputChange} required></lightning-combobox>
                                            </div>

                                            <template if:true={booleanVar.isNorthbound}>
                                                <div class="slds-col slds-p-around_xx-small">
                                                    <lightning-input class="quoteValidate" label="Date of birth"
                                                        type="date" name="Dob__c" max={maxDate}
                                                        value={trackVar.vehicleDob} onchange={handleInputChange}
                                                        required></lightning-input>
                                                </div>

                                            </template>
                                        </div>

                                        <div class="slds-grid slds-wrap">
                                            <!-- Liability only -->
                                            <template if:false={booleanVar.isNorthbound}>
                                                <div class="slds-col slds-size_2-of-12 slds-p-around_small">
                                                    <lightning-input class="" type="checkbox" label="Liability only"
                                                        checked={trackVar.Coverage__c} name="Coverage__c"
                                                        onchange={handleInputChange}></lightning-input>
                                                </div>
                                            </template>

                                            <!-- Towing checkbox -->
                                            <template if:true={booleanVar.isTowingCheckbox}>
                                                <div
                                                    class="slds-col slds-size_3-of-12 slds-p-around_small slds-form-element">
                                                    <div class="slds-form-element__control">
                                                        <div class="slds-checkbox">
                                                            <input type="checkbox" name="Is_towing__c" value="Yes"
                                                                id="towing" onchange={handleInputChange}
                                                                checked={booleanVar.isTowingChecked} />
                                                            <label class="slds-checkbox__label" for="towing">
                                                                <span class="slds-checkbox_faux"></span>
                                                                <span class="slds-form-element__label">Are you towing
                                                                    anything?</span>
                                                            </label>
                                                        </div>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>


                                    </div>

                                    <!-- Towed Detail -->
                                    <template if:true={booleanVar.isTowing}>
                                        <div class="card slds-p-around_small slds-m-bottom_large">

                                            <h2 class="sectionTitle">Towed Detail</h2>

                                            <template if:true={addedTowed}>
                                                <table
                                                    class="slds-table slds-table_cell-buffer slds-table_bordered driverTable slds-m-top_small">
                                                    <thead>
                                                        <tr class="slds-line-height_reset">
                                                            <th class="">
                                                                <div class="" title="Type">Type</div>
                                                            </th>
                                                            <th class="">
                                                                <div class="" title="Value">Value</div>
                                                            </th>
                                                            <th class="">
                                                                <div class="" title="Days">Days</div>
                                                            </th>
                                                            <th class="">
                                                                <div class="" title="Action">Action</div>
                                                            </th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <template for:each={addedTowed} for:item="towed">
                                                            <tr class="slds-line-height_reset" key={towed.towedCount}
                                                                style={towed.selectedStyle}>
                                                                <td>
                                                                    <div class="slds-truncate" title="">
                                                                        {towed.Towed_Unit_Type__c}</div>
                                                                </td>
                                                                <td>
                                                                    <div class="slds-truncate" title="">
                                                                        {towed.Towed_Unit_Value__c}
                                                                    </div>
                                                                </td>
                                                                <td>
                                                                    <div class="slds-truncate" title="">
                                                                        {towed.Days_in_Tow__c}
                                                                    </div>
                                                                </td>
                                                                <td>
                                                                    <div class="slds-truncate">
                                                                        <lightning-button-icon icon-name="utility:edit"
                                                                            variant="bare" alternative-text="Edit"
                                                                            data-id={towed.towedCount} title="Edit"
                                                                            onclick={handleEditTowed}>
                                                                        </lightning-button-icon>
                                                                        <lightning-button-icon
                                                                            icon-name="utility:delete" variant="bare"
                                                                            alternative-text="Delete"
                                                                            lwc:if={towed.isDeleteTowedButton}
                                                                            data-id={towed.towedCount}
                                                                            class="slds-m-left_x-small"
                                                                            onclick={handleDeleteTowned} title="Delete">
                                                                        </lightning-button-icon>
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                        </template>
                                                    </tbody>
                                                </table>
                                            </template>
                                            <div class="slds-grid slds-wrap">
                                                <div class="slds-col slds-p-around_small">
                                                    <lightning-combobox class=" cTowed" label="Type of Towed Unit"
                                                        value={newTowed.Towed_Unit_Type__c} name="Towed_Unit_Type__c"
                                                        options={TowedVehicleOptions} onchange={handleTowedInputChange}
                                                        required></lightning-combobox>
                                                </div>
                                                <div class="slds-col slds-p-around_small">
                                                    <lightning-input class=" cTowed" label="Towed Unit Value"
                                                        inputmode="numeric" pattern="[0-9]*" maxlength="6" type="text"
                                                        value={newTowed.Towed_Unit_Value__c} name="Towed_Unit_Value__c"
                                                        required onchange={handleTowedInputChange}></lightning-input>
                                                </div>
                                                <div class="slds-col slds-p-around_small">
                                                    <lightning-input class=" cTowed" label="Days in tow" type="text"
                                                        value={newTowed.Days_in_Tow__c} name="Days_in_Tow__c"
                                                        inputmode="numeric" pattern="[0-9]*" maxlength="3"
                                                        onchange={handleTowedInputChange} required>
                                                    </lightning-input>
                                                    <div class="slds-form-element__help" data-error="true"
                                                        if:true={isDaysInTowInvalid} style="color:#e74e33">
                                                        Days value must be the same as the old Towed.
                                                    </div>
                                                </div>
                                                <div class="slds-col slds-p-around_small">
                                                    <template if:false={booleanVar.editTowedBtn}>
                                                        <lightning-button class="slds-float_right mexBtn"
                                                            label="Add Towed unit" variant="brand"
                                                            onclick={handleAddNewTowed}></lightning-button>
                                                    </template>
                                                    <template if:true={booleanVar.editTowedBtn}>
                                                        <lightning-button class="slds-float_right mexBtn"
                                                            label="Update Towed" variant="brand"
                                                            onclick={handleUpdateTowed}></lightning-button>
                                                    </template>
                                                </div>

                                            </div>
                                        </div>
                                    </template>

                                    <!-- Term & Territory -->
                                    <div class="card slds-p-around_small slds-m-bottom_large">
                                        <h2 class="sectionTitle">Term & Territory</h2>
                                        <div class="slds-grid slds-wrap">
                                            <div class="slds-grid slds-wrap">
                                                <div class="slds-col slds-p-around_small">
                                                    <lightning-input class="quoteValidate" type="radio" name="Term__c"
                                                        label="Annual" value="Annual"
                                                        onchange={handleInputChange} checked={booleanVar.isAnnual}
                                                        required>
                                                    </lightning-input>
                                                </div>
                                                <div class="slds-col slds-p-around_small">
                                                    <lightning-input class="quoteValidate" type="radio" name="Term__c"
                                                        label="Semi-Annual" value="Semi-Annual"
                                                        onchange={handleInputChange} checked={booleanVar.isSemiAnnual}
                                                        required>
                                                    </lightning-input>
                                                </div>
                                                <div class="slds-col slds-p-around_small">
                                                    <lightning-input class="quoteValidate" type="radio" name="Term__c"
                                                        checked={booleanVar.isDaily} label="Daily" value="Daily"
                                                        onchange={handleInputChange} required>
                                                    </lightning-input>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="slds-grid slds-wrap">
                                            <div class="slds-col slds-p-around_small">
                                                <lightning-input class="quoteValidate" type="date"
                                                    label="Start Date for Coverage" name="Start_Date_for_Coverage__c"
                                                    value={trackVar.startDate} onchange={handleInputChange}
                                                    min={mindate} required>

                                                        inputmode="numeric"
                                                        pattern="^(?!.*[ ]{2,})(?! *$)[A-Za-z0-9*\\,-]+(?: [A-Za-z0-9*\\,-]+)*$"
                                                        maxlength="8" label="Postal Code" name="Postal_Code__c"
                                                        value={newDriver.Postal_Code__c}
                                                        onchange={handleDriverFieldsChange} required> </lightning-input>
                                                </div>

                                                <div class="slds-col slds-p-around_small">
                                                    <lightning-input class="cDriver driverValidation" type="text"
                                                        pattern="^(?!.*[ ]{2,})(?! *$)[A-Za-z0-9*\\,-]+(?: [A-Za-z0-9*\\,-]+)*$"
                                                        maxlength="40" label="City" name="City__c"
                                                        value={newDriver.City__c} onchange={handleDriverFieldsChange}
                                                        required>
                                                    </lightning-input>
                                                </div>
                                                <div class="slds-col slds-p-around_small">
                                                    <lightning-input class="cDriver driverValidation" type="text"
                                                        pattern="^(?!.*[ ]{2,})(?! *$)[A-Za-z0-9*\\,-]+(?: [A-Za-z0-9*\\,-]+)*$"
                                                        maxlength="40" label="Address" name="Address__c"
                                                        value={newDriver.Address__c} onchange={handleDriverFieldsChange}
                                                        required> </lightning-input>
                                                </div>
                                            </template>
                                        </div>

                                        <div class="slds-p-around_small slds-m-bottom_medium">
                                            <template if:false={booleanVar.editDriverBtn}>
                                                <lightning-button class="slds-float_right mexBtn" label="Add driver"
                                                    variant="brand" onclick={handleAddNewDriver}></lightning-button>
                                            </template>
                                            <template if:true={booleanVar.editDriverBtn}>
                                                <lightning-button class="slds-float_right mexBtn" label="Update driver"
                                                    variant="brand" onclick={handleUpdateDriver}></lightning-button>
                                            </template>
                                        </div>
                                    </div>

                                    <!--Towed Unit Component-->

                                    <template if:true={booleanVar.isTowingChecked}>
                                        <c-agent-towed-unit added-towed={addedTowed}
                                            onupdatetowed={updateTowedController} enable-new-towed={falseValue}
                                            action-type="newTowed"></c-agent-towed-unit>
                                    </template>


                                    <div class=" slds-p-around_small slds-m-bottom_large">
                                        <c-custom-toast auto-close-time="8000"></c-custom-toast>
                                        <lightning-button class="slds-float_right mexBtn" label="Proceed to payment"
                                            variant="brand" onclick={handleProceedButton}></lightning-button>
                                    </div>

                                    <div class=" slds-p-around_small slds-m-bottom_large">
                                        <lightning-button class="slds-float_left mexBtn" label="Previous"
                                            variant="brand" onclick={handlePrevAccordionSection}></lightning-button>
                                    </div>


                                </div>
                            </lightning-accordion-section>

                            <lightning-accordion-section class="payment accordionSection" label="Payment"
                                name="payment">
                                <div class="accordionDiv">
                                    <div class="card slds-p-around_small slds-m-bottom_large slds-m-top_medium"
                                        if:true={customerData.Policy_Type__c}>
                                        <h2 class="sectionTitle">Policy Terms</h2>
                                        <c-agent-term-agreement term-policy-type={customerData.Policy_Type__c}
                                            ondestinationinformation={handleDestinationInfo}>

                                        </c-agent-term-agreement>
                                    </div>


                                    <div class="card slds-p-around_small slds-m-bottom_large slds-m-top_medium">
                                        <h2 class="sectionTitle">Let's tackle the Payment now</h2>

                                        <div class="slds-grid slds-wrap slds-p-top_small slds-p-bottom_small"
                                            style="font-size: 20px;background: #c5ecff;padding: 10px;">
                                            <b>Payable Amount: </b> &nbsp;&nbsp; <lightning-formatted-number
                                                value={totalAmount} format-style="currency" currency-code="USD">
                                            </lightning-formatted-number>
                                        </div>

                                        <!-- <h4 class="slds-m-top_medium smallHeading">Select payment type</h4>
                                        <div class="slds-grid slds-wrap slds-m-bottom_medium">
                                            <div class="slds-grid slds-wrap">
                                                <div class="slds-col slds-p-around_small">
                                                    <lightning-input class="" type="radio" name="Payment_Type__c"
                                                        label="Card Payment" value="Card"
                                                        onchange={handlePaymentInputChange}>
                                                    </lightning-input>
                                                </div>
                                                <div class="slds-col slds-p-around_small">
                                                    <lightning-input class="validate" type="radio"
                                                        name="Payment_Type__c" label="Cash Payment" value="Cash"
                                                        onchange={handlePaymentInputChange}>
                                                    </lightning-input>
                                                </div>
                                            </div>
                                        </div> -->

                                        <!-- <template if:true={booleanVar.showCardPayment}> -->
                                        <div class="slds-grid slds-wrap">

                                            <div class="slds-col slds-p-around_small">
                                                <lightning-input class="validate" label="Address" name="Street__c"
                                                    value={trackVar.paymentStreet}
                                                    pattern="^(?!.*[ ]{2,})(?! *$)[A-Za-z0-9*\\,-]+(?: [A-Za-z0-9*\\,-]+)*$"
                                                    maxlength="40" required onchange={handlePaymentInputChange}>
                                                </lightning-input>
                                            </div>

                                            <div class="slds-col slds-p-around_small">
                                                <lightning-combobox class="validate" name="paymentCountrycmbx"
                                                    value={trackVar.paymentCountrycmbx} label="Country"
                                                    options={countryoptions} onchange={handlePaymentInputChange}
                                                    required></lightning-combobox>
                                            </div>

                                            <template if:true={otherCountrypayment}>
                                                <div class="slds-col slds-p-around_small">
                                                    <lightning-input class="validate" label="Country"
                                                        pattern="^(?!.*[ ]{2,})(?! *$)[A-Za-z0-9*\\,-]+(?: [A-Za-z0-9*\\,-]+)*$"
                                                        maxlength="40" value={trackVar.paymentCountry} name="Country__c"
                                                        onchange={handlePaymentInputChange} required></lightning-input>
                                                </div>
                                            </template>

                                            <template if:false={otherCountrypayment}>
                                                <div class="slds-col slds-p-around_small">
                                                    <lightning-combobox class="validate" name="State__c" label="State"
                                                        value={trackVar.paymentState} options={paymentStateOption}
                                                        onchange={handlePaymentInputChange}
                                                        required></lightning-combobox>
                                                </div>
                                            </template>

                                            <template if:true={otherCountrypayment}>
                                                <div class="slds-col slds-p-around_small">
                                                    <lightning-input class="validate" label="State"
                                                        pattern="^(?!.*[ ]{2,})(?! *$)[A-Za-z0-9*\\,-]+(?: [A-Za-z0-9*\\,-]+)*$"
                                                        maxlength="40" value={trackVar.paymentState} name="State__c"
                                                        onchange={handlePaymentInputChange} required></lightning-input>
                                                </div>
                                            </template>

                                            <div class="slds-col slds-p-around_small">
                                                <lightning-input class="validate" label="City" name="City__c" required
                                                    pattern="^(?!.*[ ]{2,})(?! *$)[A-Za-z0-9*\\,-]+(?: [A-Za-z0-9*\\,-]+)*$"
                                                    maxlength="40" value={trackVar.paymentCity}
                                                    onchange={handlePaymentInputChange}></lightning-input>
                                            </div>
                                            <div class="slds-col slds-p-around_small">
                                                <lightning-input class="validate" label="Postal Code"
                                                    value={trackVar.paymentZip} name="Postal_Code__c"
                                                    inputmode="numeric"
                                                    pattern="^(?!.*[ ]{2,})(?! *$)[A-Za-z0-9*\\,-]+(?: [A-Za-z0-9*\\,-]+)*$"
                                                    maxlength="8" required onchange={handlePaymentInputChange}>
                                                </lightning-input>
                                            </div>
                                        </div>
                                        <div class="slds-grid slds-wrap">
                                            <div class="slds-col slds-p-around_small">
                                                <lightning-input class="validate" label="Card Holder Name" name="name"
                                                    pattern="^(?!.*[ ]{2,})(?! *$)[A-Za-z0-9*\\,-]+(?: [A-Za-z0-9*\\,-]+)*$"
                                                    maxlength="40" required onchange={handlePaymentInputChange}
                                                    value={payeeName}></lightning-input>
                                            </div>
                                            <div class="slds-col slds-p-around_small">
                                                <lightning-input class="validate" label="Card Number"
                                                    value={formattedCreditCardNumber} name="cardNumber"
                                                    pattern="[0-9\s]*" inputmode="numeric"
                                                    message-when-pattern-mismatch="Only numbers can be entered"
                                                    minlength="12" data-id="cardNumber" required maxlength="19"
                                                    onchange={handlePaymentInputChange}></lightning-input>
                                            </div>
                                            <div class="slds-col slds-p-around_small">
                                                <lightning-combobox class="validate" name="month" data-id="month"
                                                    label="Expiration Month" placeholder="MM" options={months}
                                                    onchange={handlePaymentInputChange} required>
                                                </lightning-combobox>
                                            </div>
                                            <div class="slds-col slds-p-around_small">
                                                <lightning-combobox class="validate" name="year" label="Expiration Year"
                                                    placeholder="YYYY" options={YYYY}
                                                    onchange={handlePaymentInputChange} data-id="year" required>
                                                </lightning-combobox>
                                            </div>
                                            <div class="slds-col slds-p-around_small">
                                                <lightning-input class="validate" label="Security Code" value=""
                                                    name="code" type="text" minlength="3" maxlength="4"
                                                    pattern="^(?=.*[1-9])\d+$"
                                                    message-when-pattern-mismatch="Only numbers can be entered" required
                                                    onchange={handlePaymentInputChange}></lightning-input>
                                            </div>
                                        </div>
                                        <!-- </template> -->

                                        <div>
                                            <lightning-button class="slds-float_left mexBtn" label="Previous"
                                                variant="brand" onclick={handlePrevAccordionSection}></lightning-button>
                                        </div>

                                        <div class="slds-p-around_small slds-m-bottom_medium">
                                            <lightning-button class="slds-float_right mexBtn" label="Make payment"
                                                variant="brand" name="" onclick={handlMakePayment}></lightning-button>
                                        </div>
                                    </div>

                                </div>
                            </lightning-accordion-section>

                            <lightning-accordion-section class="accordionSection" name="policyQuickActions"
                                label="Policy Quick Actions">
                                <c-affiliate-policy-quick-actions cmp-source={cmpSource}
                                    renewd-policy-id={renewdPolicyId}
                                    actionmode={actionmode}></c-affiliate-policy-quick-actions>
                            </lightning-accordion-section>
                        </template>
                    </lightning-accordion>
                </div>
            </div>
        </template>
    </div>
    <div class="affiliateHead" if:false={isAffiliate}>
        <div style="text-align:center">
            <!-- <h2>Affiliate code is invalid. Please contact your agency.</h2> -->
            <h2 style="font-weight: 600;">The URL you entered is incorrect. Please verify it and try again. If the issue persists, contact your agency for further assistance.</h2>
        </div>
    </div>
</template>
