<template>

    <div>
		<c-custom-toast auto-close-time="8000"></c-custom-toast>
	</div>

    <template if:true={isLoading}>
        <div class="spinner">
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </div>
    </template>

    <div class="slds-grid slds-wrap">
        <div class="slds-col slds-size_1-of-1 slds-align_absolute-center">
        </div>
        <div class="slds-col slds-size_1-of-1 slds-align_absolute-center"
            style="font-size:20px;text-align:center;">
            {acknowledgementMessage}</br>
            You can either print this policy document or navigate to policy record for a quick
            check
            by clicking on below provided action buttons.
        </div>
        <div class="slds-col slds-size_1-of-1  slds-grid slds-wrap"
            style="font-size: 18px;color: #0b6a9c;font-weight: bold;padding-top: 60px;padding-bottom: 60px;">
            <div class="slds-col slds-size_3-of-8"></div>
            <div class="slds-col slds-size_1-of-8 slds-grid slds-wrap" style="cursor:pointer;"
                onclick={generatePolicyPDF}>
                <div class="slds-col slds-size_1-of-1 slds-align_absolute-center">
                    <svg width="80px" height="80px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 3V16M12 16L16 11.625M12 16L8 11.625" stroke="#1C274C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M15 21H9C6.17157 21 4.75736 21 3.87868 20.1213C3 19.2426 3 17.8284 3 15M21 15C21 17.8284 21 19.2426 20.1213 20.1213C19.8215 20.4211 19.4594 20.6186 19 20.7487" stroke="#1C274C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-align_absolute-center">Print/Download
                </div>
            </div>
            <div class="slds-col slds-size_1-of-8 slds-grid slds-wrap" style="cursor:pointer;"
                onclick={navigateToPolicy}>
                <div class="slds-col slds-size_1-of-1 slds-align_absolute-center">
                    <svg fill="#000000" width="80px" height="80px" viewBox="-2 0 19 19" xmlns="http://www.w3.org/2000/svg" class="cf-icon-svg"><path d="M14.443 4.445a1.615 1.615 0 0 1-1.613 1.614h-.506v8.396a1.615 1.615 0 0 1-1.613 1.613H2.17a1.613 1.613 0 1 1 0-3.227h.505V4.445A1.615 1.615 0 0 1 4.289 2.83h8.54a1.615 1.615 0 0 1 1.614 1.614zM2.17 14.96h7.007a1.612 1.612 0 0 1 0-1.01H2.172a.505.505 0 0 0 0 1.01zm9.045-10.515a1.62 1.62 0 0 1 .08-.505H4.29a.5.5 0 0 0-.31.107l-.002.001a.5.5 0 0 0-.193.397v8.396h6.337a.61.61 0 0 1 .6.467.632.632 0 0 1-.251.702.505.505 0 1 0 .746.445zm-.86 1.438h-5.76V6.99h5.76zm0 2.26h-5.76V9.25h5.76zm0 2.26h-5.76v1.108h5.76zm2.979-5.958a.506.506 0 0 0-.505-.505.496.496 0 0 0-.31.107h-.002a.501.501 0 0 0-.194.398v.505h.506a.506.506 0 0 0 .505-.505z"/></svg>

                </div>
                <div class="slds-col slds-size_1-of-1 slds-align_absolute-center">View Policy

            </div>
            <div class="slds-col slds-size_3-of-8"></div>
        </div>
    </div>
</template>
