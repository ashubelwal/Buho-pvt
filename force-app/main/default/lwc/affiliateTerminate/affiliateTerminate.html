<template>
    <div>
        <c-custom-toast auto-close-time="8000"></c-custom-toast>
    </div>
    <div class="page-content">
        <template if:true={spinner}>
            <lightning-spinner alternative-text="Loading" variant="brand"></lightning-spinner>
        </template>
        <template if:false={spinner}>
            <template if:true={isRefundDetail}>



                <div class="mainDIv slds-p-around--small notranslate">
                    <div class="policyBanner slds-p-around--xx-large slds-m-bottom--large">
                        <div class="sectionFirst slds-m-bottom--medium">
                            <h2 class="policyName slds-align_absolute-center slds-m-bottom--x-large"
                                onclick={handleBack}>{terminatePolicyName}</h2>
                        </div>
                        <div class="sectionSecond ">
                            <template if:true={policyDetail}>

                                <div class="slds-grid slds-grid_align-spread">
                                    <div class="slds-col">

                                        <h4 class="slds-m-bottom--small">{label.PolicyType} :
                                            {policyDetail.quoteData.Policy_Type_picklist__c}</h4>
                                        <!-- <h4>{policyDetail.quoteData.Territory__c}</h4> -->
                                        <h4>{label.MedicalType} : {policyDetail.quoteData.Medical__c}</h4>
                                        <!-- <h4>Third Party Bodily Injury : {policyDetail.Third_Party_Bodily_Injury__c}</h4> -->
                                    </div>

                                    <div class="slds-col alginRight">
                                        <h4 class="slds-m-bottom--x-small">{label.Pacakge} :
                                            {policyDetail.quoteData.Coverage__c}</h4>
                                        <h4 class="">{label.LiabilityType} : {policyDetail.quoteData.Liability__c}</h4>
                                    </div>
                                </div>

                            </template>

                        </div>
                    </div>
                    <div class="divSection slds-m-bottom--large">
                        <div class="termSection">
                            <h3 class="summary-title green slds-m-bottom--small">{label.PolicyInformation}</h3>
                            <div class="slds-grid slds-grid_align-spread slds-m-bottom--small">
                                <div class="slds-col slds-size--1-of-3">
                                    <h6 class="">{label.StartDate}</h6>
                                    <h2>{policyDetail.policyData.Start_Date__c}</h2>

                                </div>
                                <div class="slds-col slds-size--1-of-3 alginCenter">
                                    <h6 class="">{label.TermType}</h6>
                                    <h2>{policyDetail.policyData.Term__c}</h2>
                                </div>
                                <div class="slds-col slds-size--1-of-3 alginRight">
                                    <h6 class="">{label.EndDate}</h6>
                                    <h2>{policyDetail.policyData.End_Date__c}</h2>
                                </div>
                            </div>
                            <div class="slds-grid slds-grid_align-spread">
                                <div class="slds-col slds-size--1-of-3">
                                    <h6 class="">{label.PolicyPremiumAmount} </h6>
                                    <h2><lightning-formatted-number
                                            value={policyDetail.policyData.Total_Premium_Amount__c}
                                            format-style="currency" currency-code="USD"></lightning-formatted-number>
                                    </h2>

                                </div>
                                <div class="slds-col slds-size--1-of-3 alginCenter">
                                    <h6 class="">{label.PolicyDays}</h6>
                                    <h2>{policyDetail.quoteData.Term_Days__c}</h2>
                                </div>
                                <div class="slds-col slds-size--1-of-3 alginRight">
                                    <h6 class="">{label.PolicyUsedDays} </h6>
                                    <h2>{refundObj.daysUsed}</h2>
                                </div>
                            </div>
                        </div>

                    </div>
                    <div class="rateDescriptionSection divSection">

                        <div class="summary-box-content refundSection slds-m-bottom--small">
                            <h3 class="summary-title green slds-m-bottom--small">{label.RefundCalculation}</h3>

                            <div class="slds-grid slds-grid_align-spread">
                                <div class="slds-col">
                                    <h6>{label.PolicyPremiumAmount} </h6>
                                </div>

                                <div class="slds-col balckColor">
                                    <h6><lightning-formatted-number
                                            value={policyDetail.policyData.Total_Premium_Amount__c}
                                            format-style="currency" currency-code="USD"></lightning-formatted-number>
                                    </h6>
                                </div>
                            </div>
                            <div class="slds-grid slds-grid_align-spread">
                                <div class="slds-col">
                                    <h6>{label.PolicyUsedPremium} </h6>
                                </div>

                                <div class="slds-col balckColor">
                                    <h6>-<lightning-formatted-number value={usedPolicyPrimium} format-style="currency"
                                            currency-code="USD"></lightning-formatted-number></h6>
                                </div>

                            </div>
                            <template if:true={refundObj.ivaTax}>
                                <div class="slds-grid slds-grid_align-spread">
                                    <div class="slds-col">
                                        <h6>{label.IVATax}</h6>
                                    </div>

                                    <div class="slds-col balckColor">
                                        <h6>-<lightning-formatted-number value={refundObj.ivaTax}
                                                format-style="currency"
                                                currency-code="USD"></lightning-formatted-number></h6>
                                    </div>

                                </div>
                            </template>
                            <template if:true={refundObj.surcharge}>
                                <div class="slds-grid slds-grid_align-spread">
                                    <div class="slds-col">
                                        <h6>{label.Surcharge} </h6>
                                    </div>

                                    <div class="slds-col balckColor">
                                        <h6>-<lightning-formatted-number value={refundObj.surcharge}
                                                format-style="currency"
                                                currency-code="USD"></lightning-formatted-number></h6>
                                    </div>

                                </div>
                            </template>
                            <div class="slds-grid slds-grid_align-spread slds-m-bottom--x-small">
                                <div class="slds-col">
                                    <h6>{label.Brokerfee} (Non refundable)</h6>
                                </div>

                                <div class="slds-col balckColor">
                                    <h6>-<lightning-formatted-number
                                            value={policyDetail.policyData.Broker_Policy_Fee__c} format-style="currency"
                                            currency-code="USD"></lightning-formatted-number></h6>
                                </div>
                            </div>
                        </div>

                        <div class="refundCalculation slds-text-align--right">

                            <span class="summary-refund">{label.TOTALREFUND} : </span>
                            <span class="refundamout green"><template if:false={nonWatercraftPolicy}>
                                    <lightning-formatted-number value={refundWatercraft} format-style="currency"
                                        currency-code="USD"></lightning-formatted-number>
                                </template>

                                <template if:true={nonWatercraftPolicy}>
                                    <lightning-formatted-number value={refundDisplayAmount} format-style="currency"
                                        currency-code="USD"></lightning-formatted-number>


                                </template>
                            </span>

                        </div>

                        <div class="resonForTerminate slds-m-top_small">
                            <lightning-combobox class="" name="combobox_Reason__c" label={label.Reasonforterminating}
                                placeholder={label.Reasonforterminating} options={resonForTerminateOptions}
                                onchange={handlechangeTerminate}></lightning-combobox>
                            <template if:true={showOtherOption}>
                                <lightning-textarea class="" name="Why_Terminate_Policy__c"
                                    placeholder={label.Reasonforterminating} onchange={handlechangeTerminate}
                                    max-length="350"></lightning-textarea>
                            </template>


                        </div>

                    </div>
                    <div class="">
                        <div class="slds-m-top_x-large noteQuote">
                            <h6>{label.Note}:&nbsp;</h6>
                            <p>{label.Onceconfirmed}</p>
                        </div>


                        <div class="slds-m-bottom_x-large align-center buttons-group slds-align_absolute-center">
                            <template if:true={isCommunity}>
                                <button class="buttonNext button -secondary -min-width-small"
                                    onclick={handleBack}>{label.Cancel}</button>
                                <button class="buttonterminate button -primary -min-width-small slds-m-left_small"
                                    style="" onclick={terminateConfirm}>{label.Terminate}</button>
                            </template>

                            <template if:false={isCommunity}>
                                <button class="buttonterminate button -primary -min-width-small slds-m-left_small"
                                    onclick={terminateConfirm}>{label.Terminate}</button>
                            </template>
                        </div>
                    </div>
                </div>

                <template if:true={isTerminate}>

                                    {label.Whyareyouterminating}

                                </h2>
                            </header>
                            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                                <div class="summary-total">{label.TOTALREFUND} <span class="summary-amount white">

                                        <template if:false={nonWatercraftPolicy}>
                                            <lightning-formatted-number value={refundWatercraft} format-style="currency"
                                                currency-code="USD"></lightning-formatted-number>
                                        </template>

                                        <template if:true={nonWatercraftPolicy}>
                                            <lightning-formatted-number value={refundDisplayAmount}
                                                format-style="currency"
                                                currency-code="USD"></lightning-formatted-number>
                                        </template>
                                    </span></div>

                            </div>
                            <footer class="slds-modal__footer">
                                <button class="slds-button slds-button_neutral"
                                    onclick={cancleTerminate}>{label.Cancel}</button>
                                <button class="slds-button slds-button_destructive"
                                    onclick={terminatePolicy}>{label.ConfirmTerminate}
                                </button>
                            </footer>
                        </div>
                    </section>
                    <div class="slds-backdrop slds-backdrop_open"></div>


                </template>

                    <h1>{label.LetstacklethePaymentnow}</h1>
                </div>

            </lightning-layout-item>

            <template if:false={nonWatercraftPolicy}>

                <c-payment policy-type={policyType} editpolicydata={policyDetail} refund-amount={refundWatercraft}
                    is-refund={isRefund} policy-id={recordId} changesnextscreen={changeNextScreen}
                    refund-obj={refundObj} changeprevscreen={changePrevScreen} transaction-details={transactionRecord}
                    companyaddress={isshowaddress}></c-payment>
            </template>
            <template if:true={nonWatercraftPolicy}>
