<template>
   <template if:true={isModalOpen}>
      <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-02"
         class="slds-modal slds-fade-in-open">
         <div class="slds-modal__container">
            <div class="slds-modal__header">
               <h1 id="modal-heading-03" class="slds-modal__title slds-hyphenate" tabindex="-1">Transfer Ownsership
               </h1>
            </div>
            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-01">
               <div>This contact does not associated with current Agency. Do you want to Transfer the Ownership!
               </div>
               <c-transfer-ownership-manager onclosemodal={cancelTransferOwnership} contact-id={currentContactId}
                  ontoast={handleToast} user-id={userId}></c-transfer-ownership-manager>
            </div>
            <div class="slds-modal__footer">
               <button class="slds-button slds-button_neutral" aria-label="Cancel and close"
                  onclick={cancelTransferOwnership}>Cancel</button>
               <button class="slds-button slds-button_brand" onclick={handlerTransferOwnership}>Transfer
               Ownership</button>
            </div>
         </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
   </template>
   <div>
      <c-custom-toast auto-close-time="8000"></c-custom-toast>
   </div>
   <div class="mainDiv">
      <template if:true={booleanVar.isLoading}>
         <div class="spinner">
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
         </div>
      </template>
      <template if:true={isContactCreated}>
         <div class="message">
            <div class="">
               <lightning-icon class="lightningicon" icon-name="action:approval" alternative-text="Record Created"
                  title="" size="large"></lightning-icon>
            </div>
            <h1 style="font-size: 4rem;">Thank you</h1>
            <p style="font-size:20px">The Contact record has been successfully created</p>
            <lightning-button variant="base" label="View Contact" name="ViewContact" onclick={navigateToContact}
               class="slds-align_absolute-center" style="font-size:20px"> </lightning-button>
         </div>
      </template>
      <template if:false={isContactCreated}>
         <div class="slds-grid slds-wrap">
            <div class="slds-col ">
               <lightning-accordion class="agentDashboard" onsectiontoggle={handleToggleSection}
                  active-section-name={activeSectionName}>
                  <div class="card slds-p-around_small slds-m-bottom_large insuranceType">
                     <fieldset class="slds-form-element slds-m-bottom_small">
                        <legend class="slds-form-element__legend slds-form-element__label slds-m-bottom_small">
                           What kind of insurance do you want us to quote?
                        </legend>
                        <div class="slds-form-element__control">
                           <div class="slds-radio_button-group">
                              <span class="slds-button slds-radio_button"> <input type="radio" name="Policy_Type__c" id="example-unique-id-94" value="Automobile-Van-Minivan" onchange={handleInputChange} checked={booleanVar.isPolicyAutomobile} disabled={booleanVar.isPolicyDisabled} /> <label class="slds-radio_button__label" for="example-unique-id-94"> <span class="slds-radio_faux">Create Policy</span>
                              </label> </span>
                              <!-- <span class="slds-button slds-radio_button"> <input type="radio" name="Policy_Type__c" id="example-unique-id-95" value="RV" onchange={handleInputChange} checked={booleanVar.isPolicyRV} disabled={booleanVar.isPolicyDisabled} /> <label class="slds-radio_button__label" for="example-unique-id-95"> <span class="slds-radio_faux">RV</span>
                              </label> </span>
                              <span class="slds-button slds-radio_button"> <input type="radio" name="Policy_Type__c" id="example-unique-id-96" value="Motorcycle/Street Legal ATV" onchange={handleInputChange} checked={booleanVar.isPolicyMotorcycle} disabled={booleanVar.isPolicyDisabled} /> <label class="slds-radio_button__label" for="example-unique-id-96"> <span class="slds-radio_faux">Motorcycle/ATV</span>
                              </label> </span> -->
                              <template if:true={userType}>
                                 <span class="slds-button slds-radio_button"> <input type="radio" name="ContactType" id="example-unique-id-98" disabled={booleanVar.isPolicyDisabled} onchange={handleContactType} value="DMV Service" checked={booleanVar.isDMVService} /> <label class="slds-radio_button__label" for="example-unique-id-98"> <span class="slds-radio_faux">DMV Service</span>
                                 </label> </span>
                                 <span class="slds-button slds-radio_button"> <input type="radio" name="ContactType" id="example-unique-id-99" disabled={booleanVar.isPolicyDisabled} onchange={handleContactType} value="Domestic Insurance" checked={booleanVar.isDomesticInsurance} /> <label class="slds-radio_button__label" for="example-unique-id-99"> <span class="slds-radio_faux">Domestic Insurance</span>
                                 </label> </span>
                              </template>
                              <!-- <span class="slds-button slds-radio_button"> <input type="radio" name="Policy_Type__c" id="example-unique-id-99" onchange={handleInputChange} value="Watercraft" checked={booleanVar.isPolicyWatercraft} disabled={booleanVar.isPolicyDisabled}/> <label class="slds-radio_button__label" for="example-unique-id-99"> <span class="slds-radio_faux">Watercraft</span> </label> </span> -->
                           </div>
                        </div>
                     </fieldset>
                     <template if:true={booleanVar.isportalAccessHide}>
                        <div class="portal">
                           <h4 class="smallHeading">Do you want a portal access?</h4>
                           <div class="slds-grid slds-wrap">
                              <div class="slds-grid slds-wrap">
                                 <div class="slds-col slds-p-around_small">
                                    <lightning-input class="" type="radio" name="portalAccess" label="Yes" value="Yes"
                                       onchange={handleInputChange} checked={booleanVar.portalAccessYes}>
                                    </lightning-input>
                                 </div>
                                 <div class="slds-col slds-p-around_small">
                                    <lightning-input class="validate" type="radio" name="portalAccess" label="No"
                                       value="No" checked={booleanVar.portalAccessNo} onchange={handleInputChange}>
                                    </lightning-input>
                                 </div>
                              </div>
                           </div>
                        </div>
                     </template>
                     <template if:true={booleanVar.isUserDeactivated}>
                        <h2 style="color:red">Note: The user already exists. Kindly activate the user.</h2>
                     </template>
                     <!-- <template if:true={booleanVar.isTowingCheckbox}> <div class="slds-form-element"> <div class="slds-form-element__control"> <div class="slds-checkbox"> <input type="checkbox" name="Is_towing__c" value="Yes" id="towing" onchange={handleInputChange} checked={booleanVar.isTowingChecked} /> <label class="slds-checkbox__label" for="towing"> <span class="slds-checkbox_faux"></span> <span class="slds-form-element__label">Are you towing anything?</span> </label> </div> </div> </div> </template> -->
                  </div>
                  <template if:true={booleanVar.isContactType}>
                     <c-contacts-feature contacttype={contactype} oncontactcreation={handleContactChange}>
                     </c-contacts-feature>
                  </template>
                  <template if:true={booleanVar.showPolicyform}>
                     <lightning-accordion-section class="getAQuote accordionSection" label="Get a quote"
                        name="getAQuote">
                        <div class="accordionDiv">
                           <div class="card slds-p-around_small slds-m-bottom_large slds-m-top_medium">

                              <h2 class="sectionTitle">Agency Detail</h2>
                              <div class="slds-grid slds-wrap">
                                 <div class="slds-col slds-p-around_small">
                                    <lightning-record-picker label="Agency" placeholder="Search Agency"
                                       object-api-name="Contact" value={agency} filter={agencyFilter}
                                       onchange={handleAgencyChange}>
                                    </lightning-record-picker>
                                 </div>
                                 <div class="slds-col slds-p-around_small">
                                    <lightning-record-picker label="Agent" placeholder="Search Agent"
                                       object-api-name="Contact" value={agent} filter={agentFilter}
                                       onchange={handleAgentChange}>
                                    </lightning-record-picker>
                                 </div>
                              </div>
                           </div>
                           <div class="card slds-p-around_small slds-m-bottom_large slds-m-top_medium">
                              <h2 class="sectionTitle">User details</h2>
                              <div class="slds-grid slds-wrap">
                                 <div class="slds-col slds-p-around_small">
                                    <lightning-input class="quoteValidate" label="First Name" type="text"
                                       pattern="^[A-Za-z]+(\s[A-Za-z]+)*$" value={trackVar.FirstName} name="FirstName"
                                       required maxlength="40" onchange={handleInputChange}> </lightning-input>
                                 </div>
                                 <div class="slds-col slds-p-around_small">
                                    <lightning-input class="quoteValidate" label="Last Name" type="text"
                                       pattern="^[A-Za-z]+(\s[A-Za-z]+)*$" value={trackVar.LastName} name="LastName"
                                       required maxlength="40" onchange={handleInputChange}> </lightning-input>
                                 </div>
                                 <div class="slds-col slds-p-around_small">
                                    <template if:false={booleanVar.emailService}>
                                       <lightning-input class="quoteValidate" label="Email" type="email" maxlength="40"
                                          value={trackVar.Email} name="Email" disabled={booleanVar.disableEmail}
                                          onblur={fetchExistingLeadOnBlur} required={booleanVar.portalAccessYes}
                                          onchange={handleInputChange}> </lightning-input>
                                    </template>
                                    <template if:true={booleanVar.emailService}>
                                       <lightning-input class="quoteValidate" label="Email" type="email" maxlength="40"
                                          value={trackVar.Email} name="Email" disabled={booleanVar.disableEmail}
                                          onblur={fetchExistingLeadOnBlur} required={booleanVar.portalAccessYes}
                                          onchange={handleInputChange}> </lightning-input>
                                    </template>
                                    <lightning-input type="checkbox" onchange={handleEmailService}
                                       label="Opt In for Email service" name="emailService">
                                    </lightning-input>
                                 </div>
                                 <div class="slds-col slds-p-around_small">
                                    <lightning-input class="" label="Phone" type="tel" value={trackVar.Phone}
                                       inputmode="numeric" pattern="\(\d{3}\) \d{3}-\d{4,7}" maxlength="17" name="Phone"
                                       onchange={handleInputChange}></lightning-input>
                                    <lightning-input type="checkbox" label="Opt In for chat services"
                                       name="chatServices"></lightning-input>
                                 </div>
                              </div>
                           </div>
                           <div class="card slds-p-around_small slds-m-bottom_large">
                              <h2 class="sectionTitle">Vehicle details</h2>
                              <template if:true={vehiclesOptions.length}>
                                 <lightning-combobox class="slds-p-around_small" name="ContactVehicleData"
                                    label="Vehicles" options={vehiclesOptions} onchange={changeVehiclesOption}>
                                 </lightning-combobox>
                              </template>
                              <!-- Vehicle Type -->
                              <div class="slds-grid slds-wrap">
                                 <div class="slds-col slds-p-around_small">
                                    <lightning-combobox class="quoteValidate" label="Vehicle Type"
                                       value={trackVar.Vehicle_sub_type__c} options={vehicleTypeQuoteOptions}
                                       data-id="vehicleTypeCombobox" name="Vehicle_sub_type__c"
                                       onchange={handleInputChange} required>
                                    </lightning-combobox>
                                 </div>
                                 <template if:false={booleanVar.isNorthbound}>
                                    <div class="slds-col slds-p-around_small">
                                       <lightning-combobox class="quoteValidate" name="Year__c" label="Select Year"
                                          value={trackVar.Year__c} options={yearOption} onchange={handleInputChange}
                                          required>
                                       </lightning-combobox>
                                    </div>
                                 </template>
                                 <template if:true={booleanVar.isNorthbound}>
                                    <div class="slds-col slds-p-around_small">
                                       <lightning-input class="quoteValidate" label="Year"
                                          title="Only numbers are allowed" inputmode="numeric" pattern="[0-9]*"
                                          value={trackVar.Year__c} name="Year__c" maxlength="4" min-length="4"
                                          onchange={handleInputChange} required> </lightning-input>
                                    </div>
                                 </template>
                                 <template if:false={booleanVar.isNorthbound}>
                                    <div class="slds-col slds-p-around_small">
                                       <lightning-combobox class="quoteValidate comboboxMake" name="Make__c"
                                          label="Make" value={trackVar.Make__c} options={makeOptions}
                                          onchange={handleInputChange} disabled={disableMake} required>
                                       </lightning-combobox>
                                    </div>
                                    <template if:true={booleanVar.showManualMake}>
                                       <div class="slds-col slds-p-around_small">
                                          <lightning-input class="quoteValidate" label="Make"
                                             pattern="^[A-Za-z]+(\s[A-Za-z]+)*$"
                                             title="Only alphabetic characters are allowed" value={trackVar.MannualMake}
                                             name="MannualMake" maxlength="40" onchange={handleInputChange} required>
                                          </lightning-input>
                                       </div>
                                    </template>
                                    <div class="slds-col slds-p-around_small">
                                       <lightning-combobox class="quoteValidate comboboxModel" name="Model__c"
                                          label="Model" value={trackVar.Model__c} options={modelOptions}
                                          onchange={handleInputChange} disabled={booleanVar.isModelDisabled} required>
                                       </lightning-combobox>
                                    </div>
                                    <template if:true={booleanVar.showManualModel}>
                                       <div class="slds-col slds-p-around_small">
                                          <lightning-input class="quoteValidate" label="Model"
                                             pattern="^([a-zA-Z0-9\-\_]+\s)*[a-zA-Z0-9]+$"
                                             title="Only alphabetic characters are allowed"
                                             value={trackVar.MannualModel} name="MannualModel" maxlength="40"
                                             onchange={handleInputChange} required>
                                          </lightning-input>
                                       </div>
                                    </template>
                                 </template>
                                 <template if:true={booleanVar.isNorthbound}>
                                    <div class="slds-col slds-p-around_small">
                                       <lightning-input class="quoteValidate" label="Make"
                                          pattern="^[A-Za-z]+(\s[A-Za-z]+)*$"
                                          title="Only alphabetic characters are allowed" value={trackVar.Make__c}
                                          name="Make__c" maxlength="40" onchange={handleInputChange} required>
                                       </lightning-input>
                                    </div>
                                    <div class="slds-col slds-p-around_small">
                                       <lightning-input class="quoteValidate" label="Model"
                                          pattern="^([a-zA-Z0-9\-\_]+\s)*[a-zA-Z0-9]+$"
                                          title="Only alphabetic characters are allowed" value={trackVar.Model__c}
                                          name="Model__c" maxlength="40" onchange={handleInputChange} required>
                                       </lightning-input>
                                    </div>
                                 </template>
                                 <div class="slds-col slds-p-around_small">
                                    <lightning-input class="quoteValidate" label="Vehicle Value" inputmode="numeric"
                                       pattern="[0-9]*" value={trackVar.Value__c} name="Value__c"
                                       onchange={handleInputChange} maxlength="6" required>
                                    </lightning-input>
                                 </div>
                              </div>
                              <div class="slds-grid slds-wrap">
                                 <template if:false={booleanVar.isNorthbound}>
                                    <div class="slds-col slds-p-around_xx-small">
                                       <lightning-combobox class="quoteValidate" name="Is_there_a_driver_under_21__c"
                                          label="Will anyone under age 21 drive the vehicle?"
                                          value={trackVar.Is_there_a_driver_under_21__c} options={yesNoOptions}
                                          onchange={handleInputChange} required>
                                       </lightning-combobox>
                                    </div>
                                 </template>
                                 <div class="slds-col slds-p-around_xx-small">
                                    <lightning-combobox class="quoteValidate" name="Salvage_Vehicle__c"
                                       label="Is this a salvage vehicle?" value={trackVar.Salvage_Vehicle__c}
                                       options={yesNoOptions} onchange={handleInputChange} required>
                                    </lightning-combobox>
                                 </div>
                                 <div class="slds-col slds-p-around_xx-small">
                                    <lightning-combobox class="quoteValidate"
                                       name="Is_the_vehicle_used_for_business_purpose__c"
                                       label="Is the vehicle used for business purposes?"
                                       value={trackVar.Is_the_vehicle_used_for_business_purpose__c}
                                       options={yesNoOptions} onchange={handleInputChange} required>
                                    </lightning-combobox>
                                 </div>
                                 <div class="slds-col slds-p-around_xx-small">
                                    <lightning-combobox class="quoteValidate" name="Is_this_a_Rental_Vehicle__c"
                                       label="Is this a rental vehicle?" value={trackVar.Is_this_a_Rental_Vehicle__c}
                                       options={yesNoOptions} onchange={handleInputChange} required>
                                    </lightning-combobox>
                                 </div>
                                 <template if:true={booleanVar.isNorthbound}>
                                    <div class="slds-col slds-p-around_xx-small">
                                       <lightning-input class="quoteValidate" label="Date of birth" type="date"
                                          name="Dob__c" max={maxDate} value={trackVar.vehicleDob}
                                          onchange={handleInputChange} required></lightning-input>
                                    </div>
                                 </template>
                              </div>
                              <div class="slds-grid slds-wrap">
                                 <div class="slds-col slds-size_4-of-12 slds-p-around_small">
                                          <lightning-input name="Electric_Hybrid__c" type="checkbox" label="Is this a Electric Hybrid vehicle?"
                                             checked={trackVar.Electric_Hybrid__c} onchange={handleInputChange}></lightning-input>
                                 </div>
                                 <!-- Liability only -->
                                 <template if:false={booleanVar.isNorthbound}>
                                    <div class="slds-col slds-size_2-of-12 slds-p-around_small">
                                       <lightning-input class="" type="checkbox" label="Liability only"
                                          checked={trackVar.Coverage__c} name="Coverage__c"
                                          onchange={handleInputChange}></lightning-input>
                                    </div>
                                 </template>
                                 <!-- Towing checkbox -->
                                 <template if:true={booleanVar.isTowingCheckbox}>
                                    <div class="slds-col slds-size_3-of-12 slds-p-around_small slds-form-element">
                                       <div class="slds-form-element__control">
                                          <div class="slds-checkbox"> <input type="checkbox" name="Is_towing__c" value="Yes" id="towing" onchange={handleInputChange} checked={booleanVar.isTowingChecked} />
                                             <label class="slds-checkbox__label" for="towing"> <span class="slds-checkbox_faux"></span> <span class="slds-form-element__label">Are you towing anything?</span> </label>
                                          </div>
                                       </div>
                                    </div>
                                 </template>
                              </div>
                           </div>
                           <!-- Towed Detail -->
                           <template if:true={booleanVar.isTowing}>
                              <div class="card slds-p-around_small slds-m-bottom_large">
                                 <h2 class="sectionTitle">Towed Detail</h2>
                                 <template if:true={addedTowed}>
                                    <table
                                       class="slds-table slds-table_cell-buffer slds-table_bordered driverTable slds-m-top_small">
                                       <thead>
                                          <tr class="slds-line-height_reset">
                                             <th class="">
                                                <div class="" title="Type">Type</div>
                                             </th>
                                             <th class="">
                                                <div class="" title="Value">Value</div>
                                             </th>
                                             <th class="">
                                                <div class="" title="Days">Days</div>
                                             </th>
                                             <th class="">
                                                <div class="" title="Action">Action</div>
                                             </th>
                                          </tr>
                                       </thead>
                                       <tbody>
                                          <template for:each={addedTowed} for:item="towed">
                                             <tr class="slds-line-height_reset" key={towed.towedCount}
                                                style={towed.selectedStyle}>
                                                <td>
                                                   <div class="slds-truncate" title="">
                                                      {towed.Towed_Unit_Type__c}
                                                   </div>
                                                </td>
                                                <td>
                                                   <div class="slds-truncate" title="">
                                                      {towed.Towed_Unit_Value__c}
                                                   </div>
                                                </td>
                                                <td>
                                                   <div class="slds-truncate" title="">
                                                      {towed.Days_in_Tow__c}
                                                   </div>
                                                </td>
                                                <td>
                                                   <div class="slds-truncate">
                                                      <lightning-button-icon icon-name="utility:edit" variant="bare"
                                                         alternative-text="Edit" data-id={towed.towedCount} title="Edit"
                                                         onclick={handleEditTowed}>
                                                      </lightning-button-icon>
                                                      <lightning-button-icon icon-name="utility:delete" variant="bare"
                                                         alternative-text="Delete" lwc:if={towed.isDeleteTowedButton}
                                                         data-id={towed.towedCount} class="slds-m-left_x-small"
                                                         onclick={handleDeleteTowned} title="Delete">
                                                      </lightning-button-icon>
                                                   </div>
                                                </td>
                                             </tr>
                                          </template>
                                       </tbody>
                                    </table>
                                 </template>
                                 <div class="slds-grid slds-wrap">
                                    <div class="slds-col slds-p-around_small">
                                       <lightning-combobox class=" cTowed" label="Type of Towed Unit"
                                          value={newTowed.Towed_Unit_Type__c} name="Towed_Unit_Type__c"
                                          options={TowedVehicleOptions} onchange={handleTowedInputChange} required>
                                       </lightning-combobox>
                                    </div>
                                    <div class="slds-col slds-p-around_small">
                                       <lightning-input class=" cTowed" label="Towed Unit Value" inputmode="numeric"
                                          pattern="[0-9]*" maxlength="6" type="text"
                                          value={newTowed.Towed_Unit_Value__c} name="Towed_Unit_Value__c" required
                                          onchange={handleTowedInputChange}></lightning-input>
                                    </div>
                                    <div class="slds-col slds-p-around_small">
                                       <lightning-input class=" cTowed" label="Days in tow" type="text"
                                          value={newTowed.Days_in_Tow__c} name="Days_in_Tow__c" inputmode="numeric"
                                          pattern="[0-9]*" maxlength="3" onchange={handleTowedInputChange} required>
                                       </lightning-input>
                                       <div class="slds-form-element__help" data-error="true"
                                          if:true={isDaysInTowInvalid} style="color:#e74e33"> Days value
                                          must be the same as the old Towed.
                                       </div>
                                    </div>
                                    <div class="slds-col slds-p-around_small">
                                       <template if:false={booleanVar.editTowedBtn}>
                                          <lightning-button class="slds-float_right mexBtn" label="Add Towed unit"
                                             variant="brand" onclick={handleAddNewTowed}></lightning-button>
                                       </template>
                                       <template if:true={booleanVar.editTowedBtn}>
                                          <lightning-button class="slds-float_right mexBtn" label="Update Towed"
                                             variant="brand" onclick={handleUpdateTowed}></lightning-button>
                                       </template>
                                    </div>
                                 </div>
                              </div>
                           </template>
                           <!-- Term & Territory -->
                           <div class="card slds-p-around_small slds-m-bottom_large">
                              <h2 class="sectionTitle">Term & Territory</h2>
                              <div class="slds-grid slds-wrap">
                                 <div class="slds-grid slds-wrap">
                                    <div class="slds-col slds-p-around_small">
                                       <lightning-input class="quoteValidate" type="radio" name="Term__c" label="Annual"
                                          value="Annual" onchange={handleInputChange} checked={booleanVar.isAnnual}
                                          required> </lightning-input>
                                    </div>
                                    <div class="slds-col slds-p-around_small">
                                       <lightning-input class="quoteValidate" type="radio" name="Term__c"
                                          label="Semi-Annual" value="Semi-Annual" onchange={handleInputChange}
                                          checked={booleanVar.isSemiAnnual} required> </lightning-input>
                                    </div>
                                    <div class="slds-col slds-p-around_small">
                                       <lightning-input class="quoteValidate" type="radio" name="Term__c"
                                          checked={booleanVar.isDaily} label="Daily" value="Daily"
                                          onchange={handleInputChange} required> </lightning-input>
                                    </div>
                                 </div>
                              </div>
                              <div class="slds-grid slds-wrap">
                                 <div class="slds-col slds-p-around_small">

                                       </lightning-input>
                                    </div>
                                    <div class="slds-col slds-p-around_small">
                                       <lightning-combobox class="validate" name="paymentCountrycmbx"
                                          value={trackVar.paymentCountrycmbx} label="Country" options={countryoptions}
                                          onchange={handlePaymentInputChange} required></lightning-combobox>
                                    </div>
                                    <template if:true={otherCountrypayment}>
                                       <div class="slds-col slds-p-around_small">
                                          <lightning-input class="validate" label="Country"
                                             pattern="^(?!.*[ ]{2,})(?! *$)[A-Za-z0-9*\\,-]+(?: [A-Za-z0-9*\\,-]+)*$"
                                             maxlength="40" value={trackVar.paymentCountry} name="Country__c"
                                             onchange={handlePaymentInputChange} required></lightning-input>
                                       </div>
                                    </template>
                                    <template if:false={otherCountrypayment}>
                                       <div class="slds-col slds-p-around_small">
                                          <lightning-combobox class="validate" name="State__c" label="State"
                                             value={trackVar.paymentState} options={paymentStateOption}
                                             onchange={handlePaymentInputChange} required>
                                          </lightning-combobox>
                                       </div>
                                    </template>
                                    <template if:true={otherCountrypayment}>
                                       <div class="slds-col slds-p-around_small">
                                          <lightning-input class="validate" label="State"
                                             pattern="^(?!.*[ ]{2,})(?! *$)[A-Za-z0-9*\\,-]+(?: [A-Za-z0-9*\\,-]+)*$"
                                             maxlength="40" value={trackVar.paymentState} name="State__c"
                                             onchange={handlePaymentInputChange} required>
                                          </lightning-input>
                                       </div>
                                    </template>
                                    <div class="slds-col slds-p-around_small">
                                       <lightning-input class="validate" label="City" name="City__c" required
                                          pattern="^(?!.*[ ]{2,})(?! *$)[A-Za-z0-9*\\,-]+(?: [A-Za-z0-9*\\,-]+)*$"
                                          maxlength="40" value={trackVar.paymentCity}
                                          onchange={handlePaymentInputChange}></lightning-input>
                                    </div>
                                    <div class="slds-col slds-p-around_small">
                                       <lightning-input class="validate" label="Postal Code" value={trackVar.paymentZip}
                                          name="Postal_Code__c" inputmode="numeric"
                                          pattern="^(?!.*[ ]{2,})(?! *$)[A-Za-z0-9*\\,-]+(?: [A-Za-z0-9*\\,-]+)*$"
                                          maxlength="8" required onchange={handlePaymentInputChange}>
                                       </lightning-input>
                                    </div>
                                 </div>
                                 <div class="slds-grid slds-wrap">
                                    <div class="slds-col slds-p-around_small">
                                       <lightning-input class="validate" label="Card Holder Name" name="name"
                                          pattern="^(?!.*[ ]{2,})(?! *$)[A-Za-z0-9*\\,-]+(?: [A-Za-z0-9*\\,-]+)*$"
                                          maxlength="40" required onchange={handlePaymentInputChange} value={payeeName}>
                                       </lightning-input>
                                    </div>
                                    <div class="slds-col slds-p-around_small">
                                       <lightning-input class="validate" label="Card Number"
                                          value={formattedCreditCardNumber} name="cardNumber" pattern="[0-9\s]*"
                                          inputmode="numeric"
                                          message-when-pattern-mismatch="Only numbers can be entered" minlength="12"
                                          data-id="cardNumber" required maxlength="19"
                                          onchange={handlePaymentInputChange}></lightning-input>
                                    </div>
                                    <div class="slds-col slds-p-around_small">
                                       <lightning-combobox class="validate" name="month" data-id="month"
                                          label="Expiration Month" placeholder="MM" options={months}
                                          onchange={handlePaymentInputChange} required>
                                       </lightning-combobox>
                                    </div>
                                    <div class="slds-col slds-p-around_small">
                                       <lightning-combobox class="validate" name="year" label="Expiration Year"
                                          placeholder="YYYY" options={YYYY} onchange={handlePaymentInputChange}
                                          data-id="year" required>
                                       </lightning-combobox>
                                    </div>
                                    <div class="slds-col slds-p-around_small">
                                       <lightning-input class="validate" label="Security Code" value="" name="code"
                                          type="text" minlength="3" maxlength="4" pattern="^(?=.*[1-9])\d+$"
                                          message-when-pattern-mismatch="Only numbers can be entered" required
                                          onchange={handlePaymentInputChange}></lightning-input>
                                    </div>
                                 </div>
                              </template>
                              <div>
                                 <lightning-button class="slds-float_left mexBtn" label="Previous" variant="brand"
                                    onclick={handlePrevAccordionSection}></lightning-button>
                              </div>
                              <div class="slds-p-around_small slds-m-bottom_medium">
                                 <lightning-button class="slds-float_right mexBtn" label="Make payment" variant="brand"
                                    name="" onclick={handlMakePayment}></lightning-button>
                              </div>
                           </div>
                        </div>
                     </lightning-accordion-section>
                     <lightning-accordion-section class="accordionSection" name="policyQuickActions"
                        label="Policy Quick Actions">
                        <c-agent-policy-quick-actions cmp-source={cmpSource} renewd-policy-id={renewdPolicyId}
                           actionmode={actionmode}></c-agent-policy-quick-actions>
                     </lightning-accordion-section>
                  </template>
               </lightning-accordion>
            </div>
         </div>
      </template>
   </div>
</template>
