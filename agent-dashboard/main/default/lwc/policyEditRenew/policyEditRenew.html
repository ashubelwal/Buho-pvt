<template>
    <div>
        <c-custom-toast auto-close-time="8000"></c-custom-toast>

    </div>
    <div class="MainBackground slds-p-around_large">

        <lightning-spinner size="medium" alternative-text="Processing" lwc:if={booleanVar.isLoading}></lightning-spinner>

    <lightning-accordion class="example-accordion" onsectiontoggle={handleToggleSection} active-section-name={activeSectionName}>
    <lightning-accordion-section name="A" label="Pre-Quote Details">


        
        <!-- Term Section -->
        <div class="card slds-p-around_small slds-m-bottom_large">
            <h2 class="sectionTitle">Term & Territory</h2>
            <div class="slds-grid slds-wrap">
                <div class="slds-grid slds-wrap">
                    <div class="slds-col slds-p-around_small">
                        <lightning-radio-group 
                        name="Term__c" class="Validation Term__c"
                          label="Policy Term"
                          options={policyTermOption}
                          onchange={onGroup}
                          type="button"></lightning-radio-group>
                        
                    </div>
                </div>
            </div>
            <div class="slds-grid slds-wrap">
                
                <div class="slds-col slds-p-around_small" if:true={isRenewalPolicyFlag}> 
                    <lightning-input class="quoteValidate Start_Date_for_Coverage__c Validation" type="date"
                        label="Start Date for Coverage" name="Start_Date_for_Coverage__c"
                        value={trackVar.startDate} onchange={handleInputChange} min={mindate}
                        required>
                    </lightning-input>

                </div>
                <div class="slds-col slds-p-around_small" if:false={isRenewalPolicyFlag}> 
                    <lightning-input class="Start_Date_for_Coverage__c" type="date"
                    label="Start Date for Coverage" name="Start_Date_for_Coverage__c"
                    value={trackVar.startDate} onchange={handleInputChange} disabled="true"
                    required>
                    </lightning-input>
                </div>

                <div class="slds-col slds-p-around_small" if:true={isEditEndDateFlag}>
                    <lightning-input class="quoteValidate End_Date_for_Coverage__c Validation" type="date"
                        label="End Date for Coverage" min={endMinDate} 
                        name="End_Date_for_Coverage__c" 
                        onchange={handleInputChange} required>
                    </lightning-input>
                </div>

                <div class="slds-col slds-p-around_small" if:false={isEditEndDateFlag}>
                    <lightning-input class="quoteValidate End_Date_for_Coverage__c Validation" type="date"
                        label="End Date for Coverage" min={endMinDate} disabled="true"
                        name="End_Date_for_Coverage__c" 
                        onchange={handleInputChange} required>
                    </lightning-input>
                </div>
                
                <template if:true={booleanVar.isShowingEndTerm}>
                    <div class="slds-col slds-p-around_small">
                        <lightning-input class="quoteValidate Start_Time__c Validation" type="time" label="Start Time"
                            name="Start_Time__c" onchange={handleInputChange} onblur={handleStartTimeValidation}
                             min={displayPstTime} disabled={isdisabledstartdate}>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-p-around_small">
                        <lightning-input class="quoteValidate End_Time__c Validation" type="time" label="End Time"
                            name="End_Time__c" onchange={handleInputChange} disabled="true"
                             required>
                        </lightning-input>
                    </div>
                </template>
            </div>
            <!-- Territory  -->
            <div class="">
                <!-- <h2 class="sectionTitle">Territory</h2> -->
                <div class="slds-grid slds-wrap" lwc:if={isDiscountVisible}>
                    <div class="slds-col slds-p-around_small">
                        <lightning-radio-group 
                        name="Territory__c" class="Territory__c Validation"
                          label="Territory"
                          options={territoryOption}
                          onchange={handleInputChange}
                          type="button"></lightning-radio-group>
                    </div>
                
                </div>
            </div>

            <!-- Medical and Liability Options -->
            <div class="">
                <!-- <h2 class="sectionTitle">Territory</h2> -->
                <div class="slds-grid slds-wrap">
                    <div class="slds-col slds-p-around_small" lwc:if={isMedicalVisible}>
                        <lightning-combobox 
                            name="Medical__c" class="Medical__c Validation Medicalpicklist"
                            label="Medical"
                            placeholder="Select Medical "
                            options={medicalOption}
                            onchange={handleChange} ></lightning-combobox>
                    </div>
                    <div class="slds-col slds-p-around_small">
                        <lightning-combobox
                        name="Liability__c"
                        label="Liability" class="Liability__c Validation LiabilityPicklist"
                        
                        placeholder="Select Liability"
                        options={liabilityOption}
                        onchange={handleChange} ></lightning-combobox>
                    </div>
                </div>
            </div>
            
            <div class="slds-grid slds-wrap">

                <div class="slds-col slds-p-around_small">
                     <lightning-input name="Electric_Hybrid__c" type="checkbox" label="Is this a Electric Hybrid vehicle?"
                                             checked={booleanVar.Electric_Hybrid__c} onchange={handleChange}></lightning-input>
                </div>

                <div class="slds-col" lwc:if={isTowedVisible}>
                    <lightning-input type="checkbox" class="TowedUnit" label="Are you towing anything?"
                     onchange={updateTowingCheckbox} checked={booleanVar.isTowing}></lightning-input>
                </div>
            </div>
           
        </div>

        <!-- Vehicle Details -->
        <div class="card slds-p-around_small slds-m-bottom_large">
            <h2 class="sectionTitle">Vehicle details</h2>

            <div class="slds-grid slds-wrap">

                    <div class="slds-col slds-p-around_small">
                        <lightning-input type="text" label="Year" disabled="true" class="Validation Vehicle_Year__c" onchange={handleInputChange} required></lightning-input>
                    </div>
                    <div class="slds-col slds-p-around_small">
                        <lightning-input type="text" label="Make" disabled="true" class=" Validation Vehicle_Make__c" onchange={handleInputChange} required></lightning-input>
                    </div>
                    <div class="slds-col slds-p-around_small">
                        <lightning-input label="Model" class="Validation Vehicle_Model__c"
                            name="Make__c" disabled="true" onchange={handleInputChange} required>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-p-around_small">
                        <lightning-input class="Validation quoteValidate Vehicle_Value__c" label="Vehicle Value" inputmode="numeric" pattern="[0-9]*" maxlength="6"
                            name="Value__c" onchange={handleInputChange} required>
                        </lightning-input>
                    </div>
            </div>

            <div class="slds-grid slds-wrap">
                <div class="slds-col slds-p-around_small">
                    <lightning-input type="text" name="Vin__c" label="VIN Number" class="Validation Vin__c" onchange={handleInputChange} required></lightning-input>
                </div>

                <div class="slds-col slds-p-around_small">						
                    <lightning-combobox class="Validation Registered_Country__c" name="Registered_Country__cmbx" label="Registered Country" options={countryoptions} onchange={handleInputChange} required>
                    </lightning-combobox> 
                </div>

                <template if:true={otherCountryRegister}>
                    <div class="slds-col slds-p-around_small">
                        <lightning-input class="Validation Registered_Country__c" label="Registered Country" pattern="^(?!.*[ ]{2,})(?! *$)[A-Za-z0-9*\\,-]+(?: [A-Za-z0-9*\\,-]+)*$" maxlength="40" name="Registered_Country__c"
                            onchange={handleInputChange} required></lightning-input>
                    </div>
                </template>

                <template if:false={otherCountryRegister}>
                    <div class="slds-col slds-p-around_small">
                        <lightning-combobox class="Validation Registered_State__c" name="Registered_State__c" label="Registered State/Province"
                            options={stateOption} onchange={handleInputChange} required></lightning-combobox>
                    </div>
                </template>

                <template if:true={otherCountryRegister}>
                    <div class="slds-col slds-p-around_small">
                        <lightning-input class="Validation Registered_State__c" label="Registered State/Province" name="Registered_State__c"
                            pattern="^(?!.*[ ]{2,})(?! *$)[A-Za-z0-9*\\,-]+(?: [A-Za-z0-9*\\,-]+)*$" maxlength="40" onchange={handleInputChange} required></lightning-input>
                    </div>
                </template>

                <!-- <div class="slds-col slds-p-around_small">
                    <lightning-input type="text" name="Registered_Country__c" label="Registered Country" class="Validation Registered_Country__c" onchange={handleInputChange} required></lightning-input>
                </div>
                <div class="slds-col slds-p-around_small">
                    <lightning-input type="text" name="Registered_State__c" label="Registered State/Province" class="Validation Registered_State__c" onchange={handleInputChange} required></lightning-input>
                </div> -->
                <div class="slds-col slds-p-around_small">
                    <lightning-input type="text" name="Registered_Plate__c" label="Placas-License Plate" class="Validation Registered_Plate__c" onchange={handleInputChange} required></lightning-input>
                </div>
            </div>

            <!-- Lienholder and Company address option checkbox -->
            <div class="slds-grid slds-wrap">
                <div class="slds-grid slds-wrap">
                    <div class="slds-col slds-p-around_small">
                        <lightning-input type="checkbox" lwc:if={vehicleData} label="Is vehicle leased or financed?" checked={vehicleData.Is_Lienholder__c}
                            onchange={handleInputChange} name="lienholder"></lightning-input>
                    </div>
                    <div class="slds-col slds-p-around_small">
                        <lightning-input type="checkbox" lwc:if={vehicleData} label="Is vehicle rented and/or owned by a company?"
                        onchange={handleInputChange}  checked={vehicleData.Is_vehicle_owned_by_a_company_or_rented__c}
                        name="companyAddress"> </lightning-input>
                    </div>
                </div>
            </div>

        </div>

        
        
        <!-- Lienholder  -->
        <template lwc:if={vehicleData}>
            <template if:true={vehicleData.Is_Lienholder__c}>
                <div class="card slds-p-around_small slds-m-bottom_large slds-m-top_medium">
                    <h2 class="sectionTitle">Lienholder</h2>
                    <c-lienholder-manager onlienholderdetails={updateLienHolderDetails} lienholderdetails={vehicleData}></c-lienholder-manager>
                </div>
            </template>
            
        </template>

        <!-- Company Address -->
        <template if:true={vehicleData}>
            <template if:true={vehicleData.Is_vehicle_owned_by_a_company_or_rented__c}>
            
                <div class="card slds-p-around_small slds-m-bottom_large">
                    <h2 class="sectionTitle">Company Address</h2>
                    <div class="slds-grid slds-wrap">
                        <div class="slds-col slds-p-around_small">
                            <lightning-input class="Validation purchaseValidate" pattern="^[A-Za-z]+(\s[A-Za-z]+)*$" label="Name" value={vehicleData.Company_Name__c}
                                name="Company_Name__c" onchange={handleInputChange} required>
                            </lightning-input>
                        </div>

                        <div class="slds-col slds-p-around_small">
                            <c-address-recommendations onsendaddress={handleCompanyAddress}>
                            </c-address-recommendations>
                        </div>

                        <!-- <div class="slds-col slds-p-around_small">
                            <lightning-input class="Validation purchaseValidate" pattern="^[A-Za-z]+(\s[A-Za-z]+)*$" label="Country" value={vehicleData.Company_Country__c}
                                name="Company_Country__c" onchange={handleInputChange} required>
                            </lightning-input>
                        </div>

                        <div class="slds-col slds-p-around_small">
                            <lightning-input class="Validation purchaseValidate" pattern="^[A-Za-z]+(\s[A-Za-z]+)*$" label="State" value={vehicleData.Company_State__c}
                                name="Company_State__c" onchange={handleInputChange} required>
                            </lightning-input>
                        </div> -->


                        <div class="slds-col slds-p-around_small">
                            <lightning-combobox class="Validation purchaseValidate" name="Company_Country__cmbx" value={vehicleData.companyCountrycmbx} label="Country" 
                                options={countryoptions} onchange={handleInputChange} required></lightning-combobox>
                        </div>

                        <template if:true={otherCountryCompany}>
                            <div class="slds-col slds-p-around_small">
                                <lightning-input class="Validation purchaseValidate" label="Country" pattern="^(?!.*[ ]{2,})(?! *$)[A-Za-z0-9*\\,-]+(?: [A-Za-z0-9*\\,-]+)*$" maxlength="40"
                                value={vehicleData.Company_Country__c} name="Company_Country__c" onchange={handleInputChange} required></lightning-input>
                            </div>
                        </template>
                        
                        <template if:false={otherCountryCompany}>
                            <div class="slds-col slds-p-around_small">
                                <lightning-combobox class="Validation purchaseValidate" name="Company_State__c" label="State" value={vehicleData.Company_State__c}
                                    options={CompanyStateOption} onchange={handleInputChange} required></lightning-combobox>
                            </div>
                        </template>

                        <template if:true={otherCountryCompany}>
                            <div class="slds-col slds-p-around_small">
                                <lightning-input class="Validation purchaseValidate" label="State" pattern="^(?!.*[ ]{2,})(?! *$)[A-Za-z0-9*\\,-]+(?: [A-Za-z0-9*\\,-]+)*$" maxlength="40"
                                value={vehicleData.Company_State__c} name="Company_State__c" onchange={handleInputChange} required></lightning-input>
                            </div>
                        </template>

                        <div class="slds-col slds-p-around_small">
                            <lightning-input class="Validation purchaseValidate" pattern="^(?!.*[ ]{2,})(?! *$)[A-Za-z0-9*\\,-]+(?: [A-Za-z0-9*\\,-]+)*$" label="Postal Code" value={vehicleData.Company_Zip__c}
                                name="Company_Zip__c" onchange={handleInputChange} required></lightning-input>
                        </div>
                       
                        <div class="slds-col slds-p-around_small">
                            <lightning-input class="Validation purchaseValidate" pattern="^(?!.*[ ]{2,})(?! *$)[A-Za-z0-9*\\,-]+(?: [A-Za-z0-9*\\,-]+)*$" label="City" value={vehicleData.Company_City__c}
                                name="Company_City__c" onchange={handleInputChange} required></lightning-input>
                        </div>
                        <div class="slds-col slds-p-around_small">
                            <lightning-input class="Validation purchaseValidate" pattern="^(?!.*[ ]{2,})(?! *$)[A-Za-z0-9*\\,-]+(?: [A-Za-z0-9*\\,-]+)*$" label="Address" value={vehicleData.Company_Address__c}
                                name="Company_Address__c" onchange={handleInputChange} required>
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-p-around_small">
                            <lightning-input class="Validation purchaseValidate" pattern="\(\d{3}\) \d{3}-\d{4,7}" maxlength="17" label="Phone" value={vehicleData.Company_Phone__c}
                                name="Company_Phone__c" onchange={handleInputChange} required>
                            </lightning-input>
                        </div>
                    </div>
                </div>
            </template> 
        </template>

        <!-- Driver Details -->
        <div class="card slds-p-around_small slds-m-bottom_large">
            <h2 class="sectionTitle">Human Operators and/or Owners</h2>
            <template if:true={addedDriver}>
                <table
                    class="slds-table slds-table_cell-buffer slds-table_bordered driverTable">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th class="">
                                <div class="" title="Name">Name</div>
                            </th>
                            <th class="">
                                <div class="" title="Country">Country</div>
                            </th>
                            <th class="">
                                <div class="" title="State">State</div>
                            </th>
                            <th class="">
                                <div class="" title="License #">License #</div>
                            </th>
                            <th class="">
                                <div class="" title="Date of birth">Date of birth</div>
                            </th>
                            <th class="">
                                <div class="" title="Is Owner">Driver Type</div>
                            </th>
                            <th class="">
                                <div class="" title="Action">Action</div>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={addedDriver} for:item="driver">
                            <tr class="slds-line-height_reset" style={driver.selectedStyle} key={driver.license_number__c}>
                                <td>
                                    <div class="slds-truncate" title="Cloudhub">
                                        {driver.First_Name__c}
                                        {driver.Last_Name__c}</div>
                                </td>
                                <td>
                                    <div class="slds-truncate" title="4/14/2015">
                                        {driver.License_Country__c}
                                    </div>
                                </td>
                                <td>
                                    <div class="slds-truncate" title="Prospecting">
                                        {driver.License_state__c}
                                    </div>
                                </td>
                                <td>
                                    <div class="slds-truncate" title="20%">
                                        {driver.license_number__c}</div>
                                </td>
                                <td>
                                    <div class="slds-truncate" title="$25k">{driver.Dob__c}
                                    </div>
                                </td>
                                <td>
                                    <div class="slds-truncate">{driver.Driver_Type__c }
                                    </div>
                                </td>
                                <td>
                                    <div class="slds-truncate">
                                        <lightning-button-icon icon-name="utility:edit"
                                            variant="bare" alternative-text="Edit"
                                            data-id={driver.license_number__c} title="Edit"
                                            onclick={handleEditDriver}>
                                        </lightning-button-icon>
                                        <lightning-button-icon icon-name="utility:delete"
                                            variant="bare" alternative-text="Delete" lwc:if={driver.showDeleteButton}
                                            data-id={driver.license_number__c}
                                            class="slds-m-left_x-small"
                                            onclick={handleDeleteDriver} title="Delete">
                                        </lightning-button-icon>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>

            <div class="slds-grid slds-wrap">
                <div class="slds-col slds-p-around_small">
                    <lightning-input class="cDriver driverValidation" label="First Name"
                        pattern="^[A-Za-z]+(\s[A-Za-z]+)*$" maxlength="40" type="text"
                         value={newDriver.First_Name__c} name="First_Name__c"
                        onchange={handleDriverFieldsChange} required> </lightning-input>
                </div>
                <div class="slds-col slds-p-around_small">
                    <lightning-input class="cDriver driverValidation" label="Last Name"
                        pattern="^[A-Za-z]+(\s[A-Za-z]+)*$" maxlength="40"
                        type="text" value={newDriver.Last_Name__c} name="Last_Name__c"
                        onchange={handleDriverFieldsChange} required> </lightning-input>
                </div>

                <!-- <div class="slds-col slds-p-around_small">
                    <lightning-input class="cDriver driverValidation" label="License Country"
                        pattern="^[A-Za-z]+(\s[A-Za-z]+)*$" maxlength="40"
                        value={newDriver.License_Country__c} name="License_Country__c"
                        onchange={handleDriverFieldsChange} required></lightning-input>
                </div>
                <div class="slds-col slds-p-around_small">
                    <lightning-input class="cDriver driverValidation" label="License State"
                        pattern="^[A-Za-z]+(\s[A-Za-z]+)*$" maxlength="40"
                        value={newDriver.License_state__c} name="License_state__c"
                        onchange={handleDriverFieldsChange} required>
                    </lightning-input>
                </div> -->

                <div class="slds-col slds-p-around_small">
                    <lightning-combobox class="cDriver driverValidation" name="License_Country__cmbx"
                        label="License Country" value={newDriver.License_Country__cmbx}
                        options={countryoptions} onchange={handleDriverFieldsChange} required>
                    </lightning-combobox>
                </div>

                <template if:true={newDriver.otherCountryVehicle}>
                    <div class="slds-col slds-p-around_small">
                        <lightning-input class="cDriver driverValidation" label="License Country"
                            pattern="^(?!.*[ ]{2,})(?! *$)[A-Za-z0-9*\\,-]+(?: [A-Za-z0-9*\\,-]+)*$" maxlength="40"
                            value={newDriver.License_Country__c} name="License_Country__c"
                            onchange={handleDriverFieldsChange} required>
                        </lightning-input>
                    </div>
                </template>		
                
                
                <template if:false={newDriver.otherCountryVehicle}>
                    <div class="slds-col slds-p-around_small">
                        <lightning-combobox class="cDriver driverValidation" name="License_state__c"
                            label="License State" value={newDriver.License_state__c}
                            options={vehicleStateOption} onchange={handleDriverFieldsChange} required>
                        </lightning-combobox>
                    </div>
                </template>

                <template if:true={newDriver.otherCountryVehicle}>
                    <div class="slds-col slds-p-around_small">
                        <lightning-input class="cDriver driverValidation" label="License State"
                            pattern="^(?!.*[ ]{2,})(?! *$)[A-Za-z0-9*\\,-]+(?: [A-Za-z0-9*\\,-]+)*$" maxlength="40"
                            value={newDriver.License_state__c} name="License_state__c"
                            onchange={handleDriverFieldsChange} required>
                        </lightning-input>
                    </div>
                </template>


                <div class="slds-col slds-p-around_small">
                    <lightning-input class="cDriver driverValidation" label="License #"
                        pattern="^(?!.*[ ]{2,})(?! *$)[A-Za-z0-9*\\,-]+(?: [A-Za-z0-9*\\,-]+)*$" maxlength="40" minlength="4"
                        value={newDriver.license_number__c} name="license_number__c"
                        onchange={handleDriverFieldsChange} required>
                    </lightning-input>
                </div>
                <div class="slds-col slds-p-around_small">
                    <lightning-input class="cDriver driverValidation" label="Date of birth"
                        value={newDriver.Dob__c} type="date" name="Dob__c" max={maxDOBDate}
                        onchange={handleDriverFieldsChange} required></lightning-input>
                </div>
                <div class="slds-col slds-p-around_small">
                    <lightning-input class="cDriver driverValidation registeredOwnerCheckbox" type="checkbox"
                        title="Owner registration" label="Registered Owner?"
                        name="Driver_Type__c" onchange={handleDriverFieldsChange} value={newDriver.owner}
                        checked={newDriver.owner} >
                    </lightning-input>
                </div>
                <template if:true={booleanVar.isOwner}>

                    <div class="slds-col slds-p-around_small">
                        <c-address-recommendations onsendaddress={handleDriverAddress}>
                        </c-address-recommendations>
                    </div>

                    <!-- <div class="slds-col slds-p-around_small">
                        <lightning-input class="cDriver driverValidation" type="text"
                            pattern="^[A-Za-z]+(\s[A-Za-z]+)*$" maxlength="40"
                            label="Owner Country" name="Country__c" value={newDriver.Country__c}
                            onchange={handleDriverFieldsChange} required> </lightning-input>
                    </div>
                    <div class="slds-col slds-p-around_small">
                        <lightning-input class="cDriver driverValidation" type="text"
                            pattern="^[A-Za-z]+(\s[A-Za-z]+)*$" maxlength="40" label="State"
                            name="State_Province__c" value={newDriver.State_Province__c}
                            onchange={handleDriverFieldsChange} required> </lightning-input>
                    </div> -->


                    <div class="slds-col slds-p-around_small">
                        <lightning-combobox class="cDriver driverValidation" name="Country__cmbx" label="Owner Country" value={newDriver.Country__cmbx}
                            options={countryoptions} onchange={handleDriverFieldsChange} required></lightning-combobox>
                    </div>

                    <template if:true={newDriver.otherCountryDriver}>
                        <div class="slds-col slds-p-around_small">
                            <lightning-input class="cDriver driverValidation" label="Owner Country" pattern="^(?!.*[ ]{2,})(?! *$)[A-Za-z0-9*\\,-]+(?: [A-Za-z0-9*\\,-]+)*$" maxlength="40" value={newDriver.Country__c} name="Country__c"
                                onchange={handleDriverFieldsChange} required></lightning-input>
                        </div>
                    </template>		
                    
                    
                    <template if:false={newDriver.otherCountryDriver}>
                        <div class="slds-col slds-p-around_small">
                            <lightning-combobox class="cDriver driverValidation" name="State_Province__c" label="State" value={newDriver.State_Province__c}
                                options={driverStateOption} onchange={handleDriverFieldsChange} required></lightning-combobox>
                        </div>
                    </template>

                    <template if:true={newDriver.otherCountryDriver}>
                        <div class="slds-col slds-p-around_small">
