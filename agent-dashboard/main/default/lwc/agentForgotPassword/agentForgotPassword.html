<template>
  <!-- Bootstrap 5 + Bootstrap Icons loaded via static resource in the JS -->
  <div class="auth-page" style={backgroundStyle}>
    <!-- Top-right logo bar -->
    <div class="auth-topbar">
      <img class="auth-logo" src={logoUrl} alt="Mex Insurance Logo" />
      <div class="topbar-divider"></div>
    </div>

    <!-- Glassmorphism card -->
    <div class="auth-card-wrapper">
      <div class="auth-card">

        <!-- Default view: enter email -->
        <template if:false={isSubmitted}>
          <!-- Card Header -->
          <div class="auth-card-header">
            <p class="auth-tagline">
              Reset your <span>MexInsurance&#174;</span> password
            </p>
            <h1>Forgot password?</h1>
            <p class="auth-switch-link">
              Enter the email address associated with your account and we'll
              send you a link to reset your password.
            </p>
          </div>

          <!-- Form -->
          <div class="auth-form" onkeypress={handleKeyPress}>

            <!-- Inline error alert -->
            <template if:true={errorCheck}>
              <div
                class="alert alert-danger"
                role="alert"
                style="color: #dc3545; background-color: #f8d7da; border-color: #f5c6cb; padding: .75rem 1.25rem; margin-bottom: 1rem; border-radius: .25rem; font-size: 14px;"
              >
                {errorMessage}
              </div>
            </template>

            <!-- Email -->
            <div class="form-group">
              <label class="form-label" for="forgot-email">Email address</label>
              <input
                type="email"
                id="forgot-email"
                class="form-control email-input"
                placeholder="you@example.com"
                autocomplete="email"
              />
            </div>

            <!-- CTA -->
            <button
              type="button"
              id="btn-send-reset"
              class="btn-auth-primary"
              onclick={handleForgotPassword}
              disabled={isLoading}
            >
              <template if:true={isLoading}>
                <span
                  class="spinner-border spinner-border-sm me-2"
                  role="status"
                  aria-hidden="true"
                ></span>
                Sending&hellip;
              </template>
              <template if:false={isLoading}>
                Send reset link
              </template>
            </button>

            <!-- Back to login -->
            <div class="auth-back-link">
              <a href="#" onclick={handleBackToLogin}>
                <i class="bi bi-arrow-left"></i>&nbsp;Back to Sign in
              </a>
            </div>
          </div>
        </template>

        <!-- Success view: email sent -->
        <template if:true={isSubmitted}>
          <div class="auth-card-header">
            <div class="auth-success-icon">
              <i class="bi bi-envelope-check-fill"></i>
            </div>
            <h1>Check your email</h1>
            <p class="auth-switch-link">
              {successMessage}
            </p>
          </div>

          <div class="auth-form">
            <button
              type="button"
              id="btn-back-login"
              class="btn-auth-primary"
              onclick={handleBackToLogin}
            >
              Back to Sign in
            </button>

            <div class="auth-back-link" style="margin-top: 1rem; text-align: center;">
              <span style="font-size: 13px; color: var(--color-text-muted, #6c757d);">
                Didn&#39;t receive an email?&nbsp;
              </span>
              <a href="#" id="btn-resend" onclick={handleResend}>Resend</a>
            </div>
          </div>
        </template>

      </div>
    </div>
  </div>
</template>
