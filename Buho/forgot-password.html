<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - BÚHO Insurance</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="centered-layout">
        <div class="auth-card">
            <!-- Header with Logo -->
            <div class="auth-header">
                <div class="auth-logo">
                    <img src="assets/Logo.svg" alt="BÚHO Logo">
                </div>
            </div>

            <!-- Form Content -->
            <div class="auth-content">
                <h2 class="auth-title">Forgot Password?</h2>
                <p class="auth-subtitle">
                    Enter your email address and we'll send you instructions to reset your password.
                </p>

                <!-- Error Message -->
                <div id="errorMessage" class="error-message" style="display: none;">
                    <i class="bi bi-exclamation-circle"></i> <span id="errorText"></span>
                </div>

                <!-- Success Message -->
                <div id="successMessage" class="success-message" style="display: none;">
                    <i class="bi bi-check-circle"></i> <span id="successText"></span>
                </div>

                <!-- Forgot Password Form -->
                <form id="forgotPasswordForm" class="auth-form">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-with-icon">
                            <i class="bi bi-envelope input-icon"></i>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                required
                            >
                        </div>
                    </div>

                    <button type="submit" class="btn-primary" id="submitBtn">
                        Send Reset Instructions
                    </button>
                </form>

                <!-- Success State - Email Sent (initially hidden) -->
                <div id="successState" class="success-state" style="display: none;">
                    <div class="success-icon">
                        <i class="bi bi-envelope-check"></i>
                    </div>
                    <h3>Check Your Email</h3>
                    <p>
                        We've sent password reset instructions to <strong id="sentEmail"></strong>
                    </p>
                    <p class="text-muted">
                        If you don't see the email, check your spam folder or try again.
                    </p>
                    <button type="button" class="btn-secondary" id="tryAgainBtn">
                        Try Another Email
                    </button>
                </div>

                <!-- Back to Login Link -->
                <div class="back-to-login">
                    <a href="index.html" class="back-link">
                        <i class="bi bi-arrow-left"></i> Back to Login
                    </a>
                </div>
            </div>
        </div>

        <!-- Additional Help Text -->
        <div class="help-text">
            <p>
                Need help? Contact our support team at 
                <a href="mailto:support@buho.com">support@buho.com</a>
            </p>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Forgot Password Script -->
    <script src="js/forgot-password.js"></script>
</body>
</html>
