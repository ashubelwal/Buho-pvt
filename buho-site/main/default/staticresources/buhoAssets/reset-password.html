<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BÚHO - Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="centered-layout">
    <div class="page-container">
        <!-- Reset Password Card -->
        <div class="auth-card">
            <!-- Logo -->
            <div class="auth-logo">
                <img src="assets/Logo.svg" alt="BÚHO" class="logo-icon">
            </div>

            <!-- Title -->
            <div class="auth-title">
                <h1>Reset Your <span class="highlight">Password</span></h1>
                <p class="auth-subtitle">Enter your new password</p>
            </div>

            <!-- Reset Password Form -->
            <form class="auth-form" id="resetPasswordForm">
                <div class="form-group">
                    <label for="newPassword">Create New Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="newPassword" name="newPassword" placeholder="Create New Password" required>
                        <button type="button" class="toggle-password" data-target="newPassword" aria-label="Toggle password visibility">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm New Password" required>
                        <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Toggle password visibility">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="back-to-login">
                    <a href="index.html" class="back-link">Back to Sign In</a>
                </div>

                <button type="submit" class="btn-primary">Reset Your Password</button>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/reset-password.js"></script>
</body>
</html>
