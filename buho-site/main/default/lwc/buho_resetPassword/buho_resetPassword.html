<template>
    <div class="centered-layout">
        <div class="page-container">
            <div class="auth-card">
                <!-- Logo -->
                <div class="auth-logo">
                    <img src={logoUrl} alt="BÚHO Insurance Brokerage" class="logo-icon">
                </div>

                <!-- Title Section -->
                <div class="auth-title">
                    <h1>Reset Your <span class="highlight">Password</span></h1>
                    <p class="auth-subtitle">Enter your new password</p>
                </div>

                <!-- Success Message -->
                <template if:true={showSuccess}>
                    <div class="success-message visible">
                        <p>Password reset successfully! Redirecting to login...</p>
                    </div>
                </template>

                <!-- Error Message -->
                <template if:true={errorMessage}>
                    <div class="error-message visible">
                        {errorMessage}
                    </div>
                </template>

                <!-- Reset Password Form -->
                <form class="auth-form" onsubmit={handleSubmit}>
                    <!-- Create New Password -->
                    <div class="form-group">
                        <label for="newPassword">Create New Password</label>
                        <div class="password-input-wrapper">
                            <input
                                type={newPasswordType}
                                id="newPassword"
                                name="newPassword"
                                value={newPassword}
                                placeholder="Create New Password"
                                oninput={handlePasswordChange}
                                required
                                class={newPasswordClass}
                            />
                            <button type="button" class="toggle-password" onclick={toggleNewPassword}>
                                <i class={newPasswordIconClass}></i>
                            </button>
                        </div>

                        <!-- Password Strength Indicator -->
                        <template if:true={newPassword}>
                            <div class="password-strength">
                                <div class="strength-bar">
                                    <div class={strengthBarClass}></div>
                                </div>
                                <small class="strength-text">{strengthText}</small>
                            </div>
                        </template>
                    </div>

                    <!-- Confirm New Password -->
                    <div class="form-group">
                        <label for="confirmPassword">Confirm New Password</label>
                        <div class="password-input-wrapper">
                            <input
                                type={confirmPasswordType}
                                id="confirmPassword"
                                name="confirmPassword"
                                value={confirmPassword}
                                placeholder="Confirm New Password"
                                oninput={handleConfirmPasswordChange}
                                required
                                class={confirmPasswordClass}
                            />
                            <button type="button" class="toggle-password" onclick={toggleConfirmPassword}>
                                <i class={confirmPasswordIconClass}></i>
                            </button>
                        </div>

                        <!-- Password Match Indicator -->
                        <template if:true={showMatchIndicator}>
                            <div class={matchIndicatorClass}>
                                <i class={matchIndicatorIcon}></i> {matchIndicatorText}
                            </div>
                        </template>
                    </div>

                    <!-- Back to Sign In Link -->
                    <div class="back-to-login">
                        <a href="/login" class="back-link">Back to Sign In</a>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn-primary" disabled={isLoading}>
                        <template if:true={isLoading}>
                            <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                        </template>
                        Reset Your Password
                    </button>
                </form>
            </div>
        </div>
    </div>
</template>
