<template>
    <div class="centered-layout forgotpassword">
        <div class="auth-card">
            <!-- Header with Logo -->
            <div class="auth-header">
                <div class="auth-logo">
                    <img src={logoUrl} alt="BÚHO Logo" />
                </div>
            </div>

            <!-- Form Content -->
            <div class="auth-content">
                <h2 class="auth-title">Forgot Password?</h2>
                <p class="auth-subtitle">
                    Enter your email address and we'll send you instructions to reset your password.
                </p>

                <!-- Error Message -->
                <template if:true={errorMessage}>
                    <div class="error-message">
                        <i class="bi bi-exclamation-circle"></i> {errorMessage}
                    </div>
                </template>

                <!-- Success Message -->
                <template if:true={successMessage}>
                    <div class="success-message">
                        <i class="bi bi-check-circle"></i> {successMessage}
                    </div>
                </template>

                <!-- Forgot Password Form -->
                <template if:false={emailSent}>
                    <form class="auth-form" onsubmit={handleSubmit}>
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <div class="input-with-icon">
                                <i class="bi bi-envelope input-icon"></i>
                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    value={email}
                                    placeholder="Enter your email"
                                    oninput={handleEmailChange}
                                    required
                                    class={emailInputClass}
                                />
                            </div>
                        </div>

                        <button 
                            type="submit" 
                            class="btn-primary" 
                            disabled={isLoading}
                        >
                            <template if:true={isLoading}>
                                <span class="spinner-border spinner-border-sm me-2"></span>
                                Sending...
                            </template>
                            <template if:false={isLoading}>
                                Send Reset Instructions
                            </template>
                        </button>
                    </form>
                </template>

                <!-- Success State - Email Sent -->
                <template if:true={emailSent}>
                    <div class="success-state">
                        <div class="success-icon">
                            <i class="bi bi-envelope-check"></i>
                        </div>
                        <h3>Check Your Email</h3>
                        <p>
                            We've sent password reset instructions to <strong>{email}</strong>
                        </p>
                        <p class="text-muted">
                            If you don't see the email, check your spam folder or try again.
                        </p>
                        <button 
                            type="button" 
                            class="btn-secondary" 
                            onclick={handleTryAgain}
                        >
                            Try Another Email
                        </button>
                    </div>
                </template>

                <!-- Back to Login Link -->
                <div class="back-to-login">
                    <a href="#" onclick={handleBackToLogin} class="back-link">
                        <i class="bi bi-arrow-left"></i> Back to Login
                    </a>
                </div>
            </div>
            <!-- Additional Help Text -->
            <div class="help-text">
                <p>
                    Need help? Contact our support team at &nbsp;
                    <a href="mailto:support@buho.com">support@buho.com</a>
                </p>
            </div>
        </div>

        
    </div>
</template>
