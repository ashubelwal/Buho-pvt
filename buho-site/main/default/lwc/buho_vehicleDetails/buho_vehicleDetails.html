<template>
    <div class="vehicle-details-wrapper">
        <!-- Page Title -->
        <div class="step-header">
            <h1>Tell Us About <span class="highlight">Your Vehicle ?</span></h1>
            <p class="step-subtitle">Sharing these details helps us ensure you get the right coverage</p>
        </div>

        <!-- Existing Customer Vehicle Selection -->
        <template if:true={currentUserType}>
            <div class="row g-4">
                <div class="col-12">
                    <lightning-combobox 
                        name="progress" 
                        placeholder={label.selectavehicle} 
                        value={selectedVehicleId}
                        options={vehicleDetails.vehicleList} 
                        onchange={changevehicleOption}>
                    </lightning-combobox>
                </div>
            </div>
        </template>

        <!-- Vehicle Information Form -->
        <form class="wizard-form">
            <!-- Vehicle Type and Year Row -->
            <div class="row g-4">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="vehicleType">Vehicle Type</label>
                        <select 
                            id="vehicleType"
                            name="Vehicle_sub_type__c" 
                            class="form-select"
                            onchange={handleInputChange}
                            required>
                            <option value="">Select Vehicle Type</option>
                            <template for:each={vehicleTypeOptions} for:item="option">
                                <option key={option.value} value={option.value} selected={option.selected}>{option.label}</option>
                            </template>
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="vehicleYear">Vehicle Year</label>
                        <select 
                            id="vehicleYear"
                            name="Year__c" 
                            class="form-select"
                            onchange={handleInputChange}
                            value={year}
                            required>
                            <option value="">Select Year</option>
                            <template for:each={yearOptions} for:item="option">
                                <option key={option.value} value={option.value} selected={option.selected}>{option.label}</option>
                            </template>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Make and Model Row -->
            <div class="row g-4">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="vehicleMake">Vehicle Make</label>
                        <select 
                            id="vehicleMake"
                            name="Make" 
                            class="form-select"
                            onchange={handleMakeChange}
                            required>
                            <option value="">Select Make</option>
                            <template for:each={makeOptions} for:item="option">
                                <option key={option.value} value={option.value} selected={option.selected}>{option.label}</option>
                            </template>
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="vehicleModel">Vehicle Model</label>
                        <select 
                            id="vehicleModel"
                            name="Model" 
                            class="form-select"
                            onchange={handleModelChange}
                            required
                            disabled={booleanVar.isModelLoaded}>
                            <option value="">Select Model</option>
                            <template for:each={modelOptions} for:item="option">
                                <option key={option.value} value={option.value} selected={option.selected}>{option.label}</option>
                            </template>
                        </select>
                        <template if:true={booleanVar.isModelLoaded}>
                            <small class="form-text text-muted">Loading models...</small>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Vehicle Value Row -->
            <div class="row g-4">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="vehicleValue">Vehicle Value</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input 
                                type="number" 
                                id="vehicleValue"
                                name="Value__c"
                                class="form-control" 
                                placeholder="42,500"
                                value={vehicleValue}
                                onchange={handleInputChange}
                                min="0"
                                max="200000"
                                required>
                        </div>
                        <small class="form-text text-muted">Your stated value below will serve as a limit for payout. Company will pay Actual Cash Value based on Kelly Blue and Nada Guides</small>
                    </div>
                </div>
            </div>

            <!-- Coverage Terms Options -->
            <div class="coverage-terms-section">
                <h3 class="section-title">Coverage Terms Option</h3>
                
                <div class="checkbox-options">
                    <div class="custom-checkbox">
                        <input 
                            type="checkbox" 
                            id="hybridElectric" 
                            name="Electric_Hybrid__c"
                            checked={inputValues.Electric_Hybrid__c}
                            onchange={handleInputChange}>
                        <label for="hybridElectric">
                            <span class="checkbox-title">The vehicle is Hybrid or Fully Electric</span>
                            <span class="checkbox-hint">Surcharge may apply. Some carriers charge extra for hybrid vehicles due to higher repair costs.</span>
                        </label>
                    </div>

                    <div class="custom-checkbox">
                        <input 
                            type="checkbox" 
                            id="driversUnder21" 
                            name="is_there_a_driver_under_21__c"
                            checked={inputValues.is_there_a_driver_under_21__c}
                            onchange={handleInputChange}>
                        <label for="driversUnder21">
                            <span class="checkbox-title">Drivers under 21?</span>
                        </label>
                    </div>

                    <div class="custom-checkbox">
                        <input 
                            type="checkbox" 
                            id="businessSignage" 
                            name="is_the_vehicle_used_for_business_purpose__c"
                            checked={inputValues.is_the_vehicle_used_for_business_purpose__c}
                            onchange={handleInputChange}>
                        <label for="businessSignage">
                            <span class="checkbox-title">Business signage on the vehicle</span>
                            <span class="checkbox-hint">Requires commercial coverage add-on</span>
                        </label>
                    </div>

                    <div class="custom-checkbox">
                        <input 
                            type="checkbox" 
                            id="salvageTitle" 
                            name="salvage_vehicle__c"
                            checked={inputValues.salvage_vehicle__c}
                            onchange={handleInputChange}>
                        <label for="salvageTitle">
                            <span class="checkbox-title">Vehicle with a Salvage title?</span>
                            <span class="checkbox-hint">Check this box if vehicle has been rebuilt and DMV-approved for use.</span>
                        </label>
                    </div>

                    <div class="custom-checkbox">
                        <input 
                            type="checkbox" 
                            id="rentalVehicle" 
                            name="Is_this_a_Rental_Vehicle__c"
                            checked={inputValues.Is_this_a_Rental_Vehicle__c}
                            onchange={handleInputChange}>
                        <label for="rentalVehicle">
                            <span class="checkbox-title">Is this vehicle a rental?</span>
                            <span class="checkbox-hint">Check this box if rented from a car rental company</span>
                        </label>
                    </div>

                    <div class="custom-checkbox">
                        <input 
                            type="checkbox" 
                            id="towingAnything" 
                            name="isTowing"
                            checked={inputValues.isTowing}
                            onchange={handleisTowing}>
                        <label for="towingAnything">
                            <span class="checkbox-title">Are you towing anything?</span>
                            <span class="checkbox-hint">Check this box if you will tow a boat, trailer, or other items during your coverage.</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Towing Section (conditionally displayed) -->
            <template if:true={inputValues.isTowing}>
                <div class="towing-section">
                    <c-buho_towed 
                        towed-units={inputValues.towunits}
                        ontowedadd={getTowData}
                        current-user-type={currentUserType}
                        existingtowed-units={vehicleDetails.towunitsList}
                        ontoastevent={handleToastEvent}>
                    </c-buho_towed>
                    <template if:true={booleanVar.towNotAdded}>
                        <div class="error-message visible">
                            Please add at least one towed unit
                        </div>
                    </template>
                </div>
            </template>

            <!-- Continue Button -->
            <button type="button" class="btn btn-primary btn-continue" onclick={handleContinue}>
                Continue To Coverage
            </button>

            <!-- Info Text -->
            <p class="step-info-text">
                Accurate completion of your application is required under our Terms of Use. Providing false information may jeopardize your coverage in the event of a claim.
            </p>
        </form>
    </div>
</template>
