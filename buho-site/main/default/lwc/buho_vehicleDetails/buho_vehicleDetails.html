<template>
    <div class="vehicle-details-wrapper">
        <!-- Page Title -->
        <div class="step-header">
            <h1>Tell Us About <span class="highlight">Your Vehicle ?</span></h1>
            <p class="step-subtitle">Sharing these details helps us ensure you get the right coverage</p>
        </div>

        <!-- Existing Customer Vehicle Selection -->
        <template if:true={currentUserType}>
            <div class="row g-4">
                <div class="col-6">
                    <c-buho_input 
                        type="combobox"
                        name="progress" 
                        placeholder={label.selectavehicle} 
                        value={selectedVehicleId}
                        options={vehicleDetails.vehicleList} 
                        onchange={changevehicleOption}>
                    </c-buho_input>
                </div>
            </div>
        </template>

        <!-- Vehicle Information Form -->
        <form class="wizard-form">
            <!-- Vehicle Type and Year Row -->
            <div class="row g-4">
                <div class="col-md-6">
                    <c-buho_input 
                        type="combobox"
                        label="Vehicle Type"
                        name="Vehicle_sub_type__c" 
                        placeholder="Select Vehicle Type"
                        value={vehicleType}
                        options={vehicleTypeOptions}
                        required
                        onchange={handleInputChange}>
                    </c-buho_input>
                </div>
                <div class="col-md-6">
                    <c-buho_input 
                        type="combobox"
                        label="Vehicle Year"
                        name="Year__c" 
                        placeholder="Select Year"
                        value={year}
                        options={yearOptions}
                        required
                        onchange={handleInputChange}>
                    </c-buho_input>
                </div>
            </div>

            <!-- Make and Model Row -->
            <div class="row g-4">
                <div class="col-md-6">
                    <c-buho_input 
                        type="combobox"
                        label="Vehicle Make"
                        name="Make" 
                        placeholder="Select Make"
                        value={make}
                        options={makeOptions}
                        required
                        onchange={handleMakeChange}>
                    </c-buho_input>
                </div>
                <div class="col-md-6">
                    <c-buho_input 
                        type="combobox"
                        label="Vehicle Model"
                        name="Model" 
                        placeholder="Select Model"
                        value={model}
                        options={modelOptions}
                        disabled={booleanVar.isModelLoaded}
                        required
                        onchange={handleModelChange}>
                    </c-buho_input>
                    <template if:true={booleanVar.isModelLoaded}>
                        <small class="form-text text-muted">Loading models...</small>
                    </template>
                </div>
            </div>

            <!-- Vehicle Value Row -->
            <div class="row g-4">
                <div class="col-12">
                    <div class="form-group">
                        <label for="vehicleValue">Vehicle Value</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <c-buho_input 
                                type="input"
                                input-type="number" 
                                name="Value__c"
                                placeholder="42,500"
                                value={vehicleValue}
                                container-class="flex-1"
                                input-class="form-control input-with-prefix"
                                required
                                onchange={handleInputChange}>
                            </c-buho_input>
                        </div>
                        <small class="form-text text-muted">Your stated value below will serve as a limit for payout. Company will pay Actual Cash Value based on Kelly Blue and Nada Guides</small>
                    </div>
                </div>
            </div>

            <!-- Coverage Terms Options -->
            <div class="coverage-terms-section">
                <h3 class="section-title">Coverage Terms Option</h3>
                
                <div class="checkbox-options">
                    <c-buho_input 
                        type="checkbox"
                        name="Electric_Hybrid__c"
                        label="The vehicle is Hybrid or Fully Electric"
                        hint="Surcharge may apply. Some carriers charge extra for hybrid vehicles due to higher repair costs."
                        checked={inputValues.Electric_Hybrid__c}
                        onchange={handleInputChange}>
                    </c-buho_input>

                    <c-buho_input 
                        type="checkbox"
                        name="is_there_a_driver_under_21__c"
                        label="Drivers under 21?"
                        checked={inputValues.is_there_a_driver_under_21__c}
                        onchange={handleInputChange}>
                    </c-buho_input>

                    <c-buho_input 
                        type="checkbox"
                        name="is_the_vehicle_used_for_business_purpose__c"
                        label="Business signage on the vehicle"
                        hint="Requires commercial coverage add-on"
                        checked={inputValues.is_the_vehicle_used_for_business_purpose__c}
                        onchange={handleInputChange}>
                    </c-buho_input>

                    <c-buho_input 
                        type="checkbox"
                        name="salvage_vehicle__c"
                        label="Vehicle with a Salvage title?"
                        hint="Check this box if vehicle has been rebuilt and DMV-approved for use."
                        checked={inputValues.salvage_vehicle__c}
                        onchange={handleInputChange}>
                    </c-buho_input>

                    <c-buho_input 
                        type="checkbox"
                        name="Is_this_a_Rental_Vehicle__c"
                        label="Is this vehicle a rental?"
                        hint="Check this box if rented from a car rental company"
                        checked={inputValues.Is_this_a_Rental_Vehicle__c}
                        onchange={handleInputChange}>
                    </c-buho_input>

                    <c-buho_input 
                        type="checkbox"
                        name="isTowing"
                        label="Are you towing anything?"
                        hint="Check this box if you will tow a boat, trailer, or other items during your coverage."
                        checked={inputValues.isTowing}
                        onchange={handleisTowing}>
                    </c-buho_input>
                </div>
            </div>

            <!-- Towing Section (conditionally displayed) -->
            <template if:true={isTowning}>
                <div class="towing-section">
                    <c-buho_towed 
                        towed-units={inputValues.towunits}
                        ontowedadd={getTowData}
                        current-user-type={currentUserType}
                        existingtowed-units={vehicleDetails.towunitsList}
                        ontoastevent={handleToastEvent}>
                    </c-buho_towed>
                    <template if:true={booleanVar.towNotAdded}>
                        <div class="error-message visible">
                            Please add at least one towed unit
                        </div>
                    </template>
                </div>
            </template>

            <!-- Continue Button -->
            <button type="button" class="btn btn-primary btn-continue" onclick={handleContinue}>
                Continue To Coverage
            </button>

            <!-- Info Text -->
            <p class="step-info-text">
                Accurate completion of your application is required under our Terms of Use. Providing false information may jeopardize your coverage in the event of a claim.
            </p>
        </form>
    </div>
</template>
