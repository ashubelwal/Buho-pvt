<template>
    <div class="buho-driver-details">
        <div class="wizard-form">
            <div class="step-header">
                <h2>Add Additional Drivers & Operators</h2>
                <p class="step-subtitle">Add all individuals who will be operating this vehicle</p>
            </div>

            <!-- Existing Driver Selection (for returning customers) -->
            <template if:true={currentUserType}>
                <div class="row g-4">
                    <div class="col-md-6">
                        <c-buho_input
                            label="Select a driver"
                            label-class=""
                            container-class="form-group"
                            type="combobox"
                            name="driverSelection"
                            value={selectedDriverId}
                            options={loginUserDriverOption}
                            placeholder="Select a driver"
                            dropdown-class="form-select"
                            onchange={changeDriverOption}>
                        </c-buho_input>
                    </div>
                </div>
            </template>

            <!-- Driver Form -->
            <div class="row g-4">
                <div class="col-md-6">
                    <c-buho_input
                        label="First Name"
                        label-class=""
                        container-class="form-group"
                        type="input"
                        name="First_Name__c"
                        value={driver.First_Name__c}
                        placeholder="Enter First Name"
                        input-type="text"
                        required
                        onchange={handleInputChange}>
                    </c-buho_input>
                </div>

                <div class="col-md-6">
                    <c-buho_input
                        label="Last Name"
                        label-class=""
                        container-class="form-group"
                        type="input"
                        name="Last_Name__c"
                        value={driver.Last_Name__c}
                        placeholder="Enter Last Name"
                        input-type="text"
                        required
                        onchange={handleInputChange}>
                    </c-buho_input>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Date of birth</label>
                        <div class="input-with-icon">
                            <i class="bi bi-calendar3"></i>
                            <input 
                                type="text" 
                                class="form-control dobDate" 
                                name="Dob__c"
                                value={formattedDob}
                                placeholder="MM/DD/YYYY"
                                readonly
                                required>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <c-buho_input
                        label="License Country"
                        label-class=""
                        container-class="form-group"
                        type="combobox"
                        name="License_Country__c"
                        value={driver.License_Country__c}
                        options={countryOptions}
                        placeholder="Select a country"
                        dropdown-class="form-select"
                        required
                        onchange={handleCountryChange}>
                    </c-buho_input>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-md-6">
                    <c-buho_input
                        label="License Number"
                        label-class=""
                        container-class="form-group"
                        type="input"
                        name="license_number__c"
                        value={driver.license_number__c}
                        placeholder="Enter License Number"
                        input-type="text"
                        pattern="^[A-Z0-9\-]+$"
                        max-length="40"
                        required
                        input-class="uppercase-input"
                        onchange={handleInputChange}>
                    </c-buho_input>
                </div>

                <div class="col-md-6">
                    <c-buho_input
                        label="License State"
                        label-class=""
                        container-class="form-group"
                        type="combobox"
                        name="License_state__c"
                        value={driver.License_state__c}
                        options={stateOptions}
                        placeholder="Select a state/province"
                        dropdown-class="form-select"
                        disabled={flag.isStateDisabled}
                        required
                        onchange={handleStateChange}>
                    </c-buho_input>
                </div>
            </div>

            <!-- Add Driver Button -->
            <div class="form-actions">
                <button type="button" 
                        class="btn btn-dark" 
                        onclick={addDriver}>
                    Add Driver & Operator
                </button>
            </div>

            <!-- Drivers Table -->
            <template if:true={drivers.length}>
                <div class="towed-units-table">
                    <div class="table-responsive">
                        <table class="buho-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>License Country</th>
                                    <th>License State</th>
                                    <th>License No</th>
                                    <th>Date of Birth</th>
                                    <th>Type</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={drivers} for:item="drv" for:index="index">
                                    <tr key={drv.diff} data-label="Driver">
                                        <td data-label="Name">{drv.First_Name__c} {drv.Last_Name__c}</td>
                                        <td data-label="License Country">{drv.License_Country__c}</td>
                                        <td data-label="License State">{drv.License_state__c}</td>
                                        <td data-label="License No">{drv.license_number__c}</td>
                                        <td data-label="Date of Birth">{drv.Dob__c}</td>
                                        <td data-label="Type">
                                            <template if:true={drv.Driver_Type__c}>Owner & Driver </template>
                                            <template if:false={drv.Driver_Type__c}>Driver</template>
                                        </td>
                                        <td data-label="Action">
                                            <div class="action-buttons">
                                                <button type="button" 
                                                        class="btn-icon btn-edit" 
                                                        data-index={index}
                                                        onclick={editDriver}
                                                        title="Edit">
                                                    <i class="bi bi-pencil"></i>
                                                </button>
                                                <button type="button" 
                                                        class="btn-icon btn-delete" 
                                                        data-index={index}
                                                        onclick={deleteDriver}
                                                        title="Delete">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </template>

            <!-- Continue Button -->
            <button type="button" 
                    class="btn btn-primary btn-continue" 
                    onclick={handleContinue}>
                Continue
            </button>
        </div>
    </div>
</template>
