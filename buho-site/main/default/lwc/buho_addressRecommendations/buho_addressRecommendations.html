<template>
    <div class="buho-address-recommendations">
        <!-- Search Input using buho_input -->
        <c-buho_input
            label="Start typing address to search"
            label-class=""
            container-class="form-group"
            type="input"
            name="searchAddress"
            value={selectedAddress}
            placeholder="Start typing address to search..."
            input-type="search"
            input-class="searchAddress"
            oninput={handleChange}>
        </c-buho_input>
        
        <!-- Address Recommendations Dropdown -->
        <div if:true={hasRecommendations} class="address-dropdown">
            <ul class="address-dropdown-list" role="listbox">
                <template for:each={addressRecommendations} for:item="addressRecommendation">
                    <li key={addressRecommendation.place_id} 
                        role="presentation"
                        class="address-dropdown-item"
                        onclick={handleAddressRecommendationSelect}
                        data-value={addressRecommendation.place_id}>
                        <div class="address-option">
                            <div class="address-icon">
                                <i class="bi bi-geo-alt"></i>
                            </div>
                            <div class="address-content">
                                <div class="address-main">{addressRecommendation.main_text}</div>
                                <div class="address-secondary">{addressRecommendation.secondary_text}</div>
                            </div>
                        </div>
                    </li>
                </template>
            </ul>
        </div>
    </div>
</template>
