<template>
    <!-- Buho Theme Feedback Component -->
    <div class="buho-container">
        <div class="wizard-main">
            <div class="wizard-container">
                <!-- Feedback Card -->
                <div class="user-details-card">
                    <div class="card-header-section">
                        <h2 class="card-title">Rate Our Service</h2>
                    </div>
                    
                    <div class="card-body-section">
                        <!-- Rating Section -->
                        <div class="form-group">
                            <label class="coverage-label">Please rate your experience:</label>
                            <div class="stars-container" style="display: flex; gap: 8px; margin: 16px 0;">
                                <template for:each={stars} for:item="star">
                                    <button 
                                        key={star.value}
                                        type="button"
                                        class="star-button"
                                        onclick={handleStarClick}
                                        data-value={star.value}
                                        style="background: none; border: none; cursor: pointer; padding: 4px; transition: transform 0.2s ease;">
                                        <svg width="32" height="32" viewBox="0 0 24 24" fill={star.filled} stroke="var(--accent-pink)" stroke-width="2" style="pointer-events: none;">
                                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                                        </svg>
                                    </button>
                                </template>
                            </div>
                        </div>

                        <!-- Feedback Textarea -->
                        <div class="form-group">
                            <c-buho_input
                                type="textarea"
                                label="Additional Feedback (Optional)"
                                name="feedbackText"
                                value={feedbackText}
                                placeholder="Share your thoughts with us..."
                                max-length="500"
                                textarea-style="height: 120px; resize: vertical;"
                                input-class="form-control"
                                onchange={handleFeedbackChange}>
                            </c-buho_input>
                            <small class="form-text" style="color: var(--gray-text); font-size: 12px; margin-top: 6px; display: block;">
                                {remainingChars} characters remaining
                            </small>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="card-footer-section" style="justify-content: flex-start;">
                        <button 
                            class="btn-primary btn-continue"
                            onclick={handleSubmit}
                            style="width: auto; padding: 14px 32px;">
                            Submit Feedback
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
