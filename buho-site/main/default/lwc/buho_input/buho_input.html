<template>
    <div class={computedContainerClass}>
        <!-- Input Type -->
        <template if:true={isInput}>
            <template if:true={label}>
                <label for={name} class={computedLabelClass}>{label}</label>
            </template>

            <!-- Input with Icon -->
            <template if:true={hasIcon}>
                <div class="input-with-icon">
                    <i class={icon}></i>
                    <input 
                        type={inputType} 
                        id={name} 
                        name={name} 
                        value={value} 
                        placeholder={placeholder}
                        class={computedInputClass} 
                        disabled={disabled} 
                        required={required}
                        maxlength={maxLength}
                        pattern={pattern}
                        onchange={handleInputChange}
                        oninput={handleInput} 
                        onkeyup={handleKeyUp}
                        oninvalid={handleInvalid} />
                </div>
                <template if:true={showPatternError}>
                    <small class="form-text" style="color: #EF4444; margin-top: 6px; display: block; font-size: 12px;">{messageWhenPatternMismatch}</small>
                </template>
            </template>

            <!-- Input without Icon -->
            <template if:false={hasIcon}>
                <input 
                    type={inputType} 
                    id={name} 
                    name={name} 
                    value={value} 
                    placeholder={placeholder}
                    class={computedInputClass} 
                    disabled={disabled} 
                    required={required}
                    maxlength={maxLength}
                    pattern={pattern}
                    onchange={handleInputChange} 
                    oninput={handleInput}
                    onkeyup={handleKeyUp}
                    oninvalid={handleInvalid} />
                <template if:true={showPatternError}>
                    <small class="form-text" style="color: #EF4444; margin-top: 6px; display: block; font-size: 12px;">{messageWhenPatternMismatch}</small>
                </template>
            </template>
        </template>

        <!-- Combobox Type -->
        <template if:true={isCombobox}>
            <template if:true={label}>
                <label for={name} class={computedLabelClass}>{label}</label>
            </template>
            <div class="dropdown-container">
                <select id={name} name={name} class={computedDropdownClass} disabled={disabled}
                    required={required}
                    onchange={handleComboboxChange}>
                    <template for:each={comboboxOptions} for:item="option">
                        <option key={option.value} value={option.value} selected={option.isSelected}>
                            {option.label}
                        </option>
                    </template>
                </select>
            </div>
        </template>

        <!-- Checkbox Type -->
        <template if:true={isCheckbox}>
            <div class="custom-checkbox">
                <input type="checkbox" id={name} name={name} checked={checked} disabled={disabled}
                    required={required}
                    onchange={handleCheckboxChange} />
                <template if:true={label}>
                    <label for={name}>
                        <span class={computedLabelTitleClass}>{label}</span>
                        <template if:true={hint}>
                            <span class="checkbox-hint">{hint}</span>
                        </template>
                    </label>
                </template>
            </div>
        </template>

        <!-- Radio Type -->
        <template if:true={isRadio}>
            <div class="radio-container">
                <input type="radio" id={name} name={name} value={value} checked={checked} disabled={disabled}
                    required={required}
                    onchange={handleCheckboxChange} />
                <template if:true={label}>
                    <label for={name} class={computedLabelClass}>{label}</label>
                </template>
            </div>
        </template>

        <!-- Textarea Type -->
        <template if:true={isTextarea}>
            <template if:true={label}>
                <label for={name} class={computedLabelClass}>{label}</label>
            </template>
            <textarea 
                id={name} 
                name={name} 
                placeholder={placeholder}
                class={computedInputClass} 
                disabled={disabled} 
                required={required}
                maxlength={maxLength}
                style={textareaStyle}
                onchange={handleInputChange}>
                {value}
            </textarea>
        </template>
    </div>
</template>
