<template>
    <div class={computedContainerClass}>
        <!-- Input Type -->
        <template if:true={isInput}>
            <template if:true={label}>
                <div class="label-with-tooltip">
                    <label for={name} class={computedLabelClass}>{label}</label>
                    <template if:true={hasTooltip}>
                        <span class="tooltip-icon-wrapper">
                            <i class="bi bi-info-circle tooltip-icon"></i>
                            <span class="tooltip-text">{tooltipText}</span>
                        </span>
                    </template>
                </div>
            </template>

            <!-- Input with Icon -->
            <template if:true={hasIcon}>
                <div class="input-with-icon">
                    <i class={icon}></i>
                    <input 
                        type={inputType} 
                        id={name} 
                        name={name} 
                        value={value} 
                        placeholder={placeholder}
                        class={computedInputClass} 
                        disabled={disabled} 
                        required={required}
                        maxlength={maxLength}
                        pattern={pattern}
                        onchange={handleInputChange}
                        oninput={handleInput} 
                        onkeyup={handleKeyUp}
                        oninvalid={handleInvalid}
                        onblur={handleNativeBlur} />
                </div>
                <template if:true={showPatternError}>
                    <small class="form-text" style="color: #EF4444; margin-top: 6px; display: block; font-size: 12px;">{messageWhenPatternMismatch}</small>
                </template>
            </template>

            <!-- Input without Icon -->
            <template if:false={hasIcon}>
                <input 
                    type={inputType} 
                    id={name} 
                    name={name} 
                    value={value} 
                    placeholder={placeholder}
                    class={computedInputClass} 
                    disabled={disabled} 
                    required={required}
                    maxlength={maxLength}
                    pattern={pattern}
                    onchange={handleInputChange} 
                    oninput={handleInput}
                    onkeyup={handleKeyUp}
                    oninvalid={handleInvalid}
                    onblur={handleNativeBlur} />
                <template if:true={showPatternError}>
                    <small class="form-text" style="color: #EF4444; margin-top: 6px; display: block; font-size: 12px;">{messageWhenPatternMismatch}</small>
                </template>
            </template>
        </template>

        <!-- Combobox Type -->
        <template if:true={isCombobox}>
            <template if:true={label}>
                <div class="label-with-tooltip">
                    <label for={name} class={computedLabelClass}>{label}</label>
                    <template if:true={hasTooltip}>
                        <span class="tooltip-icon-wrapper">
                            <i class="bi bi-info-circle tooltip-icon"></i>
                            <span class="tooltip-text">{tooltipText}</span>
                        </span>
                    </template>
                </div>
            </template>
            
            <div class="dropdown-container">
                <select id={name} name={name} class={computedDropdownClass} disabled={disabled}
                    required={required} value={value}
                    onchange={handleComboboxChange}>
                    <template for:each={comboboxOptions} for:item="option">
                        <option key={option.value} value={option.value} selected={option.isSelected}>
                            {option.label}
                        </option>
                    </template>
                </select>
            </div>
        </template>

        <!-- Searchable Combobox Type -->
        <template if:true={isSearchableCombobox}>
            <template if:true={label}>
                <div class="label-with-tooltip">
                    <label for={name} class={computedLabelClass}>{label}</label>
                    <template if:true={hasTooltip}>
                        <span class="tooltip-icon-wrapper">
                            <i class="bi bi-info-circle tooltip-icon"></i>
                            <span class="tooltip-text">{tooltipText}</span>
                        </span>
                    </template>
                </div>
            </template>

            <div class="searchable-combobox-container">
                <div class="input-with-icon searchable-input-wrapper">
                    <input 
                        type="text" 
                        id={name} 
                        class={computedDropdownClass} 
                        disabled={disabled}
                        required={required}
                        value={searchInputValue}
                        placeholder={placeholder}
                        onfocus={openDropdown}
                        onblur={handleBlur}
                        oninput={handleSearch} 
                        autocomplete="off" />
                    <i class="bi bi-chevron-down dropdown-icon"></i>
                </div>
                <template if:true={_isDropdownOpen}>
                    <div class="searchable-dropdown-list">
                        <ul>
                            <template for:each={filteredOptions} for:item="option">
                                <li key={option.value} data-value={option.value} onmousedown={handleSelectOption} class={option.listItemClass}>
                                    {option.label}
                                </li>
                            </template>
                            <template if:true={noOptionsFound}>
                                <li class="no-options-item">No options found</li>
                            </template>
                        </ul>
                    </div>
                </template>
            </div>
        </template>

        <!-- Checkbox Type -->
         
        <template if:true={isCheckbox}>
            <label class="custom-checkbox">
                <input type="checkbox" id={name} name={name} checked={checked} disabled={disabled}
                    required={required}
                    onchange={handleCheckboxChange} />
                <template if:true={label}>
                    <div>
                        <span class={computedLabelTitleClass}>{label}</span>
                        
                        <template if:true={hint}>
                            <span class="checkbox-hint">{hint}</span>
                        </template>
                    </div>
                    <template if:true={hasTooltip}>
                        <span class="tooltip-icon-wrapper">
                            <i class="bi bi-info-circle tooltip-icon"></i>
                            <span class="tooltip-text">{tooltipText}</span>
                        </span>
                    </template>
                </template>
            </label>
        </template>

        <!-- Radio Type -->
        <template if:true={isRadio}>
            <div class="radio-container">
                <input type="radio" id={name} name={name} value={value} checked={checked} disabled={disabled}
                    required={required}
                    onchange={handleCheckboxChange} />
                <template if:true={label}>
                    <div class="label-with-tooltip">
                        <label for={name} class={computedLabelClass}>{label}</label>
                        <template if:true={hasTooltip}>
                            <span class="tooltip-icon-wrapper">
                                <i class="bi bi-info-circle tooltip-icon"></i>
                                <span class="tooltip-text">{tooltipText}</span>
                            </span>
                        </template>
                    </div>
                </template>
            </div>
        </template>

        <!-- Textarea Type -->
        <template if:true={isTextarea}>
            <template if:true={label}>
                <div class="label-with-tooltip">
                    <label for={name} class={computedLabelClass}>{label}</label>
                    <template if:true={hasTooltip}>
                        <span class="tooltip-icon-wrapper">
                            <i class="bi bi-info-circle tooltip-icon"></i>
                            <span class="tooltip-text">{tooltipText}</span>
                        </span>
                    </template>
                </div>
            </template>
            <textarea 
                id={name} 
                name={name} 
                placeholder={placeholder}
                class={computedInputClass} 
                disabled={disabled} 
                required={required}
                maxlength={maxLength}
                style={textareaStyle}
                onchange={handleInputChange}>
                {value}
            </textarea>
        </template>
    </div>
</template>
