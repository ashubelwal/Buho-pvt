<template>
    <!-- Page Header -->
    <div class="settings-header">
        <h1 class="settings-title">Settings &amp; Account Management</h1>
    </div>

    <!-- Loading State -->
    <template lwc:if={isLoading}>
        <div class="settings-section">
            <lightning-spinner alternative-text="Loading profile..." size="medium"></lightning-spinner>
        </div>
    </template>

    <!-- Error State -->
    <template lwc:if={errorMessage}>
        <div class="settings-section">
            <p class="error-message visible">{errorMessage}</p>
        </div>
    </template>

    <!-- Account Overview -->
    <template lwc:if={userData.name}>
        <div class="settings-section">
            <h3 class="settings-section-title">Account Overview</h3>

            <!-- Name / Email -->
            <div class="settings-grid">
                <div class="settings-field">
                    <span class="settings-label">Name</span>
                    <span class="settings-view-value">{userData.name}</span>
                </div>
                <div class="settings-field">
                    <span class="settings-label">Email</span>
                    <span class="settings-view-value">{userData.email}</span>
                </div>
            </div>

            <!-- Phone / Address -->
            <div class="settings-grid">
                <div class="settings-field">
                    <span class="settings-label">Phone</span>
                    <span class="settings-view-value">{userData.phone}</span>
                </div>
                <div class="settings-field">
                    <span class="settings-label">Address</span>
                    <span class="settings-view-value">{userData.address}</span>
                </div>
            </div>

            <!-- Date Of Birth -->
            <div class="settings-grid settings-grid-single">
                <div class="settings-field">
                    <span class="settings-label">Date Of Birth</span>
                    <span class="settings-view-value">{userData.dateOfBirth}</span>
                </div>
            </div>
        </div>
    </template>

    <!-- Payment Management -->
    <div class="settings-section">
        <c-payment-management></c-payment-management>
    </div>
</template>
