<template>
    <div class="payment-wrapper">
        <!-- Saved Cards Section -->
        <template if:true={showExistingSaveCards}>
            <template if:false={addNewCard}>
                <div class="wizard-form">
                    <div class="step-header">
                        <h2>Payment <span class="highlight">Method</span></h2>
                    </div>

                    <!-- Card Details Title -->
                    <div class="section-title" style="margin-bottom: 24px;">
                        Card Details
                    </div>

                    <!-- Saved Cards List -->
                    <div class="saved-cards-list">
                        <template for:each={saveCreditCard} for:item="cardItem" for:index="index">
                            <div key={cardItem.Index} class="card-option" onclick={handleCardChange} 
                                 data-index={index} data-id={cardItem.Index} data-cardinput="savedCards">
                                <div class="card-radio">
                                    <input 
                                        type="radio" 
                                        name="savedCard" 
                                        id={cardItem.Index}
                                        checked={cardItem.selected}
                                        onchange={handleCardChange}
                                        data-index={index} 
                                        data-id={cardItem.Index} 
                                        data-cardinput="savedCards">
                                </div>
                                <div class="card-info">
                                    <div class="card-logo">
                                        <img src={visaLogoUrl} alt="Visa" />
                                    </div>
                                    <div class="card-details">
                                        <div class="card-number">{cardItem.cardType} •••• {cardItem.cardNumber}</div>
                                        <div class="card-expiry">(Expires {cardItem.expiryMonth}/{cardItem.expiryYear})</div>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Add New Method Button -->
                    <button type="button" class="btn btn-outline-primary add-method-btn" onclick={handleAddNewCard}>
                        Add New Method
                    </button>
                </div>
            </template>
        </template>

        <!-- Add New Card Section -->
        <template if:true={addNewCard}>
            <div class="wizard-form">
                <div class="step-header">
                    <h2>Add Payment <span class="highlight">Method</span></h2>
                </div>

                <!-- Address Information -->
                <div class="section-title" style="margin-bottom: 24px;">
                    Address Information
                </div>

                <template if:true={addressOfbussines}>
                    <template if:false={companyaddress}>
                        <div class="row g-4" style="margin-bottom: 24px;">
                            <div class="col-12">
                                <c-buho_input 
                                    type="checkbox"
                                    name="copyAdd"
                                    label={label.Copyaddressfromcompanyinfo}
                                    checked={copyAddressChecked}
                                    onchange={copyAddress}>
                                </c-buho_input>
                            </div>
                        </div>
                    </template>
                </template>

                <div class="row g-4">
                    <div class="col-md-6">
                        <c-buho_input 
                            type="input"
                            input-type="text"
                            label={label.address}
                            name="address1"
                            placeholder={label.address}
                            value={address}
                            required
                            onchange={handleChange}>
                        </c-buho_input>
                    </div>
                    <div class="col-md-6">
                        <c-buho_input 
                            type="input"
                            input-type="text"
                            label={label.Addressline2}
                            name="address2"
                            placeholder={label.Addressline2}
                            value={address2}
                            onchange={handleChange}>
                        </c-buho_input>
                    </div>
                </div>

                <div class="row g-4">
                    <template if:false={otheCountry}>
                        <div class="col-md-6">
                            <c-buho_input 
                                type="combobox"
                                label={label.Country}
                                name="country"
                                placeholder={label.Country}
                                value={countryValue}
                                options={countryoptions}
                                required
                                onchange={handleChange}>
                            </c-buho_input>
                        </div>
                        <div class="col-md-6">
                            <c-buho_input 
                                type="combobox"
                                label={label.State}
                                name="state"
                                placeholder={label.Stateprovince}
                                value={stateValue}
                                options={stateOption}
                                required
                                onchange={handleChange}>
                            </c-buho_input>
                        </div>
                    </template>

                    <template if:true={otheCountry}>
                        <div class="col-md-6">
                            <c-buho_input 
                                type="input"
                                input-type="text"
                                label={label.Country}
                                name="otherCountry"
                                placeholder={label.Country}
                                value={otherCountryValue}
                                required
                                onchange={handleChange}>
                            </c-buho_input>
                        </div>
                        <div class="col-md-6">
                            <c-buho_input 
                                type="input"
                                input-type="text"
                                label={label.State}
                                name="otherState"
                                placeholder={label.Stateprovince}
                                value={otherStateValue}
                                required
                                onchange={handleChange}>
                            </c-buho_input>
                        </div>
                    </template>
                </div>

                <div class="row g-4">
                    <div class="col-md-6">
                        <c-buho_input 
                            type="input"
                            input-type="text"
                            label={label.City}
                            name="city"
                            placeholder={label.City}
                            value={CityValue}
                            required
                            onchange={handleChange}>
                        </c-buho_input>
                    </div>
                    <div class="col-md-6">
                        <c-buho_input 
                            type="input"
                            input-type="text"
                            label={label.PostalCode}
                            name="zip"
                            placeholder={label.PostalCode}
                            value={postalCode}
                            maxlength="8"
                            required
                            onchange={handleChange}>
                        </c-buho_input>
                    </div>
                </div>

                <!-- Card Details Section -->
                <div class="section-title" style="margin-top: 32px; margin-bottom: 24px;">
                    Card Details
                </div>

                <div class="row g-4">
                    <div class="col-md-6">
                        <c-buho_input 
                            type="input"
                            input-type="text"
                            label={label.CardholderName}
                            name="name"
                            placeholder={label.Nameoncard}
                            value={CardName}
                            required
                            onchange={handleChange}>
                        </c-buho_input>
                    </div>
                    <div class="col-md-6">
                        <c-buho_input 
                            type="input"
                            input-type="text"
                            label={label.CardNumber}
                            name="cardNumber"
                            placeholder={label.CardNumber}
                            value={cardNumber}
                            maxlength="16"
                            required
                            onchange={handleChange}>
                        </c-buho_input>
                    </div>
                </div>

                <div class="row g-4">
                    <div class="col-md-4">
                        <c-buho_input 
                            type="combobox"
                            label={label.ExpirationMonth}
                            name="month"
                            placeholder={label.ExpirationMonth}
                            value={monthValue}
                            options={months}
                            required
                            onchange={handleChange}>
                        </c-buho_input>
                    </div>
                    <div class="col-md-4">
                        <c-buho_input 
                            type="combobox"
                            label={label.Expirationyear}
                            name="year"
                            placeholder={label.Expirationyear}
                            value={yearValue}
                            options={YYYY}
                            required
                            onchange={handleChange}>
                        </c-buho_input>
                    </div>
                    <div class="col-md-4">
                        <c-buho_input 
                            type="input"
                            input-type="text"
                            label={label.SecurityCode}
                            name="code"
                            placeholder={label.SecurityCode}
                            value={cvvNumber}
                            maxlength="4"
                            required
                            onchange={handleChange}>
                        </c-buho_input>
                    </div>
                </div>

                <template if:true={showSaveCards}>
                    <div class="row g-4" style="margin-top: 8px;">
                        <div class="col-12">
                            <c-buho_input 
                                type="checkbox"
                                name="saveCard"
                                label={label.SaveCard}
                                checked={saveCardChecked}
                                onchange={handleChange}>
                            </c-buho_input>
                        </div>
                    </div>
                </template>

                <!-- Terms & Agreements Section -->
                <div class="section-title" style="margin-top: 32px; margin-bottom: 16px;">
                    Terms & Agreements
                </div>

                <div class="terms-section">
                    <c-buho_input 
                        type="checkbox"
                        name="termsOfPurchase"
                        label="I agree to the Terms of Purchase:"
                        hint="By checking this box, I authorize InsureCo to charge my selected payment method for the policy premium and any selected services."
                        checked={termsOfPurchaseChecked}
                        required
                        onchange={handleChange}>
                    </c-buho_input>

                    <c-buho_input 
                        type="checkbox"
                        name="termsOfCancellation"
                        label="I agree to the Cancellation Policy:"
                        hint="By checking this box, I authorize InsureCo to charge my selected payment method for the policy premium and any selected services."
                        checked={termsOfCancellationChecked}
                        required
                        onchange={handleChange}>
                    </c-buho_input>
                </div>

                <!-- Amount Summary Section -->
                <div class="amount-summary">
                    <div class="summary-box">
                        <h3>Amount Summary</h3>
                        <div class="summary-items">
                            <div class="summary-row">
                                <span>Mexico Insurance-6 Day Mapfre :</span>
                                <span>$67.45</span>
                            </div>
                            <div class="summary-row">
                                <span>Faye Travel :</span>
                                <span>$188</span>
                            </div>
                            <div class="summary-row">
                                <span>Docoment Prep - FMM:</span>
                                <span>$45</span>
                            </div>
                            <div class="summary-row">
                                <span>Document Prep - Fishing Permit:</span>
                                <span>$42</span>
                            </div>
                        </div>
                        <div class="summary-total">
                            <span class="total-label">Total:</span>
                            <template if:false={istestcase}>
                                <span class="total-amount">${AmountToCharge}</span>
                            </template>
                            <template if:true={istestcase}>
                                <span class="total-amount">${amounttestcase}</span>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="form-actions" style="justify-content: space-between;">
                    <template if:true={showExistingSaveCards}>
                        <button type="button" class="btn btn-secondary" onclick={handleCancelAddCard}>
                            Cancel
                        </button>
                    </template>
                    <button type="button" class="btn btn-primary btn-continue" onclick={handleSaveCardDetails}>
                        Save Card Details
                    </button>
                </div>
            </div>
        </template>

        <!-- Show Add Card Form Initially if No Saved Cards -->
        <template if:false={showExistingSaveCards}>
            <template if:false={isCardLoaded}>
                <!-- This will be handled by wizard spinner -->
            </template>
        </template>
    </div>
</template>
