<template>
    <div class="towed-units-wrapper">
        <!-- Page Header -->
        <div class="towed-header">
            <h3 class="section-title">Towed Units Additional Details</h3>
            <p class="section-subtitle">Complete the vehicle information for your towed units</p>
        </div>

        <!-- Towed Units Table -->
        <template if:true={hasTowedUnits}>
            <div class="towed-units-table">
                <div class="table-responsive">
                    <table class="buho-table">
                        <thead>
                            <tr>
                                <th>Type</th>
                                <th>Value</th>
                                <th>Days</th>
                                <th>Year</th>
                                <th>Make</th>
                                <th>Model</th>
                                <th>VIN</th>
                                <th>License Plate</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={towedUnitsForTemplate} for:item="unit" for:index="index">
                                <tr key={unit.uid} data-index={index}>
                                    <td data-label="Type">{unit.Towed_Unit_Type__c}</td>
                                    <td data-label="Value">${unit.Towed_Unit_Value__c}</td>
                                    <td data-label="Days">{unit.Days_in_Tow__c} days</td>
                                    <td data-label="Year">{unit.Year__c}</td>
                                    <td data-label="Make">{unit.Make__c}</td>
                                    <td data-label="Model">{unit.Model__c}</td>
                                    <td data-label="VIN">{unit.VIN_Number__c}</td>
                                    <td data-label="License Plate">{unit.Plate__c}</td>
                                    <td data-label="Actions">
                                        <div class="action-buttons">
                                            <template if:false={showEditForm}>
                                                <button 
                                                    type="button"
                                                    class="btn-icon btn-edit" 
                                                    data-index={index} 
                                                    onclick={handleEdit}
                                                    title="Edit">
                                                    <img src={iconEdit} alt="Edit" class="btn-icon-img">
                                                </button>
                                            </template>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </template>

        <!-- Edit Form Section -->
        <template if:true={showEditForm}>
            <div class="towed-form-section">
                <div class="towed-form-grid">
                    <!-- Year -->
                    <c-buho_input
                        label="Year"
                        label-class=""
                        container-class="form-group"
                        type="input"
                        name="Year__c"
                        value={editUnit.Year__c}
                        placeholder="Enter year"
                        input-type="text"
                        onchange={handleInputChange}>
                    </c-buho_input>

                    <!-- Make -->
                    <c-buho_input
                        label="Make"
                        label-class=""
                        container-class="form-group"
                        type="input"
                        name="Make__c"
                        value={editUnit.Make__c}
                        placeholder="Enter make"
                        input-type="text"
                        onchange={handleInputChange}>
                    </c-buho_input>

                    <!-- Model -->
                    <c-buho_input
                        label="Model"
                        label-class=""
                        container-class="form-group"
                        type="input"
                        name="Model__c"
                        value={editUnit.Model__c}
                        placeholder="Enter model"
                        input-type="text"
                        onchange={handleInputChange}>
                    </c-buho_input>

                    <!-- VIN Number -->
                    <c-buho_input
                        label="VIN Number"
                        label-class=""
                        container-class="form-group"
                        type="input"
                        name="VIN_Number__c"
                        value={editUnit.VIN_Number__c}
                        placeholder="Enter VIN number"
                        input-type="text"
                        onchange={handleInputChange}>
                    </c-buho_input>

                    <!-- License Plate -->
                    <c-buho_input
                        label="License Plate"
                        label-class=""
                        container-class="form-group"
                        type="input"
                        name="Plate__c"
                        value={editUnit.Plate__c}
                        placeholder="Enter license plate"
                        input-type="text"
                        onchange={handleInputChange}>
                    </c-buho_input>
                </div>

                <!-- Action Buttons -->
                <div class="form-actions">
                    <button 
                        type="button"
                        class="btn-dark" 
                        onclick={handleSave}>
                        Save
                    </button>
                    <button 
                        type="button"
                        class="btn-light" 
                        onclick={handleCancel}>
                        Cancel
                    </button>
                </div>
            </div>
        </template>

        <!-- Empty State Message -->
        <template if:false={hasTowedUnits}>
            <div class="info-message">
                <p>No towed units found. Please add towed units in the vehicle details section.</p>
            </div>
        </template>

        <!-- Continue Button -->
        <button type="button" class="btn btn-primary btn-continue" onclick={handleContinue}>
            Continue
        </button>
    </div>
</template>
